name: Release Check

on:
  push:
    branches:
      - main
      - master
    paths:
      - "admin-web/**"
      - "backend/nestjs/**"
      - "docs/api/**"
      - "db/**"
      - "infra/**"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/release-check.yml"
  pull_request:
    paths:
      - "admin-web/**"
      - "backend/nestjs/**"
      - "docs/api/**"
      - "db/**"
      - "infra/**"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/release-check.yml"
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/nestjs/package-lock.json
            admin-web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend/nestjs
        run: npm ci

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Ensure system Chrome
        timeout-minutes: 5
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Run official release gate
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
        run: npm run check:release
