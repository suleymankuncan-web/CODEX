name: Release Check

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-contracts:
    name: root-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run migration decision preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/migration-change-warning.mjs

      - name: Run root script and contract tests
        run: npm run test:scripts

  backend-release:
    name: backend-release
    needs: root-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json

      - name: Install backend dependencies
        working-directory: backend/nestjs
        run: npm ci

      - name: Verify backend inputs and release proof
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-stage-ci.mjs backend-release

      - name: Preserve verified backend result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: tmp/release-export/backend-release/bundle.json
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    name: dependency-audit
    needs: root-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Audit backend production dependencies
        run: npm --prefix backend/nestjs run check:release:audit

      - name: Audit frontend production dependencies
        run: npm --prefix admin-web run check:release:audit

  frontend-static:
    name: frontend-static
    outputs:
      artifact_name: ${{ steps.proof.outputs.artifact_name }}
    needs: root-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Ensure system Chrome
        timeout-minutes: 5
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Verify frontend static inputs and proof
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
        run: node scripts/release-stage-ci.mjs frontend-static

      - name: Preserve verified static result and build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: tmp/release-export/frontend-static/bundle.json
          if-no-files-found: error
          retention-days: 1

  frontend-release:
    name: frontend-release
    needs: frontend-static
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Ensure system Chrome
        timeout-minutes: 5
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Download current static build
        id: build-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.frontend-static.outputs.artifact_name }}
          path: tmp/current-frontend-build

      - name: Verify static build identity
        if: steps.build-download.outcome == 'success'
        run: node scripts/release-stage-ci.mjs import-build tmp/current-frontend-build/bundle.json

      - name: Rebuild static proof when the same-run artifact is unavailable
        if: steps.build-download.outcome != 'success'
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
        run: node scripts/release-stage-ci.mjs frontend-static

      - name: Inspect prior completed CI test inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-stage-ci.mjs restore-e2e

      - name: Verify complete frontend E2E inventory
        working-directory: admin-web
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
          RELEASE_RECOVERY_MODE: resume
        run: npm run check:release:e2e

      - name: Prepare completed test inventory
        id: proof
        if: ${{ always() }}
        run: node scripts/release-stage-ci.mjs export-e2e

      - name: Preserve completed test inventory
        if: ${{ always() && steps.proof.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: tmp/release-export/frontend-e2e/bundle.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish Playwright test summary
        if: ${{ always() }}
        working-directory: admin-web
        run: npm run test:e2e:summary

      - name: Upload structured Playwright results and failure artifacts
        # The job summary already records successful proof. Preserve bulky
        # browser artifacts only when a test failure needs investigation.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: admin-web/test-results
          if-no-files-found: ignore
          retention-days: 3

  release-check:
    name: release-check
    needs:
      - root-contracts
      - backend-release
      - frontend-static
      - frontend-release
      - dependency-audit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fail closed unless every canonical proof job succeeded
        env:
          RELEASE_ROOT_CONTRACTS_RESULT: ${{ needs.root-contracts.result }}
          RELEASE_BACKEND_RESULT: ${{ needs.backend-release.result }}
          RELEASE_FRONTEND_STATIC_RESULT: ${{ needs.frontend-static.result }}
          RELEASE_FRONTEND_RESULT: ${{ needs.frontend-release.result }}
          RELEASE_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: node scripts/release-workflow-final.mjs
