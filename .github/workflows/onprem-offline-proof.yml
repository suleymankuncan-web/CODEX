name: on-prem offline proof

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact trusted source SHA proved by the upstream image workflow
        required: true
        type: string
      proof_artifact_name:
        description: Exact full on-prem image proof artifact name
        required: true
        type: string
      proof_run_id:
        description: Exact completed upstream image proof run ID
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source SHA to package
        required: true
        type: string
      proof_artifact_name:
        description: Full proof artifact from the trusted image-proof run
        required: true
        type: string
      proof_run_id:
        description: Completed upstream image-proof run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: onprem-offline-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CADDY_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
  CADDY_CONFIG_IMAGE_ID: sha256:af555904a0961945f16bb323a501457b13a4f7e9bde969b145b97da80b38ecbe
  POSTGRES_IMAGE: postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
  POSTGRES_CONFIG_IMAGE_ID: sha256:75f5a96988cdf694a215073c3e9c001b706b371e2f94df3967f2efdec2787f6b
  POSTGRES_INSPECT_IMAGE: golang:1.26.3-alpine@sha256:91eda9776261207ea25fd06b5b7fed8d397dd2c0a283e77f2ab6e91bfa71079d
  REDIS_IMAGE: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
  REDIS_CONFIG_IMAGE_ID: sha256:2a51817f79255c8b69f86a974459c2e0359aff81417d80158f2b9e541e6f4b33
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
  SEAWEEDFS_CONFIG_IMAGE_ID: sha256:8da20bce07d3a7978d8c2de72351df4b3600cce8f133f6417458aeca796defd0
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  SYFT_IMAGE: anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026
  KEYCLOAK_SYNTHETIC_ACCOUNTS_ENABLED: 'true'
  KEYCLOAK_SYNTHETIC_PHOTO_PROOF_ENABLED: 'true'

jobs:
  local-proof-gate:
    name: local-proof-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Checkout exact expected SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Pin local proof gate Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Require owner-published local proof
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EXECUTION_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/onprem-proof-dispatch.mjs verify-status

  build_bundle:
    name: build signed offline bundle
    needs: local-proof-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_id: ${{ steps.bundle_identity.outputs.release_id }}
      key_fingerprint: ${{ steps.bundle_identity.outputs.key_fingerprint }}
      bootstrap_sha256: ${{ steps.bundle_identity.outputs.bootstrap_sha256 }}
      bundle_archive_manifest_sha256: ${{ steps.bundle_archive.outputs.bundle_archive_manifest_sha256 }}
    steps:
      - name: Checkout trusted source SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Pin bundle toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Establish external proof root
        env:
          PROOF_ROOT: ${{ runner.temp }}/onprem-proof
        run: |
          set -euo pipefail
          test "$PROOF_ROOT" = "$RUNNER_TEMP/onprem-proof"
          rm -rf "$PROOF_ROOT"
          mkdir -p "$PROOF_ROOT/download"
          echo "PROOF_ROOT=$PROOF_ROOT" >> "$GITHUB_ENV"

      - name: Validate caller image-proof run before artifact download
        id: validate_proof_run
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROOF_ARTIFACT_NAME: ${{ inputs.proof_artifact_name }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'

          const expectedSha = process.env.EXPECTED_SHA
          const proofArtifactName = process.env.PROOF_ARTIFACT_NAME
          const proofRunId = process.env.PROOF_RUN_ID
          const repository = process.env.REPOSITORY
          const token = process.env.GITHUB_TOKEN
          const isSha = (value) => /^[a-f0-9]{40}$/.test(String(value ?? ''))
          const isRef = (value) => (
            typeof value === 'string' && (
              /^refs\/(?:heads|tags)\/[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(value) ||
              /^refs\/pull\/[1-9]\d*\/(?:head|merge)$/.test(value)
            )
          )
          if (!isSha(expectedSha) || !/^\d+$/.test(proofRunId ?? '') || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository ?? '') || !token || !/^onprem-image-proof-[a-f0-9]{40}$/.test(proofArtifactName ?? '')) {
            throw new Error('image proof run identity inputs are invalid')
          }
          const endpoint = `https://api.github.com/repos/${repository}/actions/runs/${proofRunId}`
          let response
          try {
            response = await fetch(endpoint, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            })
          } catch {
            throw new Error('image proof run lookup failed')
          }
          if (!response.ok) throw new Error(`image proof run lookup failed (status=${response.status})`)
          let run
          try {
            run = await response.json()
          } catch {
            throw new Error('image proof run response was not valid JSON')
          }
          if (run?.repository?.full_name !== repository || run?.status !== 'completed' || run?.conclusion !== 'success' || run?.head_sha !== expectedSha) {
            throw new Error('image proof run identity mismatch')
          }
          const directStandalone = run?.event === 'workflow_dispatch' && run?.path === '.github/workflows/onprem-image-proof.yml' && run?.name === 'on-prem image proof' && Array.isArray(run?.referenced_workflows) && run.referenced_workflows.length === 0
          const parentRun = run?.event === 'pull_request' && run?.path === '.github/workflows/required-release-gate.yml' && run?.name === 'Required Release Gate' && Array.isArray(run?.referenced_workflows)
          let executionSha
          if (directStandalone) {
            executionSha = run.head_sha
          } else if (parentRun) {
            const workflowReferencePattern = /^([^/]+\/[^/]+)\/(\.github\/workflows\/onprem-image-proof\.yml)@(.*)$/
            const references = run.referenced_workflows
              .map((reference) => {
                const match = typeof reference?.path === 'string' ? reference.path.match(workflowReferencePattern) : undefined
                return match && match[0] === reference.path ? { reference, repository: match[1], path: match[2], pathSha: match[3] } : undefined
              })
              .filter(Boolean)
            if (references.length !== 1) throw new Error('image proof run referenced workflow identity mismatch')
            const [{ reference, repository: referenceRepository, path, pathSha }] = references
            if (referenceRepository !== repository || path !== '.github/workflows/onprem-image-proof.yml' || !/^[a-f0-9]{40}$/.test(pathSha) || reference.sha !== pathSha || !isSha(reference.sha) || !isRef(reference.ref)) {
              throw new Error('image proof run referenced workflow identity mismatch')
            }
            executionSha = reference.sha
          } else {
            throw new Error('image proof run identity mismatch')
          }
          if (!isSha(executionSha) || proofArtifactName !== `onprem-image-proof-${executionSha}`) {
            throw new Error('image proof artifact identity mismatch')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `execution_sha=${executionSha}\n`)
          NODE

      - name: Download upstream image proof artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proof_run_id }}
          name: onprem-image-proof-${{ steps.validate_proof_run.outputs.execution_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/onprem-proof/download

      - name: Download upstream core runtime proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proof_run_id }}
          name: onprem-core-runtime-proof-${{ steps.validate_proof_run.outputs.execution_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/onprem-proof/download

      - name: Download upstream keycloak runtime proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proof_run_id }}
          name: onprem-keycloak-runtime-proof-${{ steps.validate_proof_run.outputs.execution_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/onprem-proof/download

      - name: Download upstream photo-storage proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proof_run_id }}
          name: onprem-photo-storage-proof-${{ steps.validate_proof_run.outputs.execution_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/onprem-proof/download

      - name: Validate proof identity and assemble complete evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXECUTION_SHA: ${{ steps.validate_proof_run.outputs.execution_sha }}
          PROOF_ARTIFACT_NAME: ${{ inputs.proof_artifact_name }}
          PROOF_DOWNLOAD: ${{ runner.temp }}/onprem-proof/download
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXECUTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$PROOF_ARTIFACT_NAME" = "onprem-image-proof-${EXECUTION_SHA}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$PROOF_ROOT" = "$RUNNER_TEMP/onprem-proof"
          rm -rf infra/onprem/core/secret-files infra/onprem/photo-storage/secret-files
          mkdir -p "$PROOF_ROOT"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { copyFileSync, existsSync, mkdirSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs'
          import { basename, join } from 'node:path'
          import { copyContentGuardLayerReceipts } from './scripts/onprem-offline-content-guard-index.mjs'
          const root = process.env.PROOF_DOWNLOAD
          const output = process.env.PROOF_ROOT
          if (!output) throw new Error('external proof root is missing')
          const names = [
            'backend-image.tar', 'frontend-image.tar', 'keycloak-image.tar',
            'backend-sbom.spdx.json', 'frontend-sbom.spdx.json', 'keycloak-sbom.spdx.json',
            'backend-trivy.json', 'frontend-trivy.json', 'keycloak-trivy.json',
            'backend-license-inventory.json', 'frontend-license-inventory.json', 'keycloak-license-inventory.json',
            'backend-image-THIRD_PARTY_NOTICES.txt', 'frontend-image-THIRD_PARTY_NOTICES.txt', 'keycloak-LICENSE.txt',
            'backend-content-guard.json', 'frontend-content-guard.json', 'keycloak-content-guard.json',
            'release-manifest.json', 'content-guard-index.json', 'content-guard-index-public.pem',
            'ephemeral-public.pem', 'onprem-proof-receipt.json',
          ]
          const find = (directory, wanted) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const pathname = join(directory, entry.name)
              if (entry.isDirectory()) { const value = find(pathname, wanted); if (value) return value }
              else if (entry.isFile() && entry.name === wanted) return pathname
            }
            return undefined
          }
          const copyNamed = (name, required = true) => {
            const source = find(root, name)
            if (!source) {
              if (required) throw new Error(`upstream proof artifact is missing: ${name}`)
              return false
            }
            copyFileSync(source, join(output, name))
            return true
          }
          for (const name of names) {
            copyNamed(name)
          }
          copyContentGuardLayerReceipts(root, output)
          for (const name of ['base-license-evidence.tar', 'keycloak-license-paths.txt', 'keycloak-license-reconciliation.json', 'keycloak-license-evidence.tar', 'backend-image-license-reconciliation.json', 'frontend-image-license-reconciliation.json', 'backend-THIRD_PARTY_NOTICES.txt', 'frontend-THIRD_PARTY_NOTICES.txt', 'keycloak-image-manifest.json']) {
            copyNamed(name, false)
          }
          const upstream = JSON.parse(readFileSync(join(output, 'release-manifest.json'), 'utf8'))
          for (const artifact of Object.values(upstream.artifacts ?? {})) {
            const name = basename(String(artifact.path ?? ''))
            if (!name) throw new Error('upstream release manifest artifact path is empty')
            copyNamed(name)
          }
          const runtimeSources = {
            core: 'onprem-core-runtime-receipt.json',
            keycloak: 'onprem-keycloak-runtime-receipt.json',
            'photo-storage': 'onprem-photo-storage-runtime-receipt.json',
          }
          for (const sourceName of Object.values(runtimeSources)) copyFileSync(find(root, sourceName) ?? (() => { throw new Error(`upstream runtime receipt is missing: ${sourceName}`) })(), join(output, sourceName))
          for (const name of ['photo-storage-sbom.spdx.json', 'photo-storage-trivy.json', 'photo-storage-license-receipt.json']) copyNamed(name)
          const receipts = Object.fromEntries(Object.entries(runtimeSources).map(([name, sourceName]) => [name, JSON.parse(readFileSync(join(output, sourceName), 'utf8'))]))
          const expectedSha = process.env.EXPECTED_SHA.toLowerCase()
          const expectedReleases = { core: `onprem-core-${expectedSha}`, keycloak: `onprem-core-${expectedSha}`, 'photo-storage': `onprem-photo-storage-${expectedSha}` }
          if (receipts.core.dataClass !== 'synthetic' || receipts.core.releaseId !== expectedReleases.core || !receipts.core.project || !receipts.core.services || typeof receipts.core.images !== 'object') throw new Error('core runtime receipt schema/release binding is invalid')
          if (receipts.keycloak.schemaVersion !== 1 || receipts.keycloak.dataClass !== 'synthetic' || receipts.keycloak.releaseId !== expectedReleases.keycloak || !receipts.keycloak.keycloak || typeof receipts.keycloak.keycloak !== 'object') throw new Error('Keycloak runtime receipt schema/release binding is invalid')
          if (receipts['photo-storage'].dataClass !== 'synthetic' || receipts['photo-storage'].status !== 'passed' || receipts['photo-storage'].releaseId !== expectedReleases['photo-storage']) throw new Error('photo-storage runtime receipt schema/release binding is invalid')
          const photoHash = [receipts['photo-storage'].fixtureSha256, receipts['photo-storage'].photo?.fixtureSha256, receipts['photo-storage'].storage?.fixtureSha256].find((value) => /^[a-f0-9]{64}$/i.test(String(value)))
          if (!photoHash) throw new Error('photo storage runtime receipt must bind a 64-hex fixture hash')
          const proofReceipt = JSON.parse(readFileSync(join(output, 'onprem-proof-receipt.json'), 'utf8'))
          const receiptSummary = Object.entries(runtimeSources).map(([component, sourceName]) => ({ component, filename: sourceName, sha256: createHash('sha256').update(readFileSync(join(output, sourceName))).digest('hex'), sourceReleaseId: receipts[component].releaseId }))
          writeFileSync(join(output, 'runtime-receipt.json'), `${JSON.stringify({ schemaVersion: 1, dataClass: 'synthetic', releaseId: `onprem-offline-${process.env.EXPECTED_SHA.slice(0, 12)}`, sourceRevision: process.env.EXPECTED_SHA, receipts: receiptSummary, photoStorage: { component: 'photo-storage', fixtureSha256: photoHash } })}\n`)
          writeFileSync(join(output, 'release-receipt.json'), `${JSON.stringify({ schemaVersion: 1, dataClass: 'synthetic', releaseId: `onprem-offline-${process.env.EXPECTED_SHA.slice(0, 12)}`, sourceRevision: process.env.EXPECTED_SHA, proof: proofReceipt })}\n`)
          NODE
          node scripts/onprem-release-manifest.mjs verify --input "$PROOF_ROOT/release-manifest.json" --base-dir "$PROOF_ROOT" --public-key "$PROOF_ROOT/ephemeral-public.pem"
          content_guard_fingerprint="$(node --input-type=module -e "import { createHash, createPublicKey } from 'node:crypto'; import { readFileSync } from 'node:fs'; console.log(createHash('sha256').update(createPublicKey(readFileSync(process.env.PROOF_ROOT + '/content-guard-index-public.pem')).export({type:'spki',format:'der'})).digest('hex'))")"
          node scripts/onprem-offline-content-guard-index.mjs verify --base-dir "$PROOF_ROOT" --input "$PROOF_ROOT/content-guard-index.json" --public-key "$PROOF_ROOT/content-guard-index-public.pem" --trusted-fingerprint "$content_guard_fingerprint"

      - name: Pull pinned vendor images and save immutable archives
        run: |
          set -euo pipefail
          test "$CADDY_IMAGE" = 'caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648'
          test "$CADDY_CONFIG_IMAGE_ID" = 'sha256:af555904a0961945f16bb323a501457b13a4f7e9bde969b145b97da80b38ecbe'
          test "$POSTGRES_IMAGE" = 'postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6'
          test "$POSTGRES_CONFIG_IMAGE_ID" = 'sha256:75f5a96988cdf694a215073c3e9c001b706b371e2f94df3967f2efdec2787f6b'
          test "$REDIS_IMAGE" = 'redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2'
          test "$REDIS_CONFIG_IMAGE_ID" = 'sha256:2a51817f79255c8b69f86a974459c2e0359aff81417d80158f2b9e541e6f4b33'
          test "$SEAWEEDFS_IMAGE" = 'chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d'
          test "$SEAWEEDFS_CONFIG_IMAGE_ID" = 'sha256:8da20bce07d3a7978d8c2de72351df4b3600cce8f133f6417458aeca796defd0'
          readonly CADDY_IMAGE CADDY_CONFIG_IMAGE_ID POSTGRES_IMAGE POSTGRES_CONFIG_IMAGE_ID REDIS_IMAGE REDIS_CONFIG_IMAGE_ID SEAWEEDFS_IMAGE SEAWEEDFS_CONFIG_IMAGE_ID
          vendor_evidence="$PROOF_ROOT/vendor-evidence"
          rm -rf "$vendor_evidence"
          mkdir -p "$vendor_evidence"
          cp infra/onprem/offline/postgres-gosu.trivyignore.yaml "$vendor_evidence/postgres-gosu.trivyignore.yaml"
          docker pull "$POSTGRES_INSPECT_IMAGE"
          for image in caddy postgres redis seaweedfs; do
            case "$image" in
              caddy) ref="$CADDY_IMAGE"; image_id="$CADDY_CONFIG_IMAGE_ID" ;;
              postgres) ref="$POSTGRES_IMAGE"; image_id="$POSTGRES_CONFIG_IMAGE_ID" ;;
              redis) ref="$REDIS_IMAGE"; image_id="$REDIS_CONFIG_IMAGE_ID" ;;
              seaweedfs) ref="$SEAWEEDFS_IMAGE"; image_id="$SEAWEEDFS_CONFIG_IMAGE_ID" ;;
            esac
            docker pull "$ref"
            [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
            archive_tag="${ref%@sha256:*}"
            test "$archive_tag" != "$ref"
            docker tag "$ref" "$archive_tag"
            [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s\n' "$image_id" > "$PROOF_ROOT/${image}-image-id.txt"
            docker save "$archive_tag" -o "$vendor_evidence/${image}-image.tar"
            test -s "$vendor_evidence/${image}-image.tar"
            cp "$vendor_evidence/${image}-image.tar" "$PROOF_ROOT/${image}-image.tar"
            test -s "$PROOF_ROOT/${image}-image.tar"
            if [ "$image" = postgres ]; then
              postgres_container="$(docker create "$ref")"
              if ! docker cp "$postgres_container:/usr/local/bin/gosu" "$vendor_evidence/postgres-gosu"; then
                docker rm -f "$postgres_container" >/dev/null 2>&1 || true
                exit 1
              fi
              docker rm "$postgres_container" >/dev/null
              gosu_sha256="$(sha256sum "$vendor_evidence/postgres-gosu" | awk '{print $1}')"
              gosu_metadata="$(docker run --rm --network none --volume "$vendor_evidence:/work:ro" "$POSTGRES_INSPECT_IMAGE" go version -m /work/postgres-gosu)"
              gosu_go_version="$(awk 'NR == 1 { print $2 }' <<< "$gosu_metadata")"
              gosu_module="$(awk '$1 == "path" { print $2 }' <<< "$gosu_metadata")"
              gosu_module_version="$(awk '$1 == "mod" { print $3 }' <<< "$gosu_metadata")"
              gosu_symbols="$(docker run --rm --network none --volume "$vendor_evidence:/work:ro" "$POSTGRES_INSPECT_IMAGE" go tool nm /work/postgres-gosu)"
              test -n "$gosu_symbols"
              gosu_symbol_count="$(printf '%s\n' "$gosu_symbols" | wc -l | tr -d ' ')"
              main_symbol_present=false
              if grep -Eq ' T main\.main$' <<< "$gosu_symbols"; then
                main_symbol_present=true
              fi
              runtime_main_symbol_present=false
              if grep -Eq ' T runtime\.main$' <<< "$gosu_symbols"; then
                runtime_main_symbol_present=true
              fi
              crypto_tls_symbol_count="$(printf '%s\n' "$gosu_symbols" | grep -c 'crypto/tls' || true)"
              test "$gosu_symbol_count" -eq 2614
              test "$main_symbol_present" = true
              test "$runtime_main_symbol_present" = true
              test "$crypto_tls_symbol_count" -eq 0
              IMAGE_REF="$ref" IMAGE_ID="$image_id" GOSU_SHA256="$gosu_sha256" GOSU_GO_VERSION="$gosu_go_version" GOSU_MODULE="$gosu_module" GOSU_MODULE_VERSION="$gosu_module_version" GOSU_SYMBOL_COUNT="$gosu_symbol_count" MAIN_SYMBOL_PRESENT="$main_symbol_present" RUNTIME_MAIN_SYMBOL_PRESENT="$runtime_main_symbol_present" CRYPTO_TLS_SYMBOL_COUNT="$crypto_tls_symbol_count" VENDOR_EVIDENCE="$vendor_evidence" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const proof = { schemaVersion: 1, dataClass: 'synthetic', image: process.env.IMAGE_REF, configImageId: process.env.IMAGE_ID, gosuSha256: process.env.GOSU_SHA256, gosuGoVersion: process.env.GOSU_GO_VERSION, gosuModule: process.env.GOSU_MODULE, gosuModuleVersion: process.env.GOSU_MODULE_VERSION, gosuSymbolCount: Number(process.env.GOSU_SYMBOL_COUNT), mainSymbolPresent: process.env.MAIN_SYMBOL_PRESENT === 'true', runtimeMainSymbolPresent: process.env.RUNTIME_MAIN_SYMBOL_PRESENT === 'true', cryptoTlsSymbolCount: Number(process.env.CRYPTO_TLS_SYMBOL_COUNT), inspectToolImage: process.env.POSTGRES_INSPECT_IMAGE }
          writeFileSync(`${process.env.VENDOR_EVIDENCE}/postgres-gosu-symbol-proof.json`, `${JSON.stringify(proof)}\n`)
          NODE
            fi
            docker run --rm -v "$vendor_evidence:/out" "$SYFT_IMAGE" \
              "$ref" -o "spdx-json=/out/${image}-sbom.spdx.json"
            if [ "$image" = postgres ]; then
              docker run --rm -v "$vendor_evidence:/out" -v "$vendor_evidence:/policy:ro" "$TRIVY_IMAGE" image \
                --input "/out/${image}-image.tar" --format json --scanners vuln --severity CRITICAL \
                --ignorefile /policy/postgres-gosu.trivyignore.yaml --show-suppressed \
                --exit-code 1 --output "/out/${image}-trivy-vuln.json"
              node scripts/onprem-postgres-vulnerability-exception.mjs verify \
                --scan "$vendor_evidence/postgres-trivy-vuln.json" \
                --symbol-proof "$vendor_evidence/postgres-gosu-symbol-proof.json" \
                --policy infra/onprem/offline/postgres-gosu.trivyignore.yaml \
                --output "$vendor_evidence/postgres-vulnerability-exception-receipt.json"
            else
              docker run --rm -v "$vendor_evidence:/out" "$TRIVY_IMAGE" image \
                --input "/out/${image}-image.tar" --format json --scanners vuln --severity CRITICAL \
                --exit-code 1 --output "/out/${image}-trivy-vuln.json"
            fi
            docker run --rm -v "$vendor_evidence:/out" "$TRIVY_IMAGE" image \
              --input "/out/${image}-image.tar" --format json --scanners secret \
              --exit-code 1 --output "/out/${image}-trivy-secret.json"
          IMAGE_NAME="$image" VENDOR_EVIDENCE="$vendor_evidence" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const image = process.env.IMAGE_NAME
          const root = process.env.VENDOR_EVIDENCE
          if (!image || !root) throw new Error('vendor scan identity is missing')
          const vulnerability = JSON.parse(readFileSync(join(root, `${image}-trivy-vuln.json`), 'utf8'))
          const secret = JSON.parse(readFileSync(join(root, `${image}-trivy-secret.json`), 'utf8'))
          writeFileSync(join(root, `${image}-trivy.json`), `${JSON.stringify({ schemaVersion: 1, image, scans: { vulnerability, secret } })}\n`)
          NODE
            test -s "$vendor_evidence/${image}-sbom.spdx.json"
            test -s "$vendor_evidence/${image}-trivy-vuln.json"
            test -s "$vendor_evidence/${image}-trivy-secret.json"
            test -s "$vendor_evidence/${image}-trivy.json"
            cp "$vendor_evidence/${image}-sbom.spdx.json" "$PROOF_ROOT/${image}-sbom.spdx.json"
            cp "$vendor_evidence/${image}-trivy-vuln.json" "$PROOF_ROOT/${image}-trivy-vuln.json"
            cp "$vendor_evidence/${image}-trivy-secret.json" "$PROOF_ROOT/${image}-trivy-secret.json"
            cp "$vendor_evidence/${image}-trivy.json" "$PROOF_ROOT/${image}-trivy.json"
            if [ "$image" = postgres ]; then
              test -s "$vendor_evidence/postgres-gosu-symbol-proof.json"
              test -s "$vendor_evidence/postgres-vulnerability-exception-receipt.json"
              cp "$vendor_evidence/postgres-gosu-symbol-proof.json" "$PROOF_ROOT/postgres-gosu-symbol-proof.json"
              cp "$vendor_evidence/postgres-vulnerability-exception-receipt.json" "$PROOF_ROOT/postgres-vulnerability-exception-receipt.json"
            fi
            printf '%s\n' '{"schemaVersion":1,"dataClass":"synthetic","image":"'"$ref"'","imageId":"'"$image_id"'","sbom":"'"${image}-sbom.spdx.json"'","vulnerabilityReport":"'"${image}-trivy.json"'","secretReport":"'"${image}-trivy-secret.json"'","licenseSource":"SPDX package license assertions"}' > "$PROOF_ROOT/${image}-license-inventory.json"
          done

      - name: Generate complete offline metadata and migration compatibility evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BUILD_TIMESTAMP: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey, generateKeyPairSync } from 'node:crypto'
          import { chmodSync, cpSync, existsSync, mkdirSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs'
           import { dirname, join, resolve } from 'node:path'
           import { inspectDockerSaveArchive } from './scripts/onprem-offline-archive.mjs'
           const expectedSha = process.env.EXPECTED_SHA
           const releaseId = `onprem-offline-${expectedSha.slice(0, 12)}`
           const proofRoot = process.env.PROOF_ROOT
           if (!proofRoot) throw new Error('external proof root is missing')
           const manifest = JSON.parse(readFileSync(join(proofRoot, 'release-manifest.json'), 'utf8'))
           const imageNames = ['backend', 'frontend', 'keycloak', 'caddy', 'postgres', 'redis', 'seaweedfs']
           const imageIds = { ...manifest.imageIds }
           for (const name of ['caddy', 'postgres', 'redis', 'seaweedfs']) imageIds[name] = readFileSync(join(proofRoot, `${name}-image-id.txt`), 'utf8').trim()
           const images = {}
           const archivePaths = { backend: 'images/backend.tar', frontend: 'images/frontend.tar', keycloak: 'images/keycloak.tar', caddy: 'images/caddy.tar', postgres: 'images/postgres.tar', redis: 'images/redis.tar', seaweedfs: 'images/seaweedfs.tar' }
           const vendorRefs = Object.freeze({ caddy: 'caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648', postgres: 'postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6', redis: 'redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2', seaweedfs: 'chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d' })
           const expectedVendorConfigImageIds = Object.freeze({ caddy: 'sha256:af555904a0961945f16bb323a501457b13a4f7e9bde969b145b97da80b38ecbe', postgres: 'sha256:75f5a96988cdf694a215073c3e9c001b706b371e2f94df3967f2efdec2787f6b', redis: 'sha256:2a51817f79255c8b69f86a974459c2e0359aff81417d80158f2b9e541e6f4b33', seaweedfs: 'sha256:8da20bce07d3a7978d8c2de72351df4b3600cce8f133f6417458aeca796defd0' })
           for (const name of imageNames) {
             const archivePath = join(proofRoot, `${name}-image.tar`)
             const vendor = vendorRefs[name]
             if (expectedVendorConfigImageIds[name] && imageIds[name] !== expectedVendorConfigImageIds[name]) throw new Error('vendor config image ID mismatch')
             const archive = inspectDockerSaveArchive(archivePath, { imageId: imageIds[name], ...(vendor ? { identity: vendor } : {}) })
             images[name] = { name, archive: archivePaths[name], repoTag: archive.repoTag, configImageId: archive.imageId, archiveSha256: archive.archiveSha256, registryDigestAttestedByOwner: Boolean(vendor), ...(vendor ? { registryManifestDigest: vendor.slice(vendor.lastIndexOf('@') + 1) } : {}) }
           }
           const appNames = ['backend', 'frontend', 'keycloak']
           const appEvidence = (prefix) => Object.fromEntries(appNames.map((name) => [name, JSON.parse(readFileSync(join(proofRoot, `${name}-${prefix}.json`), 'utf8'))]))
           const fileSha256 = (pathname) => createHash('sha256').update(readFileSync(pathname)).digest('hex')
           const artifact = (pathname) => ({ path: `evidence/${pathname}`, sha256: fileSha256(join(proofRoot, pathname)) })
           const vendorIdentity = Object.fromEntries(['caddy', 'postgres', 'redis', 'seaweedfs'].map((name) => [name, { configImageId: images[name].configImageId, archive: images[name].archive, registryReference: vendorRefs[name], registryManifestDigest: images[name].registryManifestDigest, artifacts: { sbom: artifact(`${name}-sbom.spdx.json`), vulnerabilityReport: artifact(`${name}-trivy.json`), vulnerabilityScan: artifact(`${name}-trivy-vuln.json`), sensitiveDataScan: artifact(`${name}-trivy-secret.json`), licenseInventory: artifact(`${name}-license-inventory.json`), ...(name === 'postgres' ? { vulnerabilityExceptionReceipt: artifact('postgres-vulnerability-exception-receipt.json'), vulnerabilityExceptionSymbolProof: artifact('postgres-gosu-symbol-proof.json') } : {}) } }]))
           writeFileSync(join(proofRoot, 'sbom.json'), JSON.stringify({ schemaVersion: 1, dataClass: 'synthetic', components: { ...appEvidence('sbom.spdx'), ...vendorIdentity } }) + '\n')
           writeFileSync(join(proofRoot, 'license-inventory.json'), JSON.stringify({ schemaVersion: 1, dataClass: 'synthetic', inventories: { ...appEvidence('license-inventory'), ...vendorIdentity } }) + '\n')
           writeFileSync(join(proofRoot, 'vulnerability-report.json'), JSON.stringify({ schemaVersion: 1, dataClass: 'synthetic', reports: { ...appEvidence('trivy'), ...vendorIdentity } }) + '\n')
          const resolveMigrationSql = (filePath, activeIncludes = new Set()) => { const absolutePath = resolve(filePath); if (activeIncludes.has(absolutePath)) throw new Error(`circular migration include: ${absolutePath}`); activeIncludes.add(absolutePath); try { const raw = readFileSync(absolutePath, 'utf8'); return raw.replace(/^\\i\s+(.+?)\s*$/gm, (_match, relativePath) => { const trimmed = relativePath.trim(); const unquoted = (trimmed.startsWith('"') && trimmed.endsWith('"')) || (trimmed.startsWith("'") && trimmed.endsWith("'")) ? trimmed.slice(1, -1) : trimmed; return resolveMigrationSql(resolve(dirname(absolutePath), unquoted), activeIncludes) }) } finally { activeIncludes.delete(absolutePath) } }
          const migrationFiles = readdirSync('db/migrations').filter((file) => file.endsWith('.sql')).sort()
          if (migrationFiles.length === 0) throw new Error('migration tree is missing')
          const hash = createHash('sha256')
          for (const file of migrationFiles) hash.update(file).update('\0').update(resolveMigrationSql(join('db/migrations', file))).update('\0')
          const migrationTreeDigest = hash.digest('hex')
           writeFileSync(join(proofRoot, 'migration-compatibility.json'), JSON.stringify({ schemaVersion: 1, releaseId, migrationTreeDigest, compatibleFrom: [], upgradeCompatible: true, rollbackCompatible: true }) + '\n')
          const { privateKey, publicKey } = generateKeyPairSync('ed25519')
          const privatePath = join(process.env.RUNNER_TEMP, 'onprem-offline-private.pem')
          const publicPath = join(process.env.RUNNER_TEMP, 'onprem-offline-public.pem')
          writeFileSync(privatePath, privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 }); chmodSync(privatePath, 0o600)
          writeFileSync(publicPath, publicKey.export({ type: 'spki', format: 'pem' }), { mode: 0o644 })
          const fingerprint = createHash('sha256').update(publicKey.export({ type: 'spki', format: 'der' })).digest('hex')
          const metadata = { schemaVersion: 1, configSchemaVersion: 1, dataClass: 'synthetic', releaseId, sourceRevision: expectedSha, createdAt: new Date(process.env.BUILD_TIMESTAMP || Date.now()).toISOString(), images }
           writeFileSync(join(proofRoot, 'offline-metadata.json'), JSON.stringify(metadata) + '\n')
           writeFileSync(join(proofRoot, 'offline-trust-fingerprint.txt'), `${fingerprint}\n`)
           writeFileSync(join(proofRoot, 'offline-trust-receipt.json'), JSON.stringify({ schemaVersion: 1, dataClass: 'synthetic', releaseId, sourceRevision: expectedSha, keyFingerprintSha256: fingerprint }) + '\n')
          NODE

      - name: Stage source-free release closure
        run: |
          set -euo pipefail
          node scripts/onprem-offline-stage.mjs --repo-root "$GITHUB_WORKSPACE" --proof-dir "$PROOF_ROOT" --output-dir "$RUNNER_TEMP/onprem-staged" --metadata "$PROOF_ROOT/offline-metadata.json"

      - name: Create and verify signed offline bundle
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          upstream_fingerprint="$(node --input-type=module -e "import { createHash, createPublicKey } from 'node:crypto'; import { readFileSync } from 'node:fs'; console.log(createHash('sha256').update(createPublicKey(readFileSync(process.env.PROOF_ROOT + '/ephemeral-public.pem')).export({type:'spki',format:'der'})).digest('hex'))")"
          content_guard_fingerprint="$(node --input-type=module -e "import { createHash, createPublicKey } from 'node:crypto'; import { readFileSync } from 'node:fs'; console.log(createHash('sha256').update(createPublicKey(readFileSync(process.env.PROOF_ROOT + '/content-guard-index-public.pem')).export({type:'spki',format:'der'})).digest('hex'))")"
          bundle_fingerprint="$(tr -d '\r\n' < "$PROOF_ROOT/offline-trust-fingerprint.txt")"
          archives="$RUNNER_TEMP/onprem-bundle-archives"
          work="$RUNNER_TEMP/onprem-bundle-work"
          test ! -e "$archives" && test ! -L "$archives"
          test ! -e "$work" && test ! -L "$work"
          mkdir -m 0700 "$archives" "$work"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
           const root = process.env.RUNNER_TEMP
           const proofRoot = process.env.PROOF_ROOT
           if (!proofRoot) throw new Error('external proof root is missing')
           const base = JSON.parse(readFileSync(join(proofRoot, 'offline-metadata.json'), 'utf8'))
           const digest = JSON.parse(readFileSync(join(proofRoot, 'migration-compatibility.json'), 'utf8')).migrationTreeDigest
          const previous = `onprem-previous-${process.env.EXPECTED_SHA.slice(0, 12)}`
          const current = base.releaseId
          const next = `onprem-next-${process.env.EXPECTED_SHA.slice(0, 12)}`
          const transitionEvidenceScope = 'same-build-lifecycle-mechanics'
          for (const [name, releaseId, sourceReleaseId] of [['previous', previous, null], ['current', current, previous], ['next', next, current]]) {
            const compatibility = { schemaVersion: 1, releaseId, migrationTreeDigest: digest, compatibleFrom: sourceReleaseId ? [{ sourceReleaseId, sourceMigrationTreeDigest: digest }] : [], upgradeCompatible: true, rollbackCompatible: true }
            writeFileSync(join(proofRoot, `migration-compatibility-${name}.json`), `${JSON.stringify(compatibility)}\n`)
             writeFileSync(join(proofRoot, `offline-metadata-${name}.json`), `${JSON.stringify({ ...base, releaseId })}\n`)
          }
          console.log(`release transition evidence scope: ${transitionEvidenceScope}`)
          NODE
          staged_kib="$(du -sk "$RUNNER_TEMP/onprem-staged" | awk '{print $1}')"
          test "$staged_kib" -gt 0
          preflight_reserve_kib=2000000
          maximum_bundle_copies=3
          require_build_capacity() {
            local available_kib required_kib
            available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
            required_kib="$((preflight_reserve_kib + (maximum_bundle_copies * staged_kib)))"
            echo "offline bundle capacity forecast: available_kib=$available_kib preflight_reserve_kib=$preflight_reserve_kib staged_kib=$staged_kib maximum_bundle_copies=$maximum_bundle_copies required_kib=$required_kib"
            test "$available_kib" -ge "$required_kib" || { echo "offline bundle build capacity is insufficient" >&2; exit 1; }
          }
          create_release_bundle() {
            local release="$1" staging="$2" bundle_dir="$work/$1"
            cp -- "$PROOF_ROOT/migration-compatibility-${release}.json" "$staging/evidence/migration-compatibility.json"
            node scripts/onprem-offline-bundle.mjs create \
               --input "$PROOF_ROOT/offline-metadata-${release}.json" --staging-dir "$staging" --output-dir "$bundle_dir" \
               --private-key "$RUNNER_TEMP/onprem-offline-private.pem" --trusted-public-key "$RUNNER_TEMP/onprem-offline-public.pem" --trusted-fingerprint "$bundle_fingerprint" \
               --upstream-manifest "$PROOF_ROOT/release-manifest.json" --upstream-public-key "$PROOF_ROOT/ephemeral-public.pem" --upstream-trusted-fingerprint "$upstream_fingerprint" --upstream-base-dir "$PROOF_ROOT" \
               --content-guard-index "$PROOF_ROOT/content-guard-index.json" --content-guard-public-key "$PROOF_ROOT/content-guard-index-public.pem" --content-guard-trusted-fingerprint "$content_guard_fingerprint"
            node scripts/onprem-offline-bundle.mjs verify --bundle-dir "$bundle_dir" --public-key "$RUNNER_TEMP/onprem-offline-public.pem" --trusted-fingerprint "$bundle_fingerprint"
          }
          require_build_capacity
          create_release_bundle current "$RUNNER_TEMP/onprem-staged"
          rm -rf -- "$RUNNER_TEMP/onprem-staged"
          test ! -e "$RUNNER_TEMP/onprem-staged" && test ! -L "$RUNNER_TEMP/onprem-staged"
          for release in previous next; do
            require_build_capacity
            staging="$work/${release}-staging"
            test ! -e "$staging" && test ! -L "$staging"
            cp -a -- "$work/current" "$staging"
            rm -f -- "$staging/bundle-manifest.json" "$staging/bundle-signature.json"
            create_release_bundle "$release" "$staging"
            bundle_dir="$work/$release"
            transition_dir="$work/${release}-transition"
            node --input-type=module - "$work/current" "$bundle_dir" "$transition_dir" "$release" <<'NODE'
            import { chmodSync, copyFileSync, mkdirSync, readFileSync } from 'node:fs'
            import { dirname, join } from 'node:path'
            const [currentRoot, targetRoot, outputRoot, releaseName] = process.argv.slice(2)
            const readJson = (root, path) => JSON.parse(readFileSync(join(root, path), 'utf8'))
            const canonical = (value) => Array.isArray(value) ? value.map(canonical) : value && typeof value === 'object' ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])])) : value
            const same = (left, right) => JSON.stringify(canonical(left)) === JSON.stringify(canonical(right))
            const current = readJson(currentRoot, 'bundle-manifest.json')
            const target = readJson(targetRoot, 'bundle-manifest.json')
            const allowedDelta = 'evidence/migration-compatibility.json'
            if (target.releaseId !== `onprem-${releaseName}-${current.releaseId.slice(current.releaseId.lastIndexOf('-') + 1)}` || !same(current.images, target.images) || current.schemaVersion !== target.schemaVersion || current.configSchemaVersion !== target.configSchemaVersion || current.dataClass !== target.dataClass || current.sourceRevision !== target.sourceRevision || current.createdAt !== target.createdAt || current.archiveConfigImageIdDerived !== target.archiveConfigImageIdDerived || current.files.length !== target.files.length) throw new Error('transition bundle differs outside migration compatibility evidence')
            for (let index = 0; index < current.files.length; index += 1) {
              const before = current.files[index]
              const after = target.files[index]
              if (before.path !== after.path || before.mode !== after.mode || (after.path !== allowedDelta && !same(before, after)) || (after.path === allowedDelta && (!Number.isSafeInteger(after.bytes) || after.bytes <= 0 || !/^[a-f0-9]{64}$/.test(after.sha256)))) throw new Error('transition bundle differs outside migration compatibility evidence')
            }
            for (const path of ['bundle-manifest.json', 'bundle-signature.json', allowedDelta]) {
              const destination = join(outputRoot, path)
              mkdirSync(dirname(destination), { recursive: true })
              copyFileSync(join(targetRoot, path), destination)
              chmodSync(destination, 0o644)
            }
          NODE
            tar --sort=name --format=posix --owner=0 --group=0 --numeric-owner -C "$work" -cf "$archives/${release}-transition.tar" "${release}-transition"
            test -s "$archives/${release}-transition.tar" && test ! -L "$archives/${release}-transition.tar"
            transition_members="$(tar -tf "$archives/${release}-transition.tar")"
            test "$(printf '%s\n' "$transition_members" | wc -l)" -eq 5
            printf '%s\n' "$transition_members" | awk -v prefix="${release}-transition" '($0 == prefix "/" || $0 == prefix "/bundle-manifest.json" || $0 == prefix "/bundle-signature.json" || $0 == prefix "/evidence/" || $0 == prefix "/evidence/migration-compatibility.json") { next } { bad = 1 } END { exit bad ? 1 : 0 }'
            tar -tvf "$archives/${release}-transition.tar" | awk '$1 !~ /^[-d]/ { bad = 1 } END { exit bad ? 1 : 0 }'
            rm -rf -- "$bundle_dir"
            rm -rf -- "$transition_dir"
            rm -rf -- "$staging"
          done
          tar --sort=name --format=posix --owner=0 --group=0 --numeric-owner -C "$work" -cf "$archives/current.tar" current
          test -s "$archives/current.tar" && test ! -L "$archives/current.tar"
          test "$(tar -tf "$archives/current.tar" | head -n 1)" = 'current/'
          tar -tf "$archives/current.tar" | awk '$0 ~ /(^|\/)\.\.?($|\/)/ || $0 !~ /^current\// { bad = 1 } END { exit bad ? 1 : 0 }'
          tar -tvf "$archives/current.tar" | awk '$1 !~ /^[-d]/ { bad = 1 } END { exit bad ? 1 : 0 }'
          bundle_dir="$work/current"
          rm -rf -- "$bundle_dir"
          rmdir "$work"
          (cd "$archives" && sha256sum current.tar next-transition.tar previous-transition.tar > SHA256SUMS)
          test "$(find "$archives" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'SHA256SUMS current.tar next-transition.tar previous-transition.tar '

      - name: Emit trust receipt and bundle identity
        id: bundle_identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          release_id="$(node -p "JSON.parse(require('fs').readFileSync('$PROOF_ROOT/offline-metadata-current.json','utf8')).releaseId")"
          fingerprint="$(tr -d '\r\n' < "$PROOF_ROOT/offline-trust-fingerprint.txt")"
          mkdir -p "$RUNNER_TEMP/onprem-trust"
          cp "$RUNNER_TEMP/onprem-offline-public.pem" "$RUNNER_TEMP/onprem-trust/public-key.pem"
          cp "$PROOF_ROOT/offline-trust-fingerprint.txt" "$RUNNER_TEMP/onprem-trust/fingerprint.txt"
          cp "$PROOF_ROOT/offline-trust-receipt.json" "$RUNNER_TEMP/onprem-trust/receipt.json"
          cp scripts/onprem-offline-bootstrap-verify.mjs "$RUNNER_TEMP/onprem-trust/onprem-offline-bootstrap-verify.mjs"
          bootstrap_sha256="$(sha256sum "$RUNNER_TEMP/onprem-trust/onprem-offline-bootstrap-verify.mjs" | awk '{print $1}')"
          printf '%s\n' "$bootstrap_sha256" | grep -Eq '^[a-f0-9]{64}$'
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "key_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "bootstrap_sha256=$bootstrap_sha256" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/onprem-offline-private.pem"

      - name: Archive verified offline bundles for mode-preserving handoff
        id: bundle_archive
        run: |
          set -euo pipefail
          archives="$RUNNER_TEMP/onprem-bundle-archives"
          test "$(find "$archives" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'SHA256SUMS current.tar next-transition.tar previous-transition.tar '
          (cd "$archives" && sha256sum --check SHA256SUMS)
          bundle_archive_manifest_sha256="$(sha256sum "$archives/SHA256SUMS" | awk '{print $1}')"
          printf '%s\n' "$bundle_archive_manifest_sha256" | grep -Eq '^[a-f0-9]{64}$'
          echo "bundle_archive_manifest_sha256=$bundle_archive_manifest_sha256" >> "$GITHUB_OUTPUT"
          test "$PROOF_ROOT" = "$RUNNER_TEMP/onprem-proof"
          rm -rf -- "$PROOF_ROOT"
          for ref in "$CADDY_IMAGE" "$POSTGRES_IMAGE" "$REDIS_IMAGE" "$SEAWEEDFS_IMAGE"; do
            docker image rm "$ref" "${ref%@sha256:*}" >/dev/null 2>&1 || true
          done

      - name: Upload signed offline bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-offline-bundle-${{ inputs.expected_sha }}
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/onprem-bundle-archives

      - name: Upload public trust evidence (never private key)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-offline-trust-${{ inputs.expected_sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/onprem-trust

  offline_rehearsal:
    name: clean Linux offline rehearsal
    needs: build_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pin rehearsal Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Capture exact pinned Node runtime
        run: |
          set -euo pipefail
          pinned_node_source="$(command -v node)"
          case "$pinned_node_source" in /*) ;; *) echo 'pinned Node path is not absolute' >&2; exit 1 ;; esac
          test -f "$pinned_node_source" && test ! -L "$pinned_node_source"
          test "$("$pinned_node_source" --version)" = v24.19.0
          printf 'PINNED_NODE_SOURCE=%s\n' "$pinned_node_source" >> "$GITHUB_ENV"

      - name: Download only the signed bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: onprem-offline-bundle-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/offline-incoming

      - name: Download public trust evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: onprem-offline-trust-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/offline-incoming/trust

      - name: Disable egress before any bundle verification or Docker mutation
        run: |
          set -euo pipefail
          test ! -d "$GITHUB_WORKSPACE/.git"
          test ! -d "$GITHUB_WORKSPACE/backend"; test ! -d "$GITHUB_WORKSPACE/admin-web"; test ! -d "$GITHUB_WORKSPACE/node_modules"
          sudo iptables-save | sudo tee "$RUNNER_TEMP/offline-firewall.snapshot" >/dev/null
          sudo ip6tables-save | sudo tee "$RUNNER_TEMP/offline-firewall6.snapshot" >/dev/null
          test -s "$RUNNER_TEMP/offline-firewall.snapshot"
          test -s "$RUNNER_TEMP/offline-firewall6.snapshot"
          sudo chown 0:0 "$RUNNER_TEMP/offline-firewall.snapshot"
          sudo chown 0:0 "$RUNNER_TEMP/offline-firewall6.snapshot"
          sudo chmod 600 "$RUNNER_TEMP/offline-firewall.snapshot"
          sudo chmod 600 "$RUNNER_TEMP/offline-firewall6.snapshot"
          docker_egress_chain=HR_AXIS_OFF_DOCKER_EGRESS
          host_egress_chain=HR_AXIS_OFFLINE_HOST_EGRESS
          host6_egress_chain=HR_AXIS_OFFLINE_HOST6_EGRESS
          if sudo iptables -S "$docker_egress_chain" >/dev/null 2>&1; then
            echo 'offline Docker egress chain already exists; refusing to reuse mutable firewall state' >&2
            exit 1
          fi
          if sudo iptables -S "$host_egress_chain" >/dev/null 2>&1 || sudo ip6tables -S "$host6_egress_chain" >/dev/null 2>&1; then
            echo 'offline host egress chain already exists; refusing to reuse mutable firewall state' >&2
            exit 1
          fi
          sudo iptables -S DOCKER-USER >/dev/null 2>&1 || { echo 'DOCKER-USER chain is unavailable; refusing to continue' >&2; exit 1; }
          sudo iptables -S FORWARD >/dev/null 2>&1 || { echo 'FORWARD chain is unavailable; refusing to continue' >&2; exit 1; }
          sudo iptables -N "$docker_egress_chain"
          sudo iptables -A "$docker_egress_chain" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A "$docker_egress_chain" -i br+ -o br+ -j ACCEPT
          sudo iptables -A "$docker_egress_chain" -i docker0 -o docker0 -j ACCEPT
          sudo iptables -A "$docker_egress_chain" -i br+ -o docker0 -j ACCEPT
          sudo iptables -A "$docker_egress_chain" -i docker0 -o br+ -j ACCEPT
          sudo iptables -A "$docker_egress_chain" -i br+ ! -o br+ -m conntrack --ctstate NEW -j REJECT --reject-with icmp-port-unreachable
          sudo iptables -A "$docker_egress_chain" -i docker0 ! -o docker0 -m conntrack --ctstate NEW -j REJECT --reject-with icmp-port-unreachable
          sudo iptables -A "$docker_egress_chain" -j RETURN
          sudo iptables -I DOCKER-USER 1 -j "$docker_egress_chain"
          sudo iptables -I FORWARD 1 -j "$docker_egress_chain"
          docker_egress_rules="$(sudo iptables -S "$docker_egress_chain")"
          test "$(printf '%s\n' "$docker_egress_rules" | wc -l)" -eq 9
          conntrack_accept_rule="$(printf '%s\n' "$docker_egress_rules" | sed -n '2p')"
          case "$conntrack_accept_rule" in
            "-A $docker_egress_chain -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT"|\
            "-A $docker_egress_chain -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT") ;;
            *) echo 'offline Docker conntrack accept rule identity mismatch' >&2; exit 1 ;;
          esac
          for expected_rule in \
            "-A $docker_egress_chain -i br+ -o br+ -j ACCEPT" \
            "-A $docker_egress_chain -i docker0 -o docker0 -j ACCEPT" \
            "-A $docker_egress_chain -i br+ -o docker0 -j ACCEPT" \
            "-A $docker_egress_chain -i docker0 -o br+ -j ACCEPT" \
            "-A $docker_egress_chain -i br+ ! -o br+ -m conntrack --ctstate NEW -j REJECT --reject-with icmp-port-unreachable" \
            "-A $docker_egress_chain -i docker0 ! -o docker0 -m conntrack --ctstate NEW -j REJECT --reject-with icmp-port-unreachable" \
            "-A $docker_egress_chain -j RETURN"; do
            printf '%s\n' "$docker_egress_rules" | grep -Fqx -- "$expected_rule"
          done
          for hook in DOCKER-USER FORWARD; do
            hook_rules="$(sudo iptables -S "$hook")"
            test "$(printf '%s\n' "$hook_rules" | grep -Fxc -- "-A $hook -j $docker_egress_chain")" -eq 1
          done
          runner_control_uid="$(id -u)"
          host_probe_uid="$(id -u nobody)"
          printf '%s:%s\n' "$runner_control_uid" "$host_probe_uid" | grep -Eq '^[0-9]+:[0-9]+$'
          test "$runner_control_uid" -gt 0
          test "$host_probe_uid" -gt 0
          test "$runner_control_uid" -ne "$host_probe_uid"
          sudo iptables -N "$host_egress_chain"
          sudo iptables -A "$host_egress_chain" -m owner --uid-owner "$runner_control_uid" -j ACCEPT
          sudo iptables -A "$host_egress_chain" -o lo -j ACCEPT
          sudo iptables -A "$host_egress_chain" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A "$host_egress_chain" -j REJECT --reject-with icmp-port-unreachable
          sudo iptables -I OUTPUT 1 -j "$host_egress_chain"
          sudo ip6tables -N "$host6_egress_chain"
          sudo ip6tables -A "$host6_egress_chain" -m owner --uid-owner "$runner_control_uid" -j ACCEPT
          sudo ip6tables -A "$host6_egress_chain" -o lo -j ACCEPT
          sudo ip6tables -A "$host6_egress_chain" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -A "$host6_egress_chain" -j REJECT --reject-with icmp6-port-unreachable
          sudo ip6tables -I OUTPUT 1 -j "$host6_egress_chain"
          test "$(sudo iptables -S OUTPUT | sed -n '2p')" = "-A OUTPUT -j $host_egress_chain"
          test "$(sudo ip6tables -S OUTPUT | sed -n '2p')" = "-A OUTPUT -j $host6_egress_chain"
          test "$(sudo iptables -S "$host_egress_chain" | wc -l)" -eq 5
          test "$(sudo ip6tables -S "$host6_egress_chain" | wc -l)" -eq 5

      - name: Verify bundle before docker load and run bundled operations
        env:
          RELEASE_ID: ${{ needs.build_bundle.outputs.release_id }}
          TRUSTED_FINGERPRINT: ${{ needs.build_bundle.outputs.key_fingerprint }}
          TRUSTED_BOOTSTRAP_SHA256: ${{ needs.build_bundle.outputs.bootstrap_sha256 }}
          BUNDLE_ARCHIVE_MANIFEST_SHA256: ${{ needs.build_bundle.outputs.bundle_archive_manifest_sha256 }}
        run: |
          set -euo pipefail
          offline_rehearsal_heartbeat() {
            local offline_heartbeat_seq=0
            while :; do
              offline_heartbeat_seq=$((offline_heartbeat_seq + 1))
              printf 'offline rehearsal heartbeat seq=%s\n' "$offline_heartbeat_seq"
              sleep 30
            done
          }
          offline_rehearsal_heartbeat &
          offline_heartbeat_pid=$!
          trap 'if [ -n "${offline_heartbeat_pid:-}" ]; then kill "$offline_heartbeat_pid" 2>/dev/null || true; wait "$offline_heartbeat_pid" 2>/dev/null || true; fi' EXIT
          umask 077
          case "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" in
            ''|*[!0-9:]*|*:*:*) echo 'offline sealed-root identity is invalid' >&2; exit 1 ;;
          esac
          SEALED_PARENT=/var/lib/hr-axis-onprem-offline-proof
          SEALED_ROOT="$SEALED_PARENT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          INCOMING_ARCHIVE_ROOT="$RUNNER_TEMP/offline-incoming"
          INCOMING_ARCHIVE_MANIFEST="$INCOMING_ARCHIVE_ROOT/SHA256SUMS"
          INCOMING_TRUST_ROOT="$RUNNER_TEMP/offline-incoming/trust"
          assert_private_directory() {
            local path="$1"
            sudo test -d "$path" && sudo test ! -L "$path"
            test "$(sudo stat -c '%u:%g' "$path")" = '0:0'
            ! sudo find "$path" -maxdepth 0 -perm /022 | grep -q .
          }
          for system_component in /var /var/lib; do assert_private_directory "$system_component"; done
          if sudo test -e "$SEALED_PARENT" || sudo test -L "$SEALED_PARENT"; then
            assert_private_directory "$SEALED_PARENT"
          else
            sudo install -d -o 0 -g 0 -m 0750 "$SEALED_PARENT"
            assert_private_directory "$SEALED_PARENT"
          fi
          if sudo test -e "$SEALED_ROOT" || sudo test -L "$SEALED_ROOT"; then
            echo 'offline sealed-root path already exists or is a symlink' >&2
            exit 1
          fi
          printf '%s\n' "$BUNDLE_ARCHIVE_MANIFEST_SHA256" | grep -Eq '^[a-f0-9]{64}$'
          test -f "$INCOMING_ARCHIVE_MANIFEST" && test ! -L "$INCOMING_ARCHIVE_MANIFEST"
          test "$(sha256sum "$INCOMING_ARCHIVE_MANIFEST" | awk '{print $1}')" = "$BUNDLE_ARCHIVE_MANIFEST_SHA256"
          test "$(find "$INCOMING_ARCHIVE_ROOT" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'SHA256SUMS current.tar next-transition.tar previous-transition.tar '
          (cd "$INCOMING_ARCHIVE_ROOT" && sha256sum --check SHA256SUMS)
          sudo test -d "$INCOMING_TRUST_ROOT" && sudo test ! -L "$INCOMING_TRUST_ROOT"
          largest_archive_kib="$(du -k "$INCOMING_ARCHIVE_ROOT"/current.tar "$INCOMING_ARCHIVE_ROOT"/next-transition.tar "$INCOMING_ARCHIVE_ROOT"/previous-transition.tar | awk 'max < $1 { max = $1 } END { print max }')"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          preflight_reserve_kib=8000000
          maximum_archive_copies=2
          required_kib="$((preflight_reserve_kib + (maximum_archive_copies * largest_archive_kib)))"
          echo "offline rehearsal capacity forecast: available_kib=$available_kib preflight_reserve_kib=$preflight_reserve_kib largest_archive_kib=$largest_archive_kib maximum_archive_copies=$maximum_archive_copies required_kib=$required_kib"
          test "$available_kib" -ge "$required_kib" || { echo 'offline rehearsal capacity is insufficient' >&2; exit 1; }
          sudo install -d -o 0 -g 0 -m 0755 "$SEALED_ROOT/bundle" "$SEALED_ROOT/archives" "$SEALED_ROOT/trust"
          sudo install -o 0 -g 0 -m 0600 -- "$INCOMING_ARCHIVE_MANIFEST" "$SEALED_ROOT/archives/SHA256SUMS"
          test "$(sudo sha256sum "$SEALED_ROOT/archives/SHA256SUMS" | awk '{print $1}')" = "$BUNDLE_ARCHIVE_MANIFEST_SHA256"
          install_release_archive() {
            local archive_name="$1" source="$INCOMING_ARCHIVE_ROOT/$1.tar" sealed_archive="$SEALED_ROOT/archives/$1.tar" expected
            expected="$(awk -v file="$archive_name.tar" '$2 == file { print $1 }' "$INCOMING_ARCHIVE_MANIFEST")"
            printf '%s\n' "$expected" | grep -Eq '^[a-f0-9]{64}$'
            test "$(awk -v file="$archive_name.tar" '$2 == file { count += 1 } END { print count + 0 }' "$INCOMING_ARCHIVE_MANIFEST")" -eq 1
            test -f "$source" && test ! -L "$source"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$expected"
            sudo install -o 0 -g 0 -m 0600 -- "$source" "$sealed_archive"
            test "$(sudo sha256sum "$sealed_archive" | awk '{print $1}')" = "$expected"
            rm -- "$source"
            test ! -e "$source" && test ! -L "$source"
          }
          assert_archive_members() {
            local archive="$1" root="$2" members
            sudo test -f "$archive" && sudo test ! -L "$archive"
            members="$(sudo tar -tf "$archive")"
            test -n "$members"
            printf '%s\n' "$members" | awk -v root="$root" '$0 ~ /(^|\/)\.\.?($|\/)/ || $0 !~ ("^" root "(/|$)") { bad = 1 } END { exit bad ? 1 : 0 }'
            sudo tar -tvf "$archive" | awk '$1 !~ /^[-d]/ { bad = 1 } END { exit bad ? 1 : 0 }'
          }
          assert_transition_members() {
            local archive="$1" prefix="$2" members
            members="$(sudo tar -tf "$archive")"
            test "$(printf '%s\n' "$members" | wc -l)" -eq 5
            printf '%s\n' "$members" | awk -v prefix="$prefix" '($0 == prefix "/" || $0 == prefix "/bundle-manifest.json" || $0 == prefix "/bundle-signature.json" || $0 == prefix "/evidence/" || $0 == prefix "/evidence/migration-compatibility.json") { next } { bad = 1 } END { exit bad ? 1 : 0 }'
            sudo tar -tvf "$archive" | awk '$1 !~ /^[-d]/ { bad = 1 } END { exit bad ? 1 : 0 }'
          }
          extract_current_bundle() {
            local sealed_archive="$SEALED_ROOT/archives/current.tar" target="$SEALED_ROOT/bundle/current" archive_kib available_kib required_kib
            assert_archive_members "$sealed_archive" current
            sudo test -f "$sealed_archive" && sudo test ! -L "$sealed_archive"
            archive_kib="$(sudo du -k "$sealed_archive" | awk '{print $1}')"
            available_kib="$(sudo df -Pk -- "$SEALED_ROOT" | awk 'NR == 2 { print $4 }')"
            required_kib="$((preflight_reserve_kib + archive_kib))"
            test "$available_kib" -ge "$required_kib" || { echo 'offline release extraction capacity is insufficient' >&2; exit 1; }
            sudo test ! -e "$target" && sudo test ! -L "$target"
            sudo tar --extract --file "$sealed_archive" --directory "$SEALED_ROOT/bundle" --no-same-owner --same-permissions
            sudo rm -- "$sealed_archive"
            sudo test -d "$target" && sudo test ! -L "$target"
          }
          install_release_archive current
          install_release_archive next-transition
          install_release_archive previous-transition
          extract_current_bundle
          sudo cp -a -- "$INCOMING_TRUST_ROOT/." "$SEALED_ROOT/trust/"
          rm -rf -- "$INCOMING_ARCHIVE_ROOT"
          test ! -e "$INCOMING_ARCHIVE_ROOT" && test ! -L "$INCOMING_ARCHIVE_ROOT"
          case "$PINNED_NODE_SOURCE" in /*) ;; *) echo 'pinned Node source path is invalid' >&2; exit 1 ;; esac
          test -f "$PINNED_NODE_SOURCE" && test ! -L "$PINNED_NODE_SOURCE"
          test "$("$PINNED_NODE_SOURCE" --version)" = v24.19.0
          sudo test ! -e "$SEALED_ROOT/trust/node" && sudo test ! -L "$SEALED_ROOT/trust/node"
          sudo install -o 0 -g 0 -m 0755 -- "$PINNED_NODE_SOURCE" "$SEALED_ROOT/trust/node"
          sudo find "$SEALED_ROOT" -exec chown 0:0 {} +
          sudo find "$SEALED_ROOT" -type d -exec chmod go-w {} +
          sudo find "$SEALED_ROOT" -type f -exec chmod go-w {} +
          if sudo find "$SEALED_ROOT" -type l -print -quit | grep -q .; then
            echo 'offline sealed-root contains a symlink' >&2
            exit 1
          fi
          if sudo find "$SEALED_ROOT" \( ! -uid 0 -o ! -gid 0 \) -print -quit | grep -q .; then
            echo 'offline sealed-root ownership drift detected' >&2
            exit 1
          fi
          if sudo find "$SEALED_ROOT" \( -type f -o -type d \) -perm /022 -print -quit | grep -q .; then
            echo 'offline sealed-root mode drift detected' >&2
            exit 1
          fi
          assert_private_directory "$SEALED_ROOT"
          BUNDLE_ROOT="$SEALED_ROOT/bundle/current"
          NEXT_BUNDLE_ROOT="$SEALED_ROOT/bundle/next"
          PREVIOUS_BUNDLE_ROOT="$SEALED_ROOT/bundle/previous"
          TRUST_ROOT="$SEALED_ROOT/trust"
          NODE_BIN="$TRUST_ROOT/node"
          OPERATOR_PATH="$TRUST_ROOT:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo_operator() { sudo env "PATH=$OPERATOR_PATH" "$@"; }
          OPERATOR_ROOT="$SEALED_ROOT/operator"
          PUBLIC_KEY="$TRUST_ROOT/public-key.pem"
          TRUSTED_BOOTSTRAP="$TRUST_ROOT/onprem-offline-bootstrap-verify.mjs"
          test "$(sudo -- "$NODE_BIN" --version)" = v24.19.0
          test "$(sudo env "PATH=$OPERATOR_PATH" sh -c 'command -v node')" = "$NODE_BIN"
          test "$(sudo env "PATH=$OPERATOR_PATH" node --version)" = v24.19.0
          sudo test -f "$BUNDLE_ROOT/bundle-manifest.json" && sudo test ! -L "$BUNDLE_ROOT/bundle-manifest.json"
          sudo test -f "$PUBLIC_KEY" && sudo test ! -L "$PUBLIC_KEY"
          sudo test ! -e "$BUNDLE_ROOT/.git" && sudo test ! -L "$BUNDLE_ROOT/.git"
          sudo test ! -e "$BUNDLE_ROOT/backend" && sudo test ! -L "$BUNDLE_ROOT/backend"
          sudo test ! -e "$BUNDLE_ROOT/admin-web" && sudo test ! -L "$BUNDLE_ROOT/admin-web"
          sudo test ! -e "$BUNDLE_ROOT/src" && sudo test ! -L "$BUNDLE_ROOT/src"
          printf '%s\n' "$TRUSTED_BOOTSTRAP_SHA256" | grep -Eq '^[a-f0-9]{64}$'
          test "$(sudo sha256sum "$TRUSTED_BOOTSTRAP" | awk '{print $1}')" = "$TRUSTED_BOOTSTRAP_SHA256"
          release_suffix="$(printf '%s' "$RELEASE_ID" | rev | cut -d- -f1 | rev)"
          assert_release_tree() {
            local root="$1"
            sudo test -d "$root" && sudo test ! -L "$root"
            if sudo find "$root" \( ! -uid 0 -o ! -gid 0 \) -print -quit | grep -q .; then echo 'release bundle ownership drift detected' >&2; exit 1; fi
            if sudo find "$root" \( -type f -o -type d \) -perm /022 -print -quit | grep -q .; then echo 'release bundle mode drift detected' >&2; exit 1; fi
          }
          verify_release_bundle() {
            local root="$1" release_id="$2"
            assert_release_tree "$root"
            sudo -- "$NODE_BIN" "$TRUSTED_BOOTSTRAP" verify --bundle-dir "$root" --release-id "$release_id" --public-key "$PUBLIC_KEY" --trusted-fingerprint "$TRUSTED_FINGERPRINT"
            sudo -- "$NODE_BIN" "$root/operations/onprem-offline-bundle.mjs" verify --bundle-dir "$root" --public-key "$PUBLIC_KEY" --trusted-fingerprint "$TRUSTED_FINGERPRINT"
          }
          materialize_transition_bundle() {
            local release="$1" target="$2" release_id="$3" archive="$SEALED_ROOT/archives/${release}-transition.tar" materialization_root="$SEALED_ROOT/.${release}-materialize"
            assert_transition_members "$archive" "${release}-transition"
            sudo test ! -e "$target" && sudo test ! -L "$target"
            sudo test ! -e "$materialization_root" && sudo test ! -L "$materialization_root"
            sudo install -d -o 0 -g 0 -m 0700 "$materialization_root"
            sudo cp -a -- "$BUNDLE_ROOT/." "$materialization_root/"
            sudo tar --extract --file "$archive" --directory "$materialization_root" --strip-components=1 --no-same-owner --same-permissions
            sudo rm -- "$archive"
            if sudo find "$materialization_root" -type l -print -quit | grep -q .; then
              echo 'transition materialization contains a symlink' >&2
              exit 1
            fi
            assert_release_tree "$materialization_root"
            verify_release_bundle "$materialization_root" "$release_id"
            sudo mv -- "$materialization_root" "$target"
            sudo test -d "$target" && sudo test ! -L "$target"
          }
          verify_release_bundle "$BUNDLE_ROOT" "$RELEASE_ID"
          sudo grep -R -- '--pull never' "$BUNDLE_ROOT/operations" >/dev/null
          test "$(sudo find "$BUNDLE_ROOT/images" -maxdepth 1 -type f -name '*.tar' | wc -l)" -eq 7
          mkdir -p "$RUNNER_TEMP/offline-secrets/core"/{backend,caddy,postgres,redis,keycloak} "$RUNNER_TEMP/offline-secrets/photo"
          mkdir -p "$RUNNER_TEMP/offline-receipts" "$RUNNER_TEMP/offline-backups" "$RUNNER_TEMP/offline-restore"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=offline.synthetic.invalid CA' -keyout "$RUNNER_TEMP/offline-ca.key" -out "$RUNNER_TEMP/offline-secrets/core/postgres/ca.crt" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj '/CN=postgres' -addext 'subjectAltName=DNS:postgres' -keyout "$RUNNER_TEMP/offline-secrets/core/postgres/server.key" -out "$RUNNER_TEMP/postgres.csr" >/dev/null 2>&1
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/postgres.csr" -CA "$RUNNER_TEMP/offline-secrets/core/postgres/ca.crt" -CAkey "$RUNNER_TEMP/offline-ca.key" -CAcreateserial -CAserial "$RUNNER_TEMP/offline-ca.srl" -copy_extensions copyall -out "$RUNNER_TEMP/offline-secrets/core/postgres/server.crt" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj '/CN=offline.synthetic.invalid' -addext 'subjectAltName=DNS:offline.synthetic.invalid' -keyout "$RUNNER_TEMP/offline-secrets/core/caddy/server.key" -out "$RUNNER_TEMP/caddy.csr" >/dev/null 2>&1
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/caddy.csr" -CA "$RUNNER_TEMP/offline-secrets/core/postgres/ca.crt" -CAkey "$RUNNER_TEMP/offline-ca.key" -CAserial "$RUNNER_TEMP/offline-ca.srl" -copy_extensions copyall -out "$RUNNER_TEMP/offline-secrets/core/caddy/server.crt" >/dev/null 2>&1
          cp "$RUNNER_TEMP/offline-secrets/core/postgres/ca.crt" "$RUNNER_TEMP/offline-secrets/core/caddy/ca.crt"
          bootstrap_password="$(openssl rand -hex 24)"; migrator_password="$(openssl rand -hex 24)"; api_password="$(openssl rand -hex 24)"; worker_password="$(openssl rand -hex 24)"; redis_health_password="$(openssl rand -hex 24)"; redis_api_password="$(openssl rand -hex 24)"; redis_worker_password="$(openssl rand -hex 24)"; keycloak_database_password="$(openssl rand -hex 24)"; keycloak_bootstrap_password="$(openssl rand -hex 24)"; keycloak_smtp_password="$(openssl rand -hex 24)"; browser_session_secret="$(openssl rand -hex 32)"; store_manager_password="$(openssl rand -hex 32)"; region_manager_password="$(openssl rand -hex 32)"; report_viewer_password="$(openssl rand -hex 32)"; store_personnel_password="$(openssl rand -hex 32)"; visual_merchandiser_password="$(openssl rand -hex 32)"; photo_proof_password="$(openssl rand -hex 32)"
          printf '%s\n' "postgresql://hr_axis_api:$api_password@postgres:5432/hr_axis?sslmode=verify-full" > "$RUNNER_TEMP/offline-secrets/core/backend/api-database-url"
          printf '%s\n' "postgresql://hr_axis_worker:$worker_password@postgres:5432/hr_axis?sslmode=verify-full" > "$RUNNER_TEMP/offline-secrets/core/backend/worker-database-url"
          printf '%s\n' "postgresql://hr_axis_migrator:$migrator_password@postgres:5432/hr_axis?sslmode=verify-full" > "$RUNNER_TEMP/offline-secrets/core/backend/migrator-database-url"
          cp "$RUNNER_TEMP/offline-secrets/core/backend/api-database-url" "$RUNNER_TEMP/offline-secrets/core/keycloak/binder-database-url"
          printf '%s\n' "redis://api:$redis_api_password@redis:6379" > "$RUNNER_TEMP/offline-secrets/core/backend/redis-api-url"
