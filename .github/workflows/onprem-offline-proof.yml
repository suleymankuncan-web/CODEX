          if (!manifests.every((manifest) => manifest.sourceRevision === manifests[0].sourceRevision && imageIdentity(manifest) === imageIdentity(manifests[0]))) throw new Error('same-build lifecycle mechanics evidence unexpectedly contains a real release transition')
          const releaseTransitionEvidence = { evidenceScope: 'same-build-lifecycle-mechanics', realVersionTransitionProved: false, incompatibleMigrationHandlingProved: false }
          const egress = JSON.parse(fs.readFileSync(egressReceiptPath, 'utf8'))
          const positiveCounter = (value) => Number.isInteger(value) && value >= 1
          if (egress.schemaVersion !== 1 || egress.dataClass !== 'synthetic' || egress.operation !== 'egress-probe' || egress.status !== 'passed' || egress.releaseId !== releaseId || egress.sourceProject !== 'hr-axis-onprem-core' || egress.targetProject !== 'hr-axis-onprem-core' || egress.rejectRulesVerified !== true || egress.dockerIpv6Disabled !== true || !positiveCounter(egress.dockerIpv4CounterDelta) || !positiveCounter(egress.hostIpv4CounterDelta) || !positiveCounter(egress.hostIpv6CounterDelta)) throw new Error('egress proof receipt is invalid or not passed')
          const expected = {
            smoke: ['smoke', 'passed', releaseId, 'hr-axis-onprem-core', 'hr-axis-onprem-core', 'current'],
            backup: ['backup', 'passed', releaseId, 'hr-axis-onprem-core', 'hr-axis-onprem-core', 'current'],
            restore: ['restore', 'passed', releaseId, 'hr-axis-onprem-core', 'hr-axis-onprem-restore', 'current'],
            upgrade: ['upgrade-mechanics', 'mechanics-passed', nextReleaseId, 'hr-axis-onprem-core', 'hr-axis-onprem-upgrade', 'next'],
            rollback: ['rollback-mechanics', 'mechanics-passed', previousReleaseId, 'hr-axis-onprem-core', 'hr-axis-onprem-rollback', 'previous'],
            'photo-prebackup': ['target-proof-prebackup', 'passed', releaseId, 'hr-axis-onprem-core', 'hr-axis-onprem-core', 'current'],
          }
          if (Number(targetStatus) !== 0) throw new Error('target proof is not passed')
          const operations = {}
          const names = Object.keys(expected)
          if (names.length !== 6 || names.join(',') !== 'smoke,backup,restore,upgrade,rollback,photo-prebackup') throw new Error('offline rehearsal receipt operation set is not exact')
          for (const [name, [operation, status, expectedRelease, sourceProject, targetProject, manifestName]] of Object.entries(expected)) {
            const path = `${directory}/${name}.json`
            const value = JSON.parse(fs.readFileSync(path, 'utf8'))
            if (value.schemaVersion !== 1 || value.dataClass !== 'synthetic' || value.operation !== operation || value.status !== status || value.releaseId !== expectedRelease || value.sourceProject !== sourceProject || value.targetProject !== targetProject) throw new Error(`invalid ${name} receipt identity`)
            if (name === 'restore' || name === 'upgrade' || name === 'rollback') {
              if (value.recoveredPreBackupPhoto !== true || value.photoRecoveryHandleSha256 !== recoveryHandleSha256 || value.photoContentSha256 !== recoveryHandle.contentSha256 || value.photoContentLength !== recoveryHandle.contentLength) throw new Error(`invalid recovered photo evidence for ${name}`)
            }
            if ((name === 'upgrade' || name === 'rollback') && (value.evidenceScope !== releaseTransitionEvidence.evidenceScope || value.realVersionTransitionProved !== false || value.incompatibleMigrationHandlingProved !== false)) throw new Error(`invalid ${name} evidence scope`)
            operations[name] = { schemaVersion: 1, operation, status, releaseId: value.releaseId, sourceProject, targetProject, manifestSha256: manifestDigests[manifestName], receiptSha256: digest(path), ...(name === 'upgrade' || name === 'rollback' ? releaseTransitionEvidence : {}) }
          }
          const egressDigest = digest(egressReceiptPath)
          const egressSummary = { status: egress.status, receiptSha256: egressDigest, dockerIpv4CounterDelta: egress.dockerIpv4CounterDelta, hostIpv4CounterDelta: egress.hostIpv4CounterDelta, hostIpv6CounterDelta: egress.hostIpv6CounterDelta, dockerIpv6Disabled: true, rejectRulesVerified: true }
          const aggregate = { schemaVersion: 1, dataClass: 'synthetic', operation: 'offline-rehearsal', status: 'passed', gate: null, releaseId, bundleManifests: { current: manifestDigests.current, next: manifestDigests.next, previous: manifestDigests.previous }, releaseTransitionEvidence, egress: egressSummary, operations, sanitized: true }
          fs.writeFileSync(`${directory}/operations.json`, JSON.stringify(aggregate) + '\n', { mode: 0o600 })
          fs.writeFileSync(`${directory}/rehearsal.json`, JSON.stringify({ schemaVersion: 1, operation: 'offline-rehearsal', status: 'passed', gate: null, dataClass: 'synthetic', releaseId, egressDisabledDuringOperations: true, egressProofSha256: egressDigest, ...egressSummary, releaseTransitionEvidence, commandsCompleteBeforeEgressRestore: true, sanitized: true }) + '\n', { mode: 0o600 })
          NODE
          sudo cp -a -- "$OPERATOR_ROOT/receipts/." "$RUNNER_TEMP/offline-receipts/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/offline-receipts"
          chmod 700 "$RUNNER_TEMP/offline-receipts"
          chmod 600 "$RUNNER_TEMP/offline-receipts"/*.json

      - name: Quiesce exact rehearsal runtimes before restoring egress
        if: always()
        run: |
          set -euo pipefail
          projects=(hr-axis-onprem-core hr-axis-onprem-restore hr-axis-onprem-upgrade hr-axis-onprem-rollback)
          for project in "${projects[@]}"; do
            container_ids="$(sudo docker ps -aq --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"
            if [ -n "$container_ids" ]; then sudo docker rm -f $container_ids; fi
          done
          for project in "${projects[@]}"; do
            network_ids="$(sudo docker network ls -q --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"
            if [ -n "$network_ids" ]; then sudo docker network rm $network_ids; fi
          done
          for project in "${projects[@]}"; do
            test -z "$(sudo docker ps -aq --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"
            test -z "$(sudo docker network ls -q --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"
          done
          : > "$RUNNER_TEMP/offline-runtime-quiesced"
          chmod 600 "$RUNNER_TEMP/offline-runtime-quiesced"

      - name: Restore runner egress only after runtime quiescence
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/offline-runtime-quiesced"
          if test -f "$RUNNER_TEMP/offline-firewall.snapshot"; then
            sudo sh -c 'iptables-restore < "$1"' sh "$RUNNER_TEMP/offline-firewall.snapshot"
            test -f "$RUNNER_TEMP/offline-firewall6.snapshot"
            sudo sh -c 'ip6tables-restore < "$1"' sh "$RUNNER_TEMP/offline-firewall6.snapshot"
            if sudo iptables -S HR_AXIS_OFFLINE_DOCKER_EGRESS >/dev/null 2>&1 || sudo iptables -S HR_AXIS_OFFLINE_HOST_EGRESS >/dev/null 2>&1 || sudo ip6tables -S HR_AXIS_OFFLINE_HOST6_EGRESS >/dev/null 2>&1; then
              echo 'offline egress chain remained after complete firewall restore' >&2
              exit 1
            fi
          else
            echo 'offline firewall snapshot is missing; egress cannot be restored safely' >&2
            exit 1
          fi

      - name: Upload sanitized offline rehearsal receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-offline-rehearsal-receipt-${{ inputs.expected_sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/offline-receipts

      - name: Clean exact rehearsal targets
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          projects=(hr-axis-onprem-core hr-axis-onprem-restore hr-axis-onprem-upgrade hr-axis-onprem-rollback)
          for project in "${projects[@]}"; do
            if ! container_ids="$(sudo docker ps -aq --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"; then
              echo "cleanup: cannot inspect containers for exact project $project" >&2; cleanup_status=1; continue
            fi
            if [ -n "$container_ids" ] && ! sudo docker rm -f $container_ids; then
              echo "cleanup: failed to remove exact project containers for $project" >&2; cleanup_status=1
            fi
            if ! volume_ids="$(sudo docker volume ls -q --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"; then
              echo "cleanup: cannot inspect volumes for exact project $project" >&2; cleanup_status=1; continue
            fi
            if [ -n "$volume_ids" ] && ! sudo docker volume rm $volume_ids; then
              echo "cleanup: failed to remove exact project volumes for $project" >&2; cleanup_status=1
            fi
            if ! network_ids="$(sudo docker network ls -q --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")"; then
              echo "cleanup: cannot inspect networks for exact project $project" >&2; cleanup_status=1; continue
            fi
            if [ -n "$network_ids" ] && ! sudo docker network rm $network_ids; then
              echo "cleanup: failed to remove exact project networks for $project" >&2; cleanup_status=1
            fi
          done
          for project in "${projects[@]}"; do
            for resource in containers volumes networks; do
              case "$resource" in
                containers) remaining="$(sudo docker ps -aq --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")" ;;
                volumes) remaining="$(sudo docker volume ls -q --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")" ;;
                networks) remaining="$(sudo docker network ls -q --filter "label=com.docker.compose.project=$project" --filter "label=com.hr-axis.project=$project")" ;;
              esac
              if [ -n "$remaining" ]; then echo "cleanup: exact project $project still has $resource" >&2; cleanup_status=1; fi
            done
          done
          if ! test -z "$(sudo docker ps -aq --filter label=com.hr-axis.data-class=synthetic --filter label=com.hr-axis.project=hr-axis-onprem-core)"; then
            echo 'cleanup: synthetic core containers remain' >&2; cleanup_status=1
          fi
          sensitive_paths=(
            "$RUNNER_TEMP/offline-incoming" "$RUNNER_TEMP/offline-secrets" "$RUNNER_TEMP/offline-backups"
            "$RUNNER_TEMP/offline-restore" "$RUNNER_TEMP/offline-ledger" "$RUNNER_TEMP/offline-receipts"
            "$RUNNER_TEMP/offline.env" "$RUNNER_TEMP/offline-previous.env" "$RUNNER_TEMP/offline-current.env"
            "$RUNNER_TEMP/offline-next.env" "$RUNNER_TEMP/offline-owner-signing-key.pem"
            "$RUNNER_TEMP/offline-owner-signing-public.pem" "$RUNNER_TEMP/offline-ca.key"
            "$RUNNER_TEMP/postgres.csr" "$RUNNER_TEMP/caddy.csr" "$RUNNER_TEMP/offline-ca.srl"
            "$RUNNER_TEMP/offline-firewall.snapshot" "$RUNNER_TEMP/offline-firewall6.snapshot"
            "$RUNNER_TEMP/offline-runtime-quiesced"
            "$RUNNER_TEMP/offline-photo-fixture.webp"
            "/var/lib/hr-axis-onprem-offline-proof/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          for sensitive_path in "${sensitive_paths[@]}"; do
            if ! sudo rm -rf -- "$sensitive_path"; then
              echo "cleanup: failed to remove sensitive path $sensitive_path" >&2; cleanup_status=1; continue
            fi
            if sudo test -e "$sensitive_path" || sudo test -L "$sensitive_path"; then
              echo "cleanup: sensitive path remains $sensitive_path" >&2; cleanup_status=1
            fi
          done
          if [ "$cleanup_status" -ne 0 ]; then
            echo "offline cleanup failed (status=$cleanup_status)" >&2
            exit "$cleanup_status"
          fi
