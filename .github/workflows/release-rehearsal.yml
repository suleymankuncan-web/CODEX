name: Release Rehearsal

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/nestjs/**"
      - "db/**"
      - "infra/**"
      - ".github/workflows/release-rehearsal.yml"
  pull_request:
    paths:
      - "backend/nestjs/**"
      - "db/**"
      - "infra/**"
      - ".github/workflows/release-rehearsal.yml"
  workflow_dispatch:

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json

      - name: Install backend dependencies
        working-directory: backend/nestjs
        run: npm ci

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run backend release check and Docker rehearsal
        working-directory: backend/nestjs
        env:
          REHEARSAL_COMPOSE_PROJECT_NAME: store-ops-ci-release-rehearsal
        run: npm run rehearse:release
