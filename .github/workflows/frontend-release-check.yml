name: Frontend Targeted Check

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: frontend-targeted-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-targeted-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Check generated API client
        working-directory: admin-web
        run: npm run api:check

      - name: Lint frontend
        working-directory: admin-web
        run: npm run lint

      - name: Run frontend script contracts
        working-directory: admin-web
        run: npm run test:scripts

      - name: Build frontend
        working-directory: admin-web
        run: npm run build
