name: Frontend Release Check

on:
  push:
    branches:
      - main
      - master
    paths:
      - "admin-web/**"
      - "docs/api/**"
      - ".github/workflows/frontend-release-check.yml"
  pull_request:
    paths:
      - "admin-web/**"
      - "docs/api/**"
      - ".github/workflows/frontend-release-check.yml"
  workflow_dispatch:

concurrency:
  group: frontend-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Ensure system Chrome
        timeout-minutes: 5
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Run frontend release check
        working-directory: admin-web
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
        run: npm run check:release
