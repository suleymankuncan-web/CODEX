name: on-prem image proof

on:
  workflow_call:
    inputs:
      proof_mode:
        description: 'Fail-closed proof mode: component or full'
        required: true
        type: string
      image_scope:
        description: 'Selected application images: frontend, backend, or both'
        required: true
        type: string
      expected_sha:
        description: 'Exact commit SHA to check out and prove'
        required: true
        type: string
    outputs:
      proof_mode:
        description: 'Proven proof mode'
        value: ${{ jobs.proof.outputs.proof_mode || jobs.component_proof.outputs.proof_mode }}
      image_scope:
        description: 'Proven image scope'
        value: ${{ jobs.proof.outputs.image_scope || jobs.component_proof.outputs.image_scope }}
      evidence_sha:
        description: 'SHA-256 of the fresh evidence index'
        value: ${{ jobs.proof.outputs.evidence_sha || jobs.component_proof.outputs.evidence_sha }}
      receipt_sha256:
        description: 'SHA-256 of the fresh proof receipt'
        value: ${{ jobs.proof.outputs.receipt_sha256 || jobs.component_proof.outputs.receipt_sha256 }}
      proven_sha:
        description: 'Exact commit SHA proven by the selected job'
        value: ${{ jobs.proof.outputs.proven_sha || jobs.component_proof.outputs.proven_sha }}
  workflow_dispatch:
    inputs:
      proof_mode:
        description: 'Fail-closed proof mode'
        required: false
        default: full
        type: choice
        options:
          - component
          - full
      image_scope:
        description: 'Selected application images'
        required: false
        default: both
        type: choice
        options:
          - frontend
          - backend
          - both
      expected_sha:
        description: 'Exact commit SHA to check out and prove'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: onprem-image-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_IMAGE: node:24-trixie-slim@sha256:0711b541c1c33a8a530ac4f0d391baa9a15b3d804695b1b24a47daa5fb60e74d
  BACKEND_RUNTIME_IMAGE: gcr.io/distroless/nodejs24-debian13:nonroot@sha256:fbbdda866ea71aef98c4abece17e3d61fbf820cc2ef3961522caa2478716171a
  FRONTEND_RUNTIME_IMAGE: nginxinc/nginx-unprivileged:1.30.4-alpine-slim@sha256:e88d990b349df8cf4aa82f16642d7a23375016638c9ace4e5c6ca25028e62e65
  CADDY_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
  KEYCLOAK_BASE_IMAGE: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
  KEYCLOAK_IMAGE: hr-axis-onprem-keycloak:proof
  KEYCLOAK_TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  SYFT_IMAGE: anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d

jobs:
  local-proof-gate:
    name: local-proof-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Checkout exact expected SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Pin local proof gate Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Require owner-published local proof
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EXECUTION_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/onprem-proof-dispatch.mjs verify-status

  proof:
    needs: local-proof-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      proof_mode: ${{ steps.emit-proof-output.outputs.proof_mode }}
      image_scope: ${{ steps.emit-proof-output.outputs.image_scope }}
      evidence_sha: ${{ steps.emit-proof-output.outputs.evidence_sha }}
      receipt_sha256: ${{ steps.emit-proof-output.outputs.receipt_sha256 }}
      proven_sha: ${{ steps.emit-proof-output.outputs.proven_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate full proof inputs and exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROOF_MODE: ${{ inputs.proof_mode }}
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          case "$PROOF_MODE:$IMAGE_SCOPE" in
            full:both|component:frontend|component:backend|component:both) ;;
            *) exit 1 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Pin host proof toolchain to the image build Node line
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Pull pinned Keycloak base and build the optimized ONP-3B image
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          docker pull "$KEYCLOAK_BASE_IMAGE"
          docker image inspect "$KEYCLOAK_BASE_IMAGE" --format '{{json .RepoDigests}}' | grep -Fqx '["quay.io/keycloak/keycloak@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13"]'
          docker build --file infra/onprem/images/keycloak.Dockerfile --tag "$KEYCLOAK_IMAGE" \
            --build-arg KEYCLOAK_BASE_IMAGE="$KEYCLOAK_BASE_IMAGE" .
          test "$(docker image inspect "$KEYCLOAK_IMAGE" --format '{{.Config.Entrypoint}}')" = '[/opt/keycloak/bin/kc.sh]'
          docker run --rm --volume "$PWD/infra/onprem/core/keycloak/bootstrap.sh:/opt/keycloak/bootstrap.sh:ro" \
            --entrypoint /bin/sh "$KEYCLOAK_IMAGE" -ec '
            required_bootstrap_commands="cat chmod grep mkdir mktemp mv rm sed sleep tr wc"
            for required_command in $required_bootstrap_commands; do
              command -v "$required_command" >/dev/null
            done
            test -x /opt/keycloak/bin/kc.sh
            test -x /opt/keycloak/bin/kcadm.sh
            /bin/sh -n /opt/keycloak/bootstrap.sh
          '
          printf 'KEYCLOAK_IMAGE_ID=%s\n' "$(docker image inspect "$KEYCLOAK_IMAGE" --format '{{.Id}}')" >> "$GITHUB_ENV"

      - name: Build dedicated images with synthetic inputs
        if: inputs.proof_mode == 'full'
        env:
          SOURCE_REVISION: ${{ inputs.expected_sha }}
          BUILD_VERSION: onprem-${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p proof
          grep -Fqx "FROM $BUILD_IMAGE AS dependencies" infra/onprem/images/backend.Dockerfile
          grep -Fqx "FROM $BUILD_IMAGE AS build" infra/onprem/images/frontend.Dockerfile
          grep -Fqx "FROM $BACKEND_RUNTIME_IMAGE AS runtime" infra/onprem/images/backend.Dockerfile
          grep -Fqx "FROM $FRONTEND_RUNTIME_IMAGE AS runtime" infra/onprem/images/frontend.Dockerfile
          BUILD_TIMESTAMP="$(node --input-type=module -e "console.log(new Date().toISOString())")"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          docker build --file infra/onprem/images/frontend.Dockerfile --tag hr-axis-onprem-frontend:proof \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            .
          docker build --file infra/onprem/images/backend.Dockerfile --tag hr-axis-onprem-backend:proof \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            .

      - name: Prove ONP-2 static Compose, network, and firewall contracts
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          node --test scripts/onprem-core-contract.test.mjs scripts/onprem-core-firewall-verify.test.mjs
          docker compose --env-file infra/onprem/core/env.template --file infra/onprem/core/compose.yaml \
            --profile infra --profile migrate --profile seed --profile runtime config --quiet
          node scripts/onprem-core-firewall-verify.mjs \
            --input tests/fixtures/onprem-core-firewall-valid.v4 \
            --subnet 172.30.0.0/24 --subnet 172.30.10.0/24 --subnet 172.30.20.0/24 --subnet 172.30.30.0/24 \
            --proxy-port 443 --ssh-admin-cidr 192.0.2.0/24

      - name: Prove ONP-3B production-shaped Keycloak contracts
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          node --test scripts/onprem-keycloak-contract.test.mjs scripts/onprem-keycloak-runtime-proof.test.mjs
          docker compose --env-file infra/onprem/core/env.template --file infra/onprem/core/compose.yaml \
            --profile infra --profile keycloak-bootstrap --profile migrate --profile seed --profile identity-binder --profile runtime config --quiet

      - name: Prove non-root image users
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          frontend_user="$(docker image inspect hr-axis-onprem-frontend:proof --format '{{.Config.User}}')"
          backend_user="$(docker image inspect hr-axis-onprem-backend:proof --format '{{.Config.User}}')"
          test -n "$frontend_user" && test "$frontend_user" != "0" && test "$frontend_user" != "root"
          test -n "$backend_user" && test "$backend_user" != "0" && test "$backend_user" != "root"

      - name: Prove capability-free Caddy bootstrap under production restrictions
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          docker run --rm --user 10001:10001 --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /run/caddy-bin:rw,nosuid,nodev,exec,size=64m,uid=10001,gid=10001,mode=0700 \
            --entrypoint /bin/sh "$CADDY_IMAGE" -ec '
              umask 077
              source=/usr/bin/caddy
              destination=/run/caddy-bin/caddy
              temporary=/run/caddy-bin/.caddy.tmp
              rm -f "${destination}" "${temporary}"
              cp "${source}" "${temporary}"
              cmp -s "${source}" "${temporary}"
              source_sha256_output="$(sha256sum "${source}")"
              source_sha256="${source_sha256_output%% *}"
              copy_sha256_output="$(sha256sum "${temporary}")"
              copy_sha256="${copy_sha256_output%% *}"
              test "${source_sha256}" = "${copy_sha256}"
              copy_capabilities="$(/usr/sbin/getcap "${temporary}")"
              test -z "${copy_capabilities}"
              chmod 0500 "${temporary}"
              mv "${temporary}" "${destination}"
              exec "${destination}" version
            ' | grep -F 'v2.11.4'
          verifier_failure_root="$(mktemp -d)"
          trap 'rm -rf "$verifier_failure_root"' EXIT
          chmod 0755 "$verifier_failure_root"
          for verifier in sha256sum cmp getcap; do
            rm -f "$verifier_failure_root"/*
            printf '%s\n' '#!/bin/sh' "echo verifier-failed-$verifier >&2" 'exit 42' > "$verifier_failure_root/$verifier"
            chmod 0555 "$verifier_failure_root/$verifier"
            verifier_mount=(--volume "$verifier_failure_root:/run/fail-bin:ro" --env PATH=/run/fail-bin:/usr/sbin:/usr/bin:/sbin:/bin)
            if [ "$verifier" = getcap ]; then
              verifier_mount=(--volume "$verifier_failure_root/getcap:/usr/sbin/getcap:ro")
            fi
            verifier_output=''
            if verifier_output="$(docker run --rm --user 10001:10001 --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              --tmpfs /run/caddy-bin:rw,nosuid,nodev,exec,size=64m,uid=10001,gid=10001,mode=0700 \
              "${verifier_mount[@]}" \
              --entrypoint /bin/sh "$CADDY_IMAGE" -ec '
                umask 077
                source=/usr/bin/caddy
                destination=/run/caddy-bin/caddy
                temporary=/run/caddy-bin/.caddy.tmp
                rm -f "${destination}" "${temporary}"
                cp "${source}" "${temporary}"
                cmp -s "${source}" "${temporary}"
                source_sha256_output="$(sha256sum "${source}")"
                source_sha256="${source_sha256_output%% *}"
                copy_sha256_output="$(sha256sum "${temporary}")"
                copy_sha256="${copy_sha256_output%% *}"
                test "${source_sha256}" = "${copy_sha256}"
                copy_capabilities="$(/usr/sbin/getcap "${temporary}")"
                test -z "${copy_capabilities}"
                chmod 0500 "${temporary}"
                mv "${temporary}" "${destination}"
                exec "${destination}" version
              ' 2>&1)"; then
              echo "Caddy bootstrap verifier failed open: $verifier" >&2
              exit 1
            else
              verifier_status=$?
            fi
            test "$verifier_status" -eq 42
            grep -Fqx "verifier-failed-$verifier" <<< "$verifier_output"
          done

      - name: Prove the pruned backend dependency graph and lazy runtime features
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(node --input-type=module -e "import pkg from './backend/nestjs/package.json' with { type: 'json' }; console.log(Object.keys(pkg.dependencies).sort().join('\\n'))")
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            hr-axis-onprem-backend:proof -e \
            "for (const name of process.argv.slice(1)) require.resolve(name); console.log('resolved=' + process.argv.slice(1).length)" \
            "${dependencies[@]}" | grep -F "resolved=${#dependencies[@]}"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            hr-axis-onprem-backend:proof -e \
            "Promise.all([require('sharp')({create:{width:1,height:1,channels:3,background:'#fff'}}).png().toBuffer(), Promise.resolve(require('@e965/xlsx').utils.book_new()), Promise.resolve(new (require('@aws-sdk/client-s3').S3Client)({region:'eu-central-1',credentials:{accessKeyId:'synthetic',secretAccessKey:'synthetic'}}))]).then((items)=>{items[2].destroy();console.log('lazy-runtime-smoke=ok')})" \
            | grep -F 'lazy-runtime-smoke=ok'

      - name: Start frontend with read-only root and least privilege
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          frontend_id="$(docker run -d --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 18080:8080 hr-axis-onprem-frontend:proof)"
          trap 'docker rm -f "$frontend_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$frontend_id"
          exit 1

      - name: Start API and worker from the same backend image
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          common=(--read-only --cap-drop=ALL --security-opt=no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m)
          synthetic_env=(
            -e NODE_ENV=production
            -e HR_AXIS_STRICT_LOCAL=false
            -e HR_AXIS_DATA_CLASS=synthetic
            -e AUTH_MODE=jwt
            -e AUTH_PROVIDER_KEY=oidc
            -e JWT_SECRET=synthetic-only-not-a-real-secret-0000000000000000
            -e DATABASE_URL=postgres://synthetic:synthetic@127.0.0.1:5432/synthetic
            -e DB_SSL_MODE=require
            -e CORS_ALLOWED_ORIGINS=https://onprem.synthetic.invalid
            -e RATE_LIMIT_WINDOW_MS=60000
            -e RATE_LIMIT_MAX=120
            -e RATE_LIMIT_BACKEND=memory
            -e TRUST_PROXY_HOPS=0
            -e QUEUE_BACKEND=in-memory
            -e ERROR_TRACKING_ENABLED=false
            -e PHOTO_MEDIA_STORAGE_ENABLED=false
          )
          api_id="$(docker run -d "${common[@]}" -p 18082:3000 "${synthetic_env[@]}" hr-axis-onprem-backend:proof)"
          worker_id="$(docker run -d "${common[@]}" "${synthetic_env[@]}" hr-axis-onprem-backend:proof dist/src/workers.js)"
          trap 'docker rm -f "$api_id" "$worker_id" >/dev/null 2>&1 || true' EXIT
          worker_started=false
          for attempt in $(seq 1 20); do
            api_status="$(docker inspect -f '{{.State.Status}}' "$api_id")"
            worker_status="$(docker inspect -f '{{.State.Status}}' "$worker_id")"
            if test "$worker_status" = running; then
              if docker logs "$worker_id" 2>&1 | grep -F 'BullMQ worker context started' >/dev/null; then
                worker_started=true
              fi
            elif test "$worker_status" = exited; then
              test "$(docker inspect -f '{{.State.ExitCode}}' "$worker_id")" = 0
              if docker logs "$worker_id" 2>&1 | grep -F 'BullMQ worker context started' >/dev/null; then
                worker_started=true
              fi
            fi
            if test "$api_status" = running && test "$worker_started" = true \
              && curl --fail --silent http://127.0.0.1:18082/api/health/live >/dev/null; then break; fi
            if test "$api_status" = exited; then
              docker logs "$api_id" || true
              docker logs "$worker_id" || true
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Status}}' "$api_id")" = running
          curl --fail --silent http://127.0.0.1:18082/api/health/live | grep -F '"status":"ok"'
          test "$worker_started" = true
          test "$(docker inspect -f '{{.Config.Image}}' "$api_id")" = "hr-axis-onprem-backend:proof"
          test "$(docker inspect -f '{{.Config.Image}}' "$worker_id")" = "hr-axis-onprem-backend:proof"
          docker logs "$worker_id" 2>&1 | grep -F 'BullMQ worker context started'

      - name: Generate SPDX SBOMs with pinned Syft
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          test "$(docker image inspect "$KEYCLOAK_IMAGE" --format '{{.Id}}')" = "$KEYCLOAK_IMAGE_ID"
          for image in frontend backend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$SYFT_IMAGE" \
              "hr-axis-onprem-${image}:proof" -o "spdx-json=/out/${image}-sbom.spdx.json"
          done
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$SYFT_IMAGE" \
            "$KEYCLOAK_IMAGE" -o spdx-json=/out/keycloak-sbom.spdx.json

      - name: Fail closed on image vulnerabilities and secrets with pinned Trivy
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          for image in frontend backend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$TRIVY_IMAGE" image \
              --format json --scanners vuln,secret --severity CRITICAL,HIGH,MEDIUM,LOW \
              --output "/out/${image}-trivy.json" "hr-axis-onprem-${image}:proof"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity CRITICAL --exit-code 1 "hr-axis-onprem-${image}:proof"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners secret --exit-code 1 "hr-axis-onprem-${image}:proof"
          done
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$KEYCLOAK_TRIVY_IMAGE" image \
            --format json --scanners vuln,secret --severity CRITICAL,HIGH,MEDIUM,LOW \
            --output /out/keycloak-trivy.json "$KEYCLOAK_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$KEYCLOAK_TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL --exit-code 1 "$KEYCLOAK_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$KEYCLOAK_TRIVY_IMAGE" image \
            --scanners secret --exit-code 1 "$KEYCLOAK_IMAGE"

      - name: Export final filesystems and layers then run content guards
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          for image in frontend backend; do
            tag="hr-axis-onprem-${image}:proof"
            id="$(docker create "$tag")"
            mkdir -p "proof/${image}-rootfs"
            docker export "$id" | tar -xf - -C "proof/${image}-rootfs"
            docker rm "$id" >/dev/null
            node scripts/onprem-image-content-guard.mjs --rootfs "proof/${image}-rootfs" --kind "$image" --json \
              | tee "proof/${image}-content-guard.json"

            docker save "$tag" -o "proof/${image}-image.tar"
            mkdir -p "proof/${image}-saved-image"
            tar -xf "proof/${image}-image.tar" -C "proof/${image}-saved-image"
            layer_index=0
            while IFS= read -r layer; do
              layer_root="proof/${image}-layer-rootfs"
              rm -rf "$layer_root"
              mkdir -p "$layer_root"
              tar -xf "proof/${image}-saved-image/$layer" -C "$layer_root"
              node scripts/onprem-image-content-guard.mjs --rootfs "$layer_root" --kind "$image" --json \
                | tee "proof/${image}-layer-${layer_index}-content-guard.json"
              layer_index=$((layer_index + 1))
            done < <(jq -r '.[0].Layers[]' "proof/${image}-saved-image/manifest.json")
          done
          keycloak_tag=hr-axis-onprem-keycloak:proof
          keycloak_id="$(docker create "$keycloak_tag")"
          mkdir -p proof/keycloak-rootfs
          docker export "$keycloak_id" | tar -xf - -C proof/keycloak-rootfs
          docker rm "$keycloak_id" >/dev/null
          node scripts/onprem-image-content-guard.mjs --rootfs proof/keycloak-rootfs --kind keycloak --application-root /opt/keycloak --json \
            | tee proof/keycloak-content-guard.json
          docker save "$keycloak_tag" -o proof/keycloak-image.tar
          mkdir -p proof/keycloak-saved-image
          tar -xf proof/keycloak-image.tar -C proof/keycloak-saved-image
          keycloak_layer_index=0
          while IFS= read -r layer; do
            keycloak_layer_root="proof/keycloak-layer-${keycloak_layer_index}-rootfs"
            mkdir "$keycloak_layer_root"
            tar -xf "proof/keycloak-saved-image/$layer" -C "$keycloak_layer_root"
            node scripts/onprem-image-content-guard.mjs --rootfs "$keycloak_layer_root" --kind keycloak --application-root /opt/keycloak --json \
              | tee "proof/keycloak-layer-${keycloak_layer_index}-content-guard.json"
            keycloak_layer_index=$((keycloak_layer_index + 1))
          done < <(jq -r '.[0].Layers[]' proof/keycloak-saved-image/manifest.json)

      - name: Generate signed complete content-guard index
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { chmodSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { generateKeyPairSync } from 'node:crypto'
          import { createContentGuardIndex } from './scripts/onprem-offline-content-guard-index.mjs'

          const temporaryDirectory = process.env.RUNNER_TEMP
          const privateKeyPath = join(temporaryDirectory, 'onprem-content-guard-ephemeral-private.pem')
          const publicKeyPath = join(process.cwd(), 'proof', 'content-guard-index-public.pem')
          const { privateKey, publicKey } = generateKeyPairSync('ed25519')
          writeFileSync(privateKeyPath, privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 })
          chmodSync(privateKeyPath, 0o600)
          writeFileSync(publicKeyPath, publicKey.export({ type: 'spki', format: 'pem' }), { mode: 0o644 })
          const images = Object.fromEntries(['backend', 'frontend', 'keycloak'].map((name) => {
            const tag = name === 'keycloak' ? 'hr-axis-onprem-keycloak:proof' : `hr-axis-onprem-${name}:proof`
            const imageId = execFileSync('docker', ['image', 'inspect', tag, '--format', '{{.Id}}'], { encoding: 'utf8' }).trim()
            if (!imageId) throw new Error(`missing ${name} image ID`)
            return [name, { imageId, archivePath: `${name}-image.tar`, finalRootfsPath: `${name}-content-guard.json` }]
          }))
          createContentGuardIndex({ baseDir: join(process.cwd(), 'proof'), images, privateKeyPath, outputPath: join(process.cwd(), 'proof', 'content-guard-index.json') })
          NODE

      - name: Generate production license inventories and notices
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          mkdir -p proof/base-license-evidence/debian proof/base-license-evidence/node proof/base-license-evidence/alpine
          build_evidence_container="$(docker create "$BUILD_IMAGE")"
          runtime_evidence_container="$(docker create "$BACKEND_RUNTIME_IMAGE")"
          frontend_evidence_container="$(docker create "$FRONTEND_RUNTIME_IMAGE")"
          trap 'docker rm "$build_evidence_container" "$runtime_evidence_container" "$frontend_evidence_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$build_evidence_container:/usr/share/doc/base-files/copyright" proof/base-license-evidence/debian/base-files-13.8+deb13u6.copyright
          docker cp "$build_evidence_container:/usr/share/doc/gcc-14-base/copyright" proof/base-license-evidence/debian/gcc-14-base-14.2.0-19.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libc6/copyright" proof/base-license-evidence/debian/libc6-2.41-12+deb13u3.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libssl3t64/copyright" proof/base-license-evidence/debian/libssl3t64-3.5.6-1~deb13u2.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libzstd1/copyright" proof/base-license-evidence/debian/libzstd1-1.5.7+dfsg-1.copyright
          docker cp "$build_evidence_container:/usr/share/doc/tzdata/copyright" proof/base-license-evidence/debian/tzdata-2026b-0+deb13u1.copyright
          docker cp "$build_evidence_container:/usr/local/LICENSE" proof/base-license-evidence/node/node-24.19.0.LICENSE
          docker cp "$runtime_evidence_container:/usr/share/doc/media-types/copyright" proof/base-license-evidence/debian/media-types-13.0.0.copyright
          docker cp "$frontend_evidence_container:/usr/share/licenses/nginx/COPYRIGHT" proof/base-license-evidence/alpine/nginx-1.30.4-r1.COPYRIGHT
          frontend_apk_metadata="$RUNNER_TEMP/hr-axis-onprem-frontend-apk-installed"
          docker cp "$frontend_evidence_container:/lib/apk/db/installed" "$frontend_apk_metadata"
          awk 'BEGIN { package = 0 } /^P:tzdata$/ { package = 1 } package { print } package && /^$/ { exit }' "$frontend_apk_metadata" > proof/base-license-evidence/alpine/tzdata-2026c-r0.apk-installed
          rm -f "$frontend_apk_metadata"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf proof/base-license-evidence.tar -C proof/base-license-evidence .
          npm ci --prefix backend/nestjs
          npm ci --prefix admin-web
          npm ci --prefix tools/onprem-license --ignore-scripts
          spdx_license_directory=tools/onprem-license/node_modules/spdx-license-list/licenses
          node scripts/onprem-third-party-notices.mjs \
            --package-json backend/nestjs/package.json --lockfile backend/nestjs/package-lock.json --node-modules proof/backend-rootfs/app/node_modules \
            --spdx-license-directory "$spdx_license_directory" \
            --inventory proof/backend-license-inventory.json --notices proof/backend-THIRD_PARTY_NOTICES.txt
          node scripts/onprem-third-party-notices.mjs \
            --package-json admin-web/package.json --lockfile admin-web/package-lock.json --node-modules admin-web/node_modules \
            --spdx-license-directory "$spdx_license_directory" \
            --inventory proof/frontend-license-inventory.json --notices proof/frontend-THIRD_PARTY_NOTICES.txt
          for image in backend frontend; do
            if test "$image" = backend; then base_image="$BACKEND_RUNTIME_IMAGE"; else base_image="$FRONTEND_RUNTIME_IMAGE"; fi
            node scripts/onprem-image-license-reconciliation.mjs \
              --sbom "proof/${image}-sbom.spdx.json" \
              --npm-inventory "proof/${image}-license-inventory.json" \
              --npm-notices "proof/${image}-THIRD_PARTY_NOTICES.txt" \
              --policy infra/onprem/images/base-license-policy-v1.json \
              --image-kind "$image" --base-image "$base_image" \
              --rootfs "proof/${image}-rootfs" \
              --evidence-dir proof/base-license-evidence \
              --spdx-license-directory "$spdx_license_directory" \
              --receipt "proof/${image}-image-license-reconciliation.json" \
              --notices "proof/${image}-image-THIRD_PARTY_NOTICES.txt"
          done
          keycloak_license_container="$(docker create "$KEYCLOAK_IMAGE")"
          trap 'docker rm "$keycloak_license_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$keycloak_license_container:/opt/keycloak/LICENSE.txt" proof/keycloak-LICENSE.txt
          docker export "$keycloak_license_container" | tar -tf - | grep -Ei '(^|/)(LICENSE|NOTICE)(\.[^/]*)?$' > proof/keycloak-license-paths.txt
          test -s proof/keycloak-license-paths.txt
          mkdir -p proof/keycloak-license-evidence
          while IFS= read -r license_path; do
            license_rel="${license_path#/}"
            test -f "proof/keycloak-rootfs/$license_rel"
            mkdir -p "proof/keycloak-license-evidence/$(dirname "$license_rel")"
            cp "proof/keycloak-rootfs/$license_rel" "proof/keycloak-license-evidence/$license_rel"
          done < proof/keycloak-license-paths.txt
          angus_jar_rel=opt/keycloak/lib/lib/main/org.eclipse.angus.angus-mail-2.0.5.jar
          angus_jar="proof/keycloak-rootfs/$angus_jar_rel"
          test -f "$angus_jar"
          test "$(sha256sum "$angus_jar" | cut -d ' ' -f 1)" = b4d8c30d35f455def6c7a05fe595a1e62ea2b80cac3efec1e9ccf4118b23168a
          angus_evidence_root=proof/keycloak-license-evidence/embedded-jars/org.eclipse.angus.angus-mail-2.0.5
          mkdir -p "$angus_evidence_root/META-INF"
          python3 - "$angus_jar" "$angus_evidence_root" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          entries = ('META-INF/LICENSE.md', 'META-INF/NOTICE.md')
          with ZipFile(source) as archive:
              names = archive.namelist()
              for entry in entries:
                  if names.count(entry) != 1:
                      raise SystemExit(f'exactly one {entry} entry is required')
                  target = destination.joinpath(*entry.split('/'))
                  target.write_bytes(archive.read(entry))
          PY
          angus_license="$angus_evidence_root/META-INF/LICENSE.md"
          angus_notice="$angus_evidence_root/META-INF/NOTICE.md"
          test "$(sha256sum "$angus_license" | cut -d ' ' -f 1)" = a8f94fd9e41984cfadc6d26821c21ed047e3bdf48c5af899d735287e7cddd997
          test "$(sha256sum "$angus_notice" | cut -d ' ' -f 1)" = bba43e29c8098aaa07c2130d979f6d44a62f9ad51f8061c96bf6889ff5926819
          printf '%s\n' \
            "$angus_jar_rel!/META-INF/LICENSE.md" \
            "$angus_jar_rel!/META-INF/NOTICE.md" >> proof/keycloak-license-paths.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf proof/keycloak-license-evidence.tar -C proof/keycloak-license-evidence .
          keycloak_package_count="$(jq '.packages | length' proof/keycloak-sbom.spdx.json)"
          keycloak_image_id="$(docker image inspect "$KEYCLOAK_IMAGE" --format '{{.Id}}')"
          test "$keycloak_image_id" = "$KEYCLOAK_IMAGE_ID"
          printf '%s\n' '{"image":"'"$KEYCLOAK_IMAGE"'","imageId":"'"$keycloak_image_id"'","baseImage":"'"$KEYCLOAK_BASE_IMAGE"'","licenseEvidence":"keycloak-LICENSE.txt","licensePathEvidence":"keycloak-license-paths.txt","licenseBundle":"keycloak-license-evidence.tar","packageCount":'"$keycloak_package_count"',"dataClass":"synthetic"}' > proof/keycloak-license-inventory.json
          node scripts/onprem-keycloak-license-reconciliation.mjs \
            --sbom proof/keycloak-sbom.spdx.json --inventory proof/keycloak-license-inventory.json \
            --license-text proof/keycloak-LICENSE.txt --license-paths proof/keycloak-license-paths.txt \
            --license-bundle proof/keycloak-license-evidence.tar \
            --angus-source-jar "$angus_jar" --angus-license "$angus_license" --angus-notice "$angus_notice" \
            --output proof/keycloak-license-reconciliation.json
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          const receipt = JSON.parse(readFileSync('proof/keycloak-license-reconciliation.json', 'utf8'))
          if (receipt.residualExternalReviewRequired !== true) throw new Error('Keycloak license reconciliation must retain the residualExternalReviewRequired activation gate')
          if (receipt.packageCount !== 552 || receipt.maxUnresolvedCount !== 452) throw new Error('Keycloak license reconciliation pinned count contract changed')
          if (receipt.resolvedCount + receipt.unresolvedCount !== receipt.packageCount) throw new Error('Keycloak license reconciliation summary count mismatch')
          if (receipt.evidenceResolvedCount + receipt.sbomStandardAssertedCount !== receipt.resolvedCount) throw new Error('Keycloak license reconciliation resolved count mismatch')
          if (receipt.unresolvedCount > receipt.maxUnresolvedCount) throw new Error('Keycloak unresolved license count exceeds the approved boundary')
          const unresolved = receipt.components.filter((component) => component.classification === 'unresolved-external-review')
          if (unresolved.length !== receipt.unresolvedCount) throw new Error('Keycloak unresolved component count mismatch')
          if (unresolved.some((component) => component.license !== null || component.evidence !== null || !component.unresolvedReason)) throw new Error('Keycloak unresolved component claims unsupported license evidence')
          console.log('Keycloak license reconciliation: residualExternalReviewRequired=true (external review remains an activation gate)')
          NODE

      - name: Generate sanitized Keycloak image manifest
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          keycloak_image_id="$(docker image inspect "$KEYCLOAK_IMAGE" --format '{{.Id}}')"
          node scripts/onprem-keycloak-image-manifest.mjs \
            --base-image "$KEYCLOAK_BASE_IMAGE" \
            --image "hr-axis-onprem-keycloak@${keycloak_image_id}" --image-id "$keycloak_image_id" \
            --sbom proof/keycloak-sbom.spdx.json --trivy proof/keycloak-trivy.json \
            --license proof/keycloak-license-inventory.json \
            --license-text proof/keycloak-LICENSE.txt --license-paths proof/keycloak-license-paths.txt \
            --license-reconciliation proof/keycloak-license-reconciliation.json \
            --license-bundle proof/keycloak-license-evidence.tar \
            --content proof/keycloak-content-guard.json \
            --output proof/keycloak-image-manifest.json

      # This ephemeral key proves the manifest implementation is internally
      # consistent in CI. It is not the owner trust anchor. ONP-5 supplies and
      # pins the owner-controlled offline signing and verification keys.
      - name: Self-test signed synthetic release manifest
        if: inputs.proof_mode == 'full'
        env:
          SOURCE_REVISION: ${{ inputs.expected_sha }}
          BUILD_VERSION: onprem-${{ github.run_number }}
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/onprem-proof-private.pem"
          manifest_input="$RUNNER_TEMP/onprem-proof-manifest-input.json"
          trap 'rm -f "$private_key" "$manifest_input"' EXIT
          export FRONTEND_IMAGE_ID="$(docker image inspect hr-axis-onprem-frontend:proof --format '{{.Id}}')"
          export BACKEND_IMAGE_ID="$(docker image inspect hr-axis-onprem-backend:proof --format '{{.Id}}')"
          export PRIVATE_KEY_PATH="$private_key"
          export MANIFEST_INPUT_PATH="$manifest_input"
          node --input-type=module <<'NODE'
          import { generateKeyPairSync } from 'node:crypto'
          import { writeFileSync } from 'node:fs'
          const keys = generateKeyPairSync('ed25519')
          writeFileSync(process.env.PRIVATE_KEY_PATH, keys.privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 })
          writeFileSync('proof/ephemeral-public.pem', keys.publicKey.export({ type: 'spki', format: 'pem' }))
          const input = {
            dataClass: 'synthetic',
            sourceRevision: process.env.SOURCE_REVISION,
            version: process.env.BUILD_VERSION,
            buildTimestamp: process.env.BUILD_TIMESTAMP,
            configSchemaVersion: 1,
            baseImages: {
              build: process.env.BUILD_IMAGE,
              backendRuntime: process.env.BACKEND_RUNTIME_IMAGE,
              frontendRuntime: process.env.FRONTEND_RUNTIME_IMAGE,
              keycloakBase: process.env.KEYCLOAK_BASE_IMAGE,
              trivy: process.env.TRIVY_IMAGE,
              syft: process.env.SYFT_IMAGE,
            },
            artifacts: {
              backendImage: 'proof/backend-image.tar',
              frontendImage: 'proof/frontend-image.tar',
              keycloakImage: 'proof/keycloak-image.tar',
              backendSbom: 'proof/backend-sbom.spdx.json',
              frontendSbom: 'proof/frontend-sbom.spdx.json',
              keycloakSbom: 'proof/keycloak-sbom.spdx.json',
              backendVulnerabilityReport: 'proof/backend-trivy.json',
              frontendVulnerabilityReport: 'proof/frontend-trivy.json',
              keycloakVulnerabilityReport: 'proof/keycloak-trivy.json',
              backendLicenseInventory: 'proof/backend-license-inventory.json',
              frontendLicenseInventory: 'proof/frontend-license-inventory.json',
              keycloakLicenseInventory: 'proof/keycloak-license-inventory.json',
              keycloakLicenseText: 'proof/keycloak-LICENSE.txt',
              keycloakLicensePaths: 'proof/keycloak-license-paths.txt',
              keycloakLicenseReconciliation: 'proof/keycloak-license-reconciliation.json',
              keycloakLicenseBundle: 'proof/keycloak-license-evidence.tar',
              backendNotices: 'proof/backend-THIRD_PARTY_NOTICES.txt',
              frontendNotices: 'proof/frontend-THIRD_PARTY_NOTICES.txt',
              keycloakImageManifest: 'proof/keycloak-image-manifest.json',
              keycloakContentGuard: 'proof/keycloak-content-guard.json',
              backendImageLicenseReconciliation: 'proof/backend-image-license-reconciliation.json',
              frontendImageLicenseReconciliation: 'proof/frontend-image-license-reconciliation.json',
              backendImageNotices: 'proof/backend-image-THIRD_PARTY_NOTICES.txt',
              frontendImageNotices: 'proof/frontend-image-THIRD_PARTY_NOTICES.txt',
              baseLicenseEvidenceBundle: 'proof/base-license-evidence.tar',
            },
            imageIds: {
              backend: process.env.BACKEND_IMAGE_ID,
              frontend: process.env.FRONTEND_IMAGE_ID,
              keycloak: process.env.KEYCLOAK_IMAGE_ID,
            },
          }
          writeFileSync(process.env.MANIFEST_INPUT_PATH, JSON.stringify(input))
          NODE
          node scripts/onprem-release-manifest.mjs generate --input "$manifest_input" --output proof/release-manifest.json --private-key "$private_key"
          node scripts/onprem-release-manifest.mjs verify --input proof/release-manifest.json --base-dir proof --public-key proof/ephemeral-public.pem

      - name: Prepare UID-bound ephemeral synthetic secret files
        if: inputs.proof_mode == 'full'
        env:
          RELEASE_ID: onprem-core-${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          secret_root=infra/onprem/core/secret-files
          rm -rf "$secret_root"
          mkdir -p "$secret_root"/{backend,caddy,postgres,redis,keycloak}
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 -subj '/CN=HR Axis synthetic proof CA' \
            -keyout "$RUNNER_TEMP/onprem-proof-ca.key" -out "$secret_root/postgres/ca.crt"
          cp "$secret_root/postgres/ca.crt" "$secret_root/caddy/ca.crt"
          openssl req -newkey rsa:3072 -nodes -subj '/CN=postgres' \
            -addext 'subjectAltName=DNS:postgres' -keyout "$secret_root/postgres/server.key" -out "$RUNNER_TEMP/postgres.csr"
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/postgres.csr" -CA "$secret_root/postgres/ca.crt" \
            -CAkey "$RUNNER_TEMP/onprem-proof-ca.key" -CAcreateserial -copy_extensions copyall -out "$secret_root/postgres/server.crt"
          openssl req -newkey rsa:3072 -nodes -subj '/CN=onprem-proof.example.invalid' \
            -addext 'subjectAltName=DNS:onprem-proof.example.invalid' -keyout "$secret_root/caddy/server.key" -out "$RUNNER_TEMP/caddy.csr"
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/caddy.csr" -CA "$secret_root/caddy/ca.crt" \
            -CAkey "$RUNNER_TEMP/onprem-proof-ca.key" -CAcreateserial -copy_extensions copyall -out "$secret_root/caddy/server.crt"

          bootstrap_password="$(openssl rand -hex 24)"
          migrator_password="$(openssl rand -hex 24)"
          api_password="$(openssl rand -hex 24)"
          worker_password="$(openssl rand -hex 24)"
          redis_health_password="$(openssl rand -hex 24)"
          redis_api_password="$(openssl rand -hex 24)"
          redis_worker_password="$(openssl rand -hex 24)"
          keycloak_database_password="$(openssl rand -hex 24)"
          keycloak_bootstrap_password="$(openssl rand -hex 24)"
          keycloak_smtp_password="$(openssl rand -hex 24)"
          browser_session_secret="$(openssl rand -hex 32)"
          cat > "$secret_root/postgres/bootstrap-password" <<EOF
          $bootstrap_password
          EOF
          cat > "$secret_root/postgres/migrator-password" <<EOF
          $migrator_password
          EOF
          cat > "$secret_root/postgres/api-password" <<EOF
          $api_password
          EOF
          cat > "$secret_root/postgres/worker-password" <<EOF
          $worker_password
          EOF
          cat > "$secret_root/postgres/keycloak-password" <<EOF
          $keycloak_database_password
          EOF
          cat > "$secret_root/keycloak/database-password" <<EOF
          $keycloak_database_password
          EOF
          test "$(sha256sum "$secret_root/postgres/keycloak-password" | cut -d' ' -f1)" = "$(sha256sum "$secret_root/keycloak/database-password" | cut -d' ' -f1)"
          printf 'jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/run/secrets/postgres_tls_ca' > "$secret_root/keycloak/database-url"
          printf 'keycloak' > "$secret_root/keycloak/database-username"
          printf 'bootstrap-ci' > "$secret_root/keycloak/bootstrap-username"
          cat > "$secret_root/keycloak/bootstrap-password" <<EOF
          $keycloak_bootstrap_password
          EOF
          cat > "$secret_root/keycloak/smtp-auth-user" <<EOF
          synthetic-smtp-user
          EOF
          cat > "$secret_root/keycloak/smtp-password" <<EOF
          $keycloak_smtp_password
          EOF
          cat > "$secret_root/backend/browser-session-secret" <<EOF
          $browser_session_secret
          EOF
          : > "$secret_root/keycloak/synthetic-accounts"
          while IFS='|' read -r account_key username role employee_id company_ids region_ids store_ids read_company_ids read_region_ids read_store_ids assigned_store_ids; do
            account_password="$(openssl rand -hex 32)"
            cat >> "$secret_root/keycloak/synthetic-accounts" <<ROW
          $account_key|$username|$account_password|$role|$employee_id|$company_ids|$region_ids|$store_ids|$read_company_ids|$read_region_ids|$read_store_ids|$assigned_store_ids
          ROW
            unset account_password
          done <<'PERSONAS'
          onprem.store-manager|onprem.store-manager|STORE_MANAGER|synthetic-employee-store-manager|company-001|region-001|store-100|company-001|region-001|store-100,store-999|store-100
          onprem.region-manager|onprem.region-manager|REGION_MANAGER|synthetic-employee-region-manager|company-001|region-001|store-100,store-101|company-001|region-001|store-100,store-101|store-100,store-101
          onprem.report-viewer|onprem.report-viewer|REPORT_VIEWER|synthetic-employee-report-viewer|company-001|||company-001|||
          onprem.store-personnel|onprem.store-personnel|STORE_PERSONNEL|synthetic-employee-store-personnel|company-001|region-001|store-100|company-001|region-001|store-100|store-100
          onprem.visual-merchandiser|onprem.visual-merchandiser|VISUAL_MERCHANDISER|synthetic-employee-visual-merchandiser|company-001|region-001|store-100|company-001|region-001|store-100|store-100
          PERSONAS
          cat > "$secret_root/backend/migrator-database-url" <<EOF
          postgresql://hr_axis_migrator:$migrator_password@postgres:5432/hr_axis?sslmode=verify-full
          EOF
          cat > "$secret_root/backend/api-database-url" <<EOF
          postgresql://hr_axis_api:$api_password@postgres:5432/hr_axis?sslmode=verify-full
          EOF
          cp "$secret_root/backend/api-database-url" "$secret_root/keycloak/binder-database-url"
          cat > "$secret_root/backend/worker-database-url" <<EOF
          postgresql://hr_axis_worker:$worker_password@postgres:5432/hr_axis?sslmode=verify-full
          EOF
          printf 'user default off resetpass ~* &* +@all\nuser health on >%s ~* +ping\nuser api on >%s ~hr-axis:rate-limit:* ~bull:store-ops-import:* ~bull:store-ops-snapshot:* ~bull:store-ops-visual-comparison-shadow:* +@all -@admin -flushall -flushdb -swapdb -migrate\nuser worker on >%s ~bull:store-ops-import:* ~bull:store-ops-snapshot:* ~bull:store-ops-visual-comparison-shadow:* ~bull:hr-axis-onprem-synthetic-recovery-v1:* ~hr-axis:onprem:synthetic-recovery-v1:* +@all -@admin -flushall -flushdb -swapdb -migrate\n' "$redis_health_password" "$redis_api_password" "$redis_worker_password" > "$secret_root/redis/users.acl"
          cat > "$secret_root/redis/health-url" <<EOF
          redis://health:$redis_health_password@redis:6379
          EOF
          cat > "$secret_root/backend/redis-api-url" <<EOF
          redis://api:$redis_api_password@redis:6379
          EOF
          cat > "$secret_root/backend/redis-worker-url" <<EOF
          redis://worker:$redis_worker_password@redis:6379
          EOF

          chmod 0444 "$secret_root"/{caddy,postgres}/*.crt
          sudo chown 10001:10001 "$secret_root/caddy/server.key" && sudo chmod 0400 "$secret_root/caddy/server.key"
          sudo chown 70:70 "$secret_root/postgres/server.key" "$secret_root/postgres/"*-password && sudo chmod 0400 "$secret_root/postgres/server.key" "$secret_root/postgres/"*-password
          sudo chown 1000:1000 "$secret_root/keycloak/"* && sudo chmod 0400 "$secret_root/keycloak/"*
          sudo chown 999:1000 "$secret_root/redis/users.acl" "$secret_root/redis/health-url" && sudo chmod 0400 "$secret_root/redis/users.acl" "$secret_root/redis/health-url"
          sudo chown 65532:65532 "$secret_root/backend/"* && sudo chmod 0400 "$secret_root/backend/"*

          backend_id="$(docker image inspect hr-axis-onprem-backend:proof --format '{{.Id}}')"
          frontend_id="$(docker image inspect hr-axis-onprem-frontend:proof --format '{{.Id}}')"
          sed \
            -e "s|^HR_AXIS_RELEASE_ID=.*|HR_AXIS_RELEASE_ID=$RELEASE_ID|" \
            -e 's|^HR_AXIS_PUBLIC_HOST=.*|HR_AXIS_PUBLIC_HOST=onprem-proof.example.invalid|' \
            -e "s|^HR_AXIS_BACKEND_IMAGE=.*|HR_AXIS_BACKEND_IMAGE=$backend_id|" \
            -e "s|^HR_AXIS_FRONTEND_IMAGE=.*|HR_AXIS_FRONTEND_IMAGE=$frontend_id|" \
            -e "s|^KEYCLOAK_IMAGE=.*|KEYCLOAK_IMAGE=$KEYCLOAK_IMAGE_ID|" \
            -e 's|^KEYCLOAK_SYNTHETIC_ACCOUNTS_ENABLED=.*|KEYCLOAK_SYNTHETIC_ACCOUNTS_ENABLED=true|' \
            infra/onprem/core/env.template > "$RUNNER_TEMP/onprem-core.env"
          printf 'ONPREM_CORE_ENV=%s\n' "$RUNNER_TEMP/onprem-core.env" >> "$GITHUB_ENV"

      - name: Run mandatory fresh-volume core proof behind a reversible firewall
        if: inputs.proof_mode == 'full'
        env:
          RELEASE_ID: onprem-core-${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends conntrack
          sudo conntrack -L -o extended >/dev/null
          firewall_snapshot="$RUNNER_TEMP/onprem-core-iptables.before"
          sudo iptables-save > "$firewall_snapshot"
          cleanup() {
            local original_status=$?
            local cleanup_status=0
            local container_cleanup_status
            if sudo "$(command -v node)" scripts/onprem-keycloak-runtime-proof.mjs --cleanup \
              --compose infra/onprem/core/compose.yaml --env-file "$ONPREM_CORE_ENV" \
              --project hr-axis-onprem-keycloak --release-id "$RELEASE_ID"; then
              :
            else
              container_cleanup_status=$?
              cleanup_status="$container_cleanup_status"
            fi
            if sudo "$(command -v node)" scripts/onprem-core-runtime-proof.mjs --cleanup \
              --compose infra/onprem/core/compose.yaml --env-file "$ONPREM_CORE_ENV" \
              --project hr-axis-onprem-core --release-id "$RELEASE_ID"; then
              :
            else
              container_cleanup_status=$?
              if [ "$cleanup_status" -eq 0 ]; then cleanup_status="$container_cleanup_status"; fi
            fi
            if sudo iptables-restore < "$firewall_snapshot"; then
              :
            else
              local firewall_restore_status=$?
              if [ "$cleanup_status" -eq 0 ]; then cleanup_status="$firewall_restore_status"; fi
            fi
            if [ "$cleanup_status" -ne 0 ]; then
              echo "on-prem runtime cleanup failed (status=$cleanup_status)" >&2
              return "$cleanup_status"
            fi
            return "$original_status"
          }
          trap cleanup EXIT

          sudo iptables -F INPUT
          sudo iptables -P INPUT DROP
          sudo iptables -P FORWARD DROP
          sudo iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A INPUT -i lo -j ACCEPT
          sudo iptables -A INPUT -s 192.0.2.0/24 -p tcp --dport 22 -j ACCEPT
          sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT
          sudo iptables -A INPUT -j DROP
          sudo iptables -F DOCKER-USER
          sudo iptables -A DOCKER-USER -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          project_subnets='172.30.0.0/24 172.30.10.0/24 172.30.20.0/24 172.30.30.0/24'
          for source in $project_subnets; do
            for destination in $project_subnets; do
              sudo iptables -A DOCKER-USER -s "$source" -d "$destination" -m conntrack --ctstate NEW -j ACCEPT
            done
            sudo iptables -A DOCKER-USER -s "$source" -m conntrack --ctstate NEW -j REJECT
            sudo iptables -I OUTPUT 1 -d "$source" -j REJECT
          done
          sudo iptables -A DOCKER-USER -j RETURN

          sudo "$(command -v node)" scripts/onprem-core-runtime-proof.mjs --execute \
            --compose infra/onprem/core/compose.yaml \
            --env-file "$ONPREM_CORE_ENV" \
            --project hr-axis-onprem-core \
            --release-id "$RELEASE_ID" \
            --ssh-admin-cidr 192.0.2.0/24 \
            --require-fresh-volumes \
            --receipt "$RUNNER_TEMP/onprem-core-runtime-receipt.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/onprem-core-runtime-receipt.json"
          chmod 0600 "$RUNNER_TEMP/onprem-core-runtime-receipt.json"
          sudo "$(command -v node)" scripts/onprem-keycloak-runtime-proof.mjs --execute \
            --compose infra/onprem/core/compose.yaml \
            --env-file "$ONPREM_CORE_ENV" \
            --project hr-axis-onprem-keycloak \
            --release-id "$RELEASE_ID" \
            --auth-host onprem-proof.example.invalid \
            --accounts-file infra/onprem/core/secret-files/keycloak/synthetic-accounts \
            --ca-file infra/onprem/core/secret-files/postgres/ca.crt \
            --require-fresh-volumes \
            --receipt "$RUNNER_TEMP/onprem-keycloak-runtime-receipt.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/onprem-keycloak-runtime-receipt.json"
          chmod 0600 "$RUNNER_TEMP/onprem-keycloak-runtime-receipt.json"

      - name: Run mandatory synthetic SeaweedFS photo-storage proof
        if: inputs.proof_mode == 'full'
        env:
          RELEASE_ID: onprem-photo-storage-${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node scripts/onprem-photo-storage-runtime-proof.mjs --execute \
            --core-compose infra/onprem/core/compose.yaml \
            --compose infra/onprem/photo-storage/compose.yaml \
            --proof-compose infra/onprem/photo-storage/compose.proof.yaml \
            --project hr-axis-onprem-photo-storage \
            --release-id "$RELEASE_ID" \
            --receipt "$RUNNER_TEMP/onprem-photo-storage-runtime-receipt.json"
          chmod 0600 "$RUNNER_TEMP/onprem-photo-storage-runtime-receipt.json"

      - name: Generate SeaweedFS storage SBOM, license, and vulnerability evidence
        if: inputs.proof_mode == 'full'
        run: |
          set -euo pipefail
          docker pull "$SEAWEEDFS_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$SYFT_IMAGE" \
            "$SEAWEEDFS_IMAGE" -o spdx-json=/out/photo-storage-sbom.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$TRIVY_IMAGE" image \
            --format json --scanners vuln,secret --severity CRITICAL,HIGH,MEDIUM,LOW \
            --output /out/photo-storage-trivy.json "$SEAWEEDFS_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL --exit-code 1 "$SEAWEEDFS_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners secret --exit-code 1 "$SEAWEEDFS_IMAGE"
          test -s infra/onprem/photo-storage/LICENSE
          test "$(sha256sum infra/onprem/photo-storage/LICENSE | cut -d ' ' -f 1)" = d789d433cc11da163273d1e39be2e8fa67642f9a58ef220d3f258fa9c14ef613
          printf '%s\n' '{"image":"'"$SEAWEEDFS_IMAGE"'","license":"Apache-2.0","licenseSource":"seaweedfs/seaweedfs@4.41:LICENSE","licenseSha256":"d789d433cc11da163273d1e39be2e8fa67642f9a58ef220d3f258fa9c14ef613","dataClass":"synthetic"}' > proof/photo-storage-license-receipt.json

      - name: Emit fresh full proof identity and receipt
        if: inputs.proof_mode == 'full'
        id: emit-proof-output
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          evidence_sha="$(sha256sum proof/release-manifest.json | cut -d ' ' -f 1)"
          receipt_path=proof/onprem-proof-receipt.json
          printf '%s\n' '{"proofMode":"full","imageScope":"both","expectedSha":"'"$EXPECTED_SHA"'","evidenceSha":"'"$evidence_sha"'","dataClass":"synthetic"}' > "$receipt_path"
          receipt_sha256="$(sha256sum "$receipt_path" | cut -d ' ' -f 1)"
          {
            echo 'proof_mode=full'
            echo 'image_scope=both'
            echo "evidence_sha=$evidence_sha"
            echo "receipt_sha256=$receipt_sha256"
            echo "proven_sha=$EXPECTED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload sanitized runtime receipt
        if: inputs.proof_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-core-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/onprem-core-runtime-receipt.json

      - name: Upload sanitized Keycloak runtime receipt
        if: inputs.proof_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-keycloak-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/onprem-keycloak-runtime-receipt.json

      - name: Upload sanitized photo-storage proof and supply-chain evidence
        if: inputs.proof_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-photo-storage-proof-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/onprem-photo-storage-runtime-receipt.json
            proof/photo-storage-sbom.spdx.json
            proof/photo-storage-trivy.json
            proof/photo-storage-license-receipt.json

      - name: Upload sanitized proof artifacts
        if: inputs.proof_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-image-proof-${{ github.sha }}
          if-no-files-found: error
          path: |
            proof/*-content-guard.json
            proof/*-sbom.spdx.json
            proof/*-trivy.json
            proof/*-license-inventory.json
            proof/*-image-license-reconciliation.json
            proof/base-license-evidence/**
            proof/base-license-evidence.tar
            proof/*-THIRD_PARTY_NOTICES.txt
            proof/keycloak-image-manifest.json
            proof/keycloak-LICENSE.txt
            proof/keycloak-license-paths.txt
            proof/keycloak-license-reconciliation.json
            proof/keycloak-license-evidence.tar
            proof/backend-image.tar
            proof/frontend-image.tar
            proof/keycloak-image.tar
            proof/release-manifest.json
            proof/onprem-proof-receipt.json
            proof/content-guard-index.json
            proof/content-guard-index-public.pem
            proof/ephemeral-public.pem

  component_proof:
    needs: local-proof-gate
    name: component-proof
    if: inputs.proof_mode == 'component'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      proof_mode: ${{ steps.emit-proof-output.outputs.proof_mode }}
      image_scope: ${{ steps.emit-proof-output.outputs.image_scope }}
      evidence_sha: ${{ steps.emit-proof-output.outputs.evidence_sha }}
      receipt_sha256: ${{ steps.emit-proof-output.outputs.receipt_sha256 }}
      proven_sha: ${{ steps.emit-proof-output.outputs.proven_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate component proof inputs and exact checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROOF_MODE: ${{ inputs.proof_mode }}
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          test "$PROOF_MODE" = component
          case "$IMAGE_SCOPE" in frontend|backend|both) ;; *) exit 1 ;; esac
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Pin host proof toolchain to the image build Node line
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Build selected production images with synthetic inputs
        env:
          SOURCE_REVISION: ${{ inputs.expected_sha }}
          BUILD_VERSION: onprem-component-${{ github.run_number }}
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          mkdir -p proof
          BUILD_TIMESTAMP="$(node --input-type=module -e "console.log(new Date().toISOString())")"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          case "$IMAGE_SCOPE" in
            frontend|both)
              grep -Fqx "FROM $BUILD_IMAGE AS build" infra/onprem/images/frontend.Dockerfile
              grep -Fqx "FROM $FRONTEND_RUNTIME_IMAGE AS runtime" infra/onprem/images/frontend.Dockerfile
              docker build --file infra/onprem/images/frontend.Dockerfile --tag hr-axis-onprem-frontend:component-proof \
                --build-arg VITE_API_BASE_URL=/api \
                --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
                --build-arg BUILD_VERSION="$BUILD_VERSION" \
                --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" .
              ;;
          esac
          case "$IMAGE_SCOPE" in
            backend|both)
              grep -Fqx "FROM $BUILD_IMAGE AS dependencies" infra/onprem/images/backend.Dockerfile
              grep -Fqx "FROM $BACKEND_RUNTIME_IMAGE AS runtime" infra/onprem/images/backend.Dockerfile
              docker build --file infra/onprem/images/backend.Dockerfile --tag hr-axis-onprem-backend:component-proof \
                --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
                --build-arg BUILD_VERSION="$BUILD_VERSION" \
                --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" .
              ;;
          esac

      - name: Prove selected images are non-root and capability-free at startup
        env:
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          common=(--read-only --cap-drop=ALL --security-opt=no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m)
          if [[ "$IMAGE_SCOPE" = frontend || "$IMAGE_SCOPE" = both ]]; then
            frontend_user="$(docker image inspect hr-axis-onprem-frontend:component-proof --format '{{.Config.User}}')"
            test -n "$frontend_user" && test "$frontend_user" != 0 && test "$frontend_user" != root
            frontend_id="$(docker run -d "${common[@]}" -p 18080:8080 hr-axis-onprem-frontend:component-proof)"
            trap 'docker rm -f "$frontend_id" >/dev/null 2>&1 || true' EXIT
            for attempt in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:18080/health >/dev/null
            docker rm -f "$frontend_id" >/dev/null
            trap - EXIT
          fi
          if [[ "$IMAGE_SCOPE" = backend || "$IMAGE_SCOPE" = both ]]; then
            backend_user="$(docker image inspect hr-axis-onprem-backend:component-proof --format '{{.Config.User}}')"
            test -n "$backend_user" && test "$backend_user" != 0 && test "$backend_user" != root
            mapfile -t dependencies < <(node --input-type=module -e "import pkg from './backend/nestjs/package.json' with { type: 'json' }; console.log(Object.keys(pkg.dependencies).sort().join('\\n'))")
            docker run --rm "${common[@]}" hr-axis-onprem-backend:component-proof -e \
              "for (const name of process.argv.slice(1)) require.resolve(name); console.log('resolved=' + process.argv.slice(1).length)" \
              "${dependencies[@]}" | grep -F "resolved=${#dependencies[@]}"
            docker run --rm "${common[@]}" hr-axis-onprem-backend:component-proof -e \
              "Promise.all([require('sharp')({create:{width:1,height:1,channels:3,background:'#fff'}}).png().toBuffer(), Promise.resolve(require('@e965/xlsx').utils.book_new()), Promise.resolve(new (require('@aws-sdk/client-s3').S3Client)({region:'eu-central-1',credentials:{accessKeyId:'synthetic',secretAccessKey:'synthetic'}}))]).then((items)=>{items[2].destroy();console.log('lazy-runtime-smoke=ok')})" \
              | grep -F lazy-runtime-smoke=ok
            synthetic_env=(
              -e NODE_ENV=production -e HR_AXIS_STRICT_LOCAL=false -e HR_AXIS_DATA_CLASS=synthetic
              -e AUTH_MODE=jwt -e AUTH_PROVIDER_KEY=oidc
              -e JWT_SECRET=synthetic-only-not-a-real-secret-0000000000000000
              -e DATABASE_URL=postgres://synthetic:synthetic@127.0.0.1:5432/synthetic
              -e DB_SSL_MODE=require -e CORS_ALLOWED_ORIGINS=https://onprem.synthetic.invalid
              -e RATE_LIMIT_WINDOW_MS=60000 -e RATE_LIMIT_MAX=120 -e RATE_LIMIT_BACKEND=memory
              -e TRUST_PROXY_HOPS=0 -e QUEUE_BACKEND=in-memory -e ERROR_TRACKING_ENABLED=false
              -e PHOTO_MEDIA_STORAGE_ENABLED=false
            )
            api_id="$(docker run -d "${common[@]}" -p 18082:3000 "${synthetic_env[@]}" hr-axis-onprem-backend:component-proof)"
            worker_id="$(docker run -d "${common[@]}" "${synthetic_env[@]}" hr-axis-onprem-backend:component-proof dist/src/workers.js)"
            trap 'docker rm -f "$api_id" "$worker_id" >/dev/null 2>&1 || true' EXIT
            worker_started=false
            for attempt in $(seq 1 20); do
              api_status="$(docker inspect -f '{{.State.Status}}' "$api_id")"
              worker_status="$(docker inspect -f '{{.State.Status}}' "$worker_id")"
              if test "$worker_status" = running; then
                if docker logs "$worker_id" 2>&1 | grep -F 'BullMQ worker context started' >/dev/null; then worker_started=true; fi
              elif test "$worker_status" = exited; then
                test "$(docker inspect -f '{{.State.ExitCode}}' "$worker_id")" = 0
                if docker logs "$worker_id" 2>&1 | grep -F 'BullMQ worker context started' >/dev/null; then worker_started=true; fi
              fi
              if test "$api_status" = running && test "$worker_started" = true && curl --fail --silent http://127.0.0.1:18082/api/health/live >/dev/null; then break; fi
              if test "$api_status" = exited; then docker logs "$api_id"; docker logs "$worker_id"; exit 1; fi
              sleep 1
            done
            test "$(docker inspect -f '{{.State.Status}}' "$api_id")" = running
            curl --fail --silent http://127.0.0.1:18082/api/health/live | grep -F '"status":"ok"'
            test "$worker_started" = true
            docker rm -f "$api_id" "$worker_id" >/dev/null
            trap - EXIT
          fi

      - name: Generate selected image SBOMs and fail-closed vulnerability/secret scans
        env:
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          for image in frontend backend; do
            if [[ "$IMAGE_SCOPE" != both && "$IMAGE_SCOPE" != "$image" ]]; then continue; fi
            tag="hr-axis-onprem-${image}:component-proof"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$SYFT_IMAGE" \
              "$tag" -o "spdx-json=/out/${image}-component-sbom.spdx.json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$TRIVY_IMAGE" image \
              --format json --scanners vuln,secret --severity CRITICAL,HIGH,MEDIUM,LOW \
              --output "/out/${image}-component-trivy.json" "$tag"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity CRITICAL --exit-code 1 "$tag"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners secret --exit-code 1 "$tag"
          done

      - name: Export selected image filesystems and every layer through content guards
        env:
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          for image in frontend backend; do
            if [[ "$IMAGE_SCOPE" != both && "$IMAGE_SCOPE" != "$image" ]]; then continue; fi
            tag="hr-axis-onprem-${image}:component-proof"
            id="$(docker create "$tag")"
            mkdir -p "proof/${image}-component-rootfs"
            docker export "$id" | tar -xf - -C "proof/${image}-component-rootfs"
            docker rm "$id" >/dev/null
            node scripts/onprem-image-content-guard.mjs --rootfs "proof/${image}-component-rootfs" --kind "$image" --json \
              | tee "proof/${image}-component-content-guard.json"
            docker save "$tag" -o "proof/${image}-component-image.tar"
            mkdir -p "proof/${image}-component-saved-image"
            tar -xf "proof/${image}-component-image.tar" -C "proof/${image}-component-saved-image"
            layer_index=0
            while IFS= read -r layer; do
              layer_root="proof/${image}-component-layer-rootfs"
              rm -rf "$layer_root"
              mkdir -p "$layer_root"
              tar -xf "proof/${image}-component-saved-image/$layer" -C "$layer_root"
              node scripts/onprem-image-content-guard.mjs --rootfs "$layer_root" --kind "$image" --json \
                | tee "proof/${image}-component-layer-${layer_index}-content-guard.json"
              layer_index=$((layer_index + 1))
            done < <(jq -r '.[0].Layers[]' "proof/${image}-component-saved-image/manifest.json")
          done

      - name: Generate selected image license inventories, reconciliation, and notices
        env:
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          mkdir -p proof/base-license-evidence/debian proof/base-license-evidence/node proof/base-license-evidence/alpine
          build_evidence_container="$(docker create "$BUILD_IMAGE")"
          trap 'docker rm "$build_evidence_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$build_evidence_container:/usr/share/doc/base-files/copyright" proof/base-license-evidence/debian/base-files-13.8+deb13u6.copyright
          docker cp "$build_evidence_container:/usr/share/doc/gcc-14-base/copyright" proof/base-license-evidence/debian/gcc-14-base-14.2.0-19.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libc6/copyright" proof/base-license-evidence/debian/libc6-2.41-12+deb13u3.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libssl3t64/copyright" proof/base-license-evidence/debian/libssl3t64-3.5.6-1~deb13u2.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libzstd1/copyright" proof/base-license-evidence/debian/libzstd1-1.5.7+dfsg-1.copyright
          docker cp "$build_evidence_container:/usr/share/doc/tzdata/copyright" proof/base-license-evidence/debian/tzdata-2026b-0+deb13u1.copyright
          docker cp "$build_evidence_container:/usr/local/LICENSE" proof/base-license-evidence/node/node-24.19.0.LICENSE
          if [[ "$IMAGE_SCOPE" = frontend || "$IMAGE_SCOPE" = both ]]; then
            frontend_evidence_container="$(docker create "$FRONTEND_RUNTIME_IMAGE")"
            trap 'docker rm "$build_evidence_container" "$frontend_evidence_container" >/dev/null 2>&1 || true' EXIT
            docker cp "$frontend_evidence_container:/usr/share/licenses/nginx/COPYRIGHT" proof/base-license-evidence/alpine/nginx-1.30.4-r1.COPYRIGHT
            frontend_apk_metadata="$RUNNER_TEMP/hr-axis-onprem-frontend-component-apk-installed"
            docker cp "$frontend_evidence_container:/lib/apk/db/installed" "$frontend_apk_metadata"
            awk 'BEGIN { package = 0 } /^P:tzdata$/ { package = 1 } package { print } package && /^$/ { exit }' "$frontend_apk_metadata" > proof/base-license-evidence/alpine/tzdata-2026c-r0.apk-installed
            rm -f "$frontend_apk_metadata"
          fi
          if [[ "$IMAGE_SCOPE" = backend || "$IMAGE_SCOPE" = both ]]; then
            backend_evidence_container="$(docker create "$BACKEND_RUNTIME_IMAGE")"
            trap 'docker rm "$build_evidence_container" "$backend_evidence_container" >/dev/null 2>&1 || true' EXIT
            docker cp "$backend_evidence_container:/usr/share/doc/media-types/copyright" proof/base-license-evidence/debian/media-types-13.0.0.copyright
          fi
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf proof/base-license-evidence.tar -C proof/base-license-evidence .
          npm ci --prefix tools/onprem-license --ignore-scripts
          if [[ "$IMAGE_SCOPE" = backend || "$IMAGE_SCOPE" = both ]]; then
            npm ci --prefix backend/nestjs
            spdx_license_directory=tools/onprem-license/node_modules/spdx-license-list/licenses
            node scripts/onprem-third-party-notices.mjs \
              --package-json backend/nestjs/package.json --lockfile backend/nestjs/package-lock.json --node-modules proof/backend-component-rootfs/app/node_modules \
              --spdx-license-directory "$spdx_license_directory" \
              --inventory proof/backend-component-license-inventory.json --notices proof/backend-component-THIRD_PARTY_NOTICES.txt
            node scripts/onprem-image-license-reconciliation.mjs \
              --sbom proof/backend-component-sbom.spdx.json \
              --npm-inventory proof/backend-component-license-inventory.json \
              --npm-notices proof/backend-component-THIRD_PARTY_NOTICES.txt \
              --policy infra/onprem/images/base-license-policy-v1.json --image-kind backend --base-image "$BACKEND_RUNTIME_IMAGE" \
              --rootfs proof/backend-component-rootfs --evidence-dir proof/base-license-evidence \
              --spdx-license-directory "$spdx_license_directory" --receipt proof/backend-component-image-license-reconciliation.json \
              --notices proof/backend-component-image-THIRD_PARTY_NOTICES.txt
          fi
          if [[ "$IMAGE_SCOPE" = frontend || "$IMAGE_SCOPE" = both ]]; then
            npm ci --prefix admin-web
            spdx_license_directory=tools/onprem-license/node_modules/spdx-license-list/licenses
            node scripts/onprem-third-party-notices.mjs \
              --package-json admin-web/package.json --lockfile admin-web/package-lock.json --node-modules admin-web/node_modules \
              --spdx-license-directory "$spdx_license_directory" \
              --inventory proof/frontend-component-license-inventory.json --notices proof/frontend-component-THIRD_PARTY_NOTICES.txt
            node scripts/onprem-image-license-reconciliation.mjs \
              --sbom proof/frontend-component-sbom.spdx.json \
              --npm-inventory proof/frontend-component-license-inventory.json \
              --npm-notices proof/frontend-component-THIRD_PARTY_NOTICES.txt \
              --policy infra/onprem/images/base-license-policy-v1.json --image-kind frontend --base-image "$FRONTEND_RUNTIME_IMAGE" \
              --rootfs proof/frontend-component-rootfs --evidence-dir proof/base-license-evidence \
              --spdx-license-directory "$spdx_license_directory" --receipt proof/frontend-component-image-license-reconciliation.json \
              --notices proof/frontend-component-image-THIRD_PARTY_NOTICES.txt
          fi

      - name: Emit fresh component proof identity and receipt
        id: emit-proof-output
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_SCOPE: ${{ inputs.image_scope }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs'

          const scope = process.env.IMAGE_SCOPE
          const expectedSha = process.env.EXPECTED_SHA
          const images = scope === 'both' ? ['frontend', 'backend'] : [scope]
          const sha256 = (pathname) => createHash('sha256').update(readFileSync(pathname)).digest('hex')
          const evidence = { proofMode: 'component', imageScope: scope, expectedSha, dataClass: 'synthetic', images: {} }

          for (const image of images) {
            const imageId = execFileSync('docker', ['image', 'inspect', `hr-axis-onprem-${image}:component-proof`, '--format', '{{.Id}}'], { encoding: 'utf8' }).trim()
            if (!imageId) throw new Error(`missing selected ${image} image identity`)
            const paths = [
              `proof/${image}-component-sbom.spdx.json`,
              `proof/${image}-component-trivy.json`,
              `proof/${image}-component-content-guard.json`,
              `proof/${image}-component-license-inventory.json`,
              `proof/${image}-component-image-license-reconciliation.json`,
              `proof/${image}-component-THIRD_PARTY_NOTICES.txt`,
              ...readdirSync('proof').filter((name) => name.startsWith(`${image}-component-layer-`) && name.endsWith('-content-guard.json')).sort().map((name) => `proof/${name}`),
            ]
            for (const pathname of paths) {
              const stats = statSync(pathname)
              if (!stats.isFile() || stats.size === 0) throw new Error(`missing selected ${image} evidence: ${pathname}`)
            }
            evidence.images[image] = {
              imageId,
              artifacts: paths.map((pathname) => ({ path: pathname, bytes: statSync(pathname).size, sha256: sha256(pathname) })),
            }
          }
          const baseLicensePath = 'proof/base-license-evidence.tar'
          const baseLicenseStats = statSync(baseLicensePath)
          if (!baseLicenseStats.isFile() || baseLicenseStats.size === 0) throw new Error('missing base license evidence bundle')
          evidence.baseLicenseEvidence = { path: baseLicensePath, bytes: baseLicenseStats.size, sha256: sha256(baseLicensePath) }
          writeFileSync('proof/component-evidence.json', `${JSON.stringify(evidence)}\n`)
          const evidenceSha = sha256('proof/component-evidence.json')
          const receipt = { proofMode: 'component', imageScope: scope, expectedSha, evidenceSha, imageIds: Object.fromEntries(images.map((image) => [image, evidence.images[image].imageId])), dataClass: 'synthetic' }
          writeFileSync('proof/onprem-proof-receipt.json', `${JSON.stringify(receipt)}\n`)
          const receiptSha = sha256('proof/onprem-proof-receipt.json')
          writeFileSync('proof/component-proof-digests.env', `EVIDENCE_SHA=${evidenceSha}\nRECEIPT_SHA256=${receiptSha}\n`)
          NODE
          evidence_sha="$(sed -n 's/^EVIDENCE_SHA=//p' proof/component-proof-digests.env)"
          receipt_sha256="$(sed -n 's/^RECEIPT_SHA256=//p' proof/component-proof-digests.env)"
          [[ "$evidence_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$receipt_sha256" =~ ^[a-f0-9]{64}$ ]]
          {
            echo 'proof_mode=component'
            echo "image_scope=$IMAGE_SCOPE"
            echo "evidence_sha=$evidence_sha"
            echo "receipt_sha256=$receipt_sha256"
            echo "proven_sha=$EXPECTED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload sanitized component proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-image-component-proof-${{ github.sha }}
          if-no-files-found: error
          path: |
            proof/*-component-content-guard.json
            proof/*-component-layer-*-content-guard.json
            proof/*-component-sbom.spdx.json
            proof/*-component-trivy.json
            proof/*-component-license-inventory.json
            proof/*-component-image-license-reconciliation.json
            proof/*-component-THIRD_PARTY_NOTICES.txt
            proof/base-license-evidence/**
            proof/base-license-evidence.tar
            proof/component-evidence.json
            proof/onprem-proof-receipt.json
