name: on-prem image proof

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onprem-image-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_IMAGE: node:24-trixie-slim@sha256:0711b541c1c33a8a530ac4f0d391baa9a15b3d804695b1b24a47daa5fb60e74d
  BACKEND_RUNTIME_IMAGE: gcr.io/distroless/nodejs24-debian13:nonroot@sha256:fbbdda866ea71aef98c4abece17e3d61fbf820cc2ef3961522caa2478716171a
  FRONTEND_RUNTIME_IMAGE: nginxinc/nginx-unprivileged:1.30.4-alpine-slim@sha256:e88d990b349df8cf4aa82f16642d7a23375016638c9ace4e5c6ca25028e62e65
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  SYFT_IMAGE: anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pin host proof toolchain to the image build Node line
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Build dedicated images with synthetic inputs
        env:
          SOURCE_REVISION: ${{ github.sha }}
          BUILD_VERSION: onprem-${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p proof
          grep -Fqx "FROM $BUILD_IMAGE AS dependencies" infra/onprem/images/backend.Dockerfile
          grep -Fqx "FROM $BUILD_IMAGE AS build" infra/onprem/images/frontend.Dockerfile
          grep -Fqx "FROM $BACKEND_RUNTIME_IMAGE AS runtime" infra/onprem/images/backend.Dockerfile
          grep -Fqx "FROM $FRONTEND_RUNTIME_IMAGE AS runtime" infra/onprem/images/frontend.Dockerfile
          BUILD_TIMESTAMP="$(node --input-type=module -e "console.log(new Date().toISOString())")"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          docker build --file infra/onprem/images/frontend.Dockerfile --tag hr-axis-onprem-frontend:proof \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            .
          docker build --file infra/onprem/images/backend.Dockerfile --tag hr-axis-onprem-backend:proof \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            .

      - name: Prove ONP-2 static Compose, network, and firewall contracts
        run: |
          set -euo pipefail
          node --test scripts/onprem-core-contract.test.mjs scripts/onprem-core-firewall-verify.test.mjs
          docker compose --env-file infra/onprem/core/env.template --file infra/onprem/core/compose.yaml \
            --profile infra --profile migrate --profile seed --profile runtime config --quiet
          node scripts/onprem-core-firewall-verify.mjs \
            --input tests/fixtures/onprem-core-firewall-valid.v4 \
            --subnet 172.30.0.0/24 --subnet 172.30.10.0/24 --subnet 172.30.20.0/24 --subnet 172.30.30.0/24 \
            --proxy-port 443 --ssh-admin-cidr 192.0.2.0/24

      - name: Prove non-root image users
        run: |
          set -euo pipefail
          frontend_user="$(docker image inspect hr-axis-onprem-frontend:proof --format '{{.Config.User}}')"
          backend_user="$(docker image inspect hr-axis-onprem-backend:proof --format '{{.Config.User}}')"
          test -n "$frontend_user" && test "$frontend_user" != "0" && test "$frontend_user" != "root"
          test -n "$backend_user" && test "$backend_user" != "0" && test "$backend_user" != "root"

      - name: Prove the pruned backend dependency graph and lazy runtime features
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(node --input-type=module -e "import pkg from './backend/nestjs/package.json' with { type: 'json' }; console.log(Object.keys(pkg.dependencies).sort().join('\\n'))")
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            hr-axis-onprem-backend:proof -e \
            "for (const name of process.argv.slice(1)) require.resolve(name); console.log('resolved=' + process.argv.slice(1).length)" \
            "${dependencies[@]}" | grep -F "resolved=${#dependencies[@]}"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            hr-axis-onprem-backend:proof -e \
            "Promise.all([require('sharp')({create:{width:1,height:1,channels:3,background:'#fff'}}).png().toBuffer(), Promise.resolve(require('@e965/xlsx').utils.book_new()), Promise.resolve(new (require('@aws-sdk/client-s3').S3Client)({region:'eu-central-1',credentials:{accessKeyId:'synthetic',secretAccessKey:'synthetic'}}))]).then((items)=>{items[2].destroy();console.log('lazy-runtime-smoke=ok')})" \
            | grep -F 'lazy-runtime-smoke=ok'

      - name: Start frontend with read-only root and least privilege
        run: |
          set -euo pipefail
          frontend_id="$(docker run -d --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m -p 18080:8080 hr-axis-onprem-frontend:proof)"
          trap 'docker rm -f "$frontend_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$frontend_id"
          exit 1

      - name: Start API and worker from the same backend image
        run: |
          set -euo pipefail
          common=(--read-only --cap-drop=ALL --security-opt=no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m)
          synthetic_env=(
            -e NODE_ENV=production
            -e HR_AXIS_STRICT_LOCAL=false
            -e HR_AXIS_DATA_CLASS=synthetic
            -e AUTH_MODE=jwt
            -e AUTH_PROVIDER_KEY=oidc
            -e JWT_SECRET=synthetic-only-not-a-real-secret-0000000000000000
            -e DATABASE_URL=postgres://synthetic:synthetic@127.0.0.1:5432/synthetic
            -e DB_SSL_MODE=require
            -e CORS_ALLOWED_ORIGINS=https://onprem.synthetic.invalid
            -e RATE_LIMIT_WINDOW_MS=60000
            -e RATE_LIMIT_MAX=120
            -e RATE_LIMIT_BACKEND=memory
            -e TRUST_PROXY_HOPS=0
            -e QUEUE_BACKEND=in-memory
            -e ERROR_TRACKING_ENABLED=false
            -e PHOTO_MEDIA_STORAGE_ENABLED=false
          )
          api_id="$(docker run -d "${common[@]}" -p 18082:3000 "${synthetic_env[@]}" hr-axis-onprem-backend:proof)"
          worker_id="$(docker run -d "${common[@]}" "${synthetic_env[@]}" hr-axis-onprem-backend:proof dist/src/workers.js)"
          trap 'docker rm -f "$api_id" "$worker_id" >/dev/null 2>&1 || true' EXIT
          worker_started=false
          for attempt in $(seq 1 20); do
            api_status="$(docker inspect -f '{{.State.Status}}' "$api_id")"
            worker_status="$(docker inspect -f '{{.State.Status}}' "$worker_id")"
            if test "$worker_status" = running; then
              worker_started=true
            elif test "$worker_status" = exited; then
              test "$(docker inspect -f '{{.State.ExitCode}}' "$worker_id")" = 0
              worker_started=true
            fi
            if test "$api_status" = running && test "$worker_started" = true \
              && curl --fail --silent http://127.0.0.1:18082/api/health/live >/dev/null; then break; fi
            if test "$api_status" = exited; then
              docker logs "$api_id" || true
              docker logs "$worker_id" || true
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Status}}' "$api_id")" = running
          curl --fail --silent http://127.0.0.1:18082/api/health/live | grep -F '"status":"ok"'
          test "$worker_started" = true
          test "$(docker inspect -f '{{.Config.Image}}' "$api_id")" = "hr-axis-onprem-backend:proof"
          test "$(docker inspect -f '{{.Config.Image}}' "$worker_id")" = "hr-axis-onprem-backend:proof"
          docker logs "$worker_id" 2>&1 | grep -F 'BullMQ worker context started'

      - name: Generate SPDX SBOMs with pinned Syft
        run: |
          set -euo pipefail
          for image in frontend backend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$SYFT_IMAGE" \
              "hr-axis-onprem-${image}:proof" -o "spdx-json=/out/${image}-sbom.spdx.json"
          done

      - name: Fail closed on image vulnerabilities and secrets with pinned Trivy
        run: |
          set -euo pipefail
          for image in frontend backend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/proof:/out" "$TRIVY_IMAGE" image \
              --format json --scanners vuln,secret --severity CRITICAL,HIGH,MEDIUM,LOW \
              --output "/out/${image}-trivy.json" "hr-axis-onprem-${image}:proof"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity CRITICAL --exit-code 1 "hr-axis-onprem-${image}:proof"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners secret --exit-code 1 "hr-axis-onprem-${image}:proof"
          done

      - name: Export final filesystems and layers then run content guards
        run: |
          set -euo pipefail
          for image in frontend backend; do
            tag="hr-axis-onprem-${image}:proof"
            id="$(docker create "$tag")"
            mkdir -p "proof/${image}-rootfs"
            docker export "$id" | tar -xf - -C "proof/${image}-rootfs"
            docker rm "$id" >/dev/null
            node scripts/onprem-image-content-guard.mjs --rootfs "proof/${image}-rootfs" --kind "$image" --json \
              | tee "proof/${image}-content-guard.json"

            docker save "$tag" -o "proof/${image}-image.tar"
            mkdir -p "proof/${image}-saved-image"
            tar -xf "proof/${image}-image.tar" -C "proof/${image}-saved-image"
            layer_index=0
            while IFS= read -r layer; do
              layer_root="proof/${image}-layer-rootfs"
              rm -rf "$layer_root"
              mkdir -p "$layer_root"
              tar -xf "proof/${image}-saved-image/$layer" -C "$layer_root"
              node scripts/onprem-image-content-guard.mjs --rootfs "$layer_root" --kind "$image" --json \
                | tee "proof/${image}-layer-${layer_index}-content-guard.json"
              layer_index=$((layer_index + 1))
            done < <(jq -r '.[0].Layers[]' "proof/${image}-saved-image/manifest.json")
          done

      - name: Generate production license inventories and notices
        run: |
          set -euo pipefail
          mkdir -p proof/base-license-evidence/debian proof/base-license-evidence/node proof/base-license-evidence/alpine
          build_evidence_container="$(docker create "$BUILD_IMAGE")"
          runtime_evidence_container="$(docker create "$BACKEND_RUNTIME_IMAGE")"
          frontend_evidence_container="$(docker create "$FRONTEND_RUNTIME_IMAGE")"
          trap 'docker rm "$build_evidence_container" "$runtime_evidence_container" "$frontend_evidence_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$build_evidence_container:/usr/share/doc/base-files/copyright" proof/base-license-evidence/debian/base-files-13.8+deb13u6.copyright
          docker cp "$build_evidence_container:/usr/share/doc/gcc-14-base/copyright" proof/base-license-evidence/debian/gcc-14-base-14.2.0-19.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libc6/copyright" proof/base-license-evidence/debian/libc6-2.41-12+deb13u3.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libssl3t64/copyright" proof/base-license-evidence/debian/libssl3t64-3.5.6-1~deb13u2.copyright
          docker cp "$build_evidence_container:/usr/share/doc/libzstd1/copyright" proof/base-license-evidence/debian/libzstd1-1.5.7+dfsg-1.copyright
          docker cp "$build_evidence_container:/usr/share/doc/tzdata/copyright" proof/base-license-evidence/debian/tzdata-2026b-0+deb13u1.copyright
          docker cp "$build_evidence_container:/usr/local/LICENSE" proof/base-license-evidence/node/node-24.19.0.LICENSE
          docker cp "$runtime_evidence_container:/usr/share/doc/media-types/copyright" proof/base-license-evidence/debian/media-types-13.0.0.copyright
          docker cp "$frontend_evidence_container:/usr/share/licenses/nginx/COPYRIGHT" proof/base-license-evidence/alpine/nginx-1.30.4-r1.COPYRIGHT
          frontend_apk_metadata="$RUNNER_TEMP/hr-axis-onprem-frontend-apk-installed"
          docker cp "$frontend_evidence_container:/lib/apk/db/installed" "$frontend_apk_metadata"
          awk 'BEGIN { package = 0 } /^P:tzdata$/ { package = 1 } package { print } package && /^$/ { exit }' "$frontend_apk_metadata" > proof/base-license-evidence/alpine/tzdata-2026c-r0.apk-installed
          rm -f "$frontend_apk_metadata"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf proof/base-license-evidence.tar -C proof/base-license-evidence .
          npm ci --prefix backend/nestjs
          npm ci --prefix admin-web
          npm ci --prefix tools/onprem-license --ignore-scripts
          spdx_license_directory=tools/onprem-license/node_modules/spdx-license-list/licenses
          node scripts/onprem-third-party-notices.mjs \
            --package-json backend/nestjs/package.json --lockfile backend/nestjs/package-lock.json --node-modules proof/backend-rootfs/app/node_modules \
            --spdx-license-directory "$spdx_license_directory" \
            --inventory proof/backend-license-inventory.json --notices proof/backend-THIRD_PARTY_NOTICES.txt
          node scripts/onprem-third-party-notices.mjs \
            --package-json admin-web/package.json --lockfile admin-web/package-lock.json --node-modules admin-web/node_modules \
            --spdx-license-directory "$spdx_license_directory" \
            --inventory proof/frontend-license-inventory.json --notices proof/frontend-THIRD_PARTY_NOTICES.txt
          for image in backend frontend; do
            if test "$image" = backend; then base_image="$BACKEND_RUNTIME_IMAGE"; else base_image="$FRONTEND_RUNTIME_IMAGE"; fi
            node scripts/onprem-image-license-reconciliation.mjs \
              --sbom "proof/${image}-sbom.spdx.json" \
              --npm-inventory "proof/${image}-license-inventory.json" \
              --npm-notices "proof/${image}-THIRD_PARTY_NOTICES.txt" \
              --policy infra/onprem/images/base-license-policy-v1.json \
              --image-kind "$image" --base-image "$base_image" \
              --rootfs "proof/${image}-rootfs" \
              --evidence-dir proof/base-license-evidence \
              --spdx-license-directory "$spdx_license_directory" \
              --receipt "proof/${image}-image-license-reconciliation.json" \
              --notices "proof/${image}-image-THIRD_PARTY_NOTICES.txt"
          done

      # This ephemeral key proves the manifest implementation is internally
      # consistent in CI. It is not the owner trust anchor. ONP-5 supplies and
      # pins the owner-controlled offline signing and verification keys.
      - name: Self-test signed synthetic release manifest
        env:
          SOURCE_REVISION: ${{ github.sha }}
          BUILD_VERSION: onprem-${{ github.run_number }}
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/onprem-proof-private.pem"
          manifest_input="$RUNNER_TEMP/onprem-proof-manifest-input.json"
          trap 'rm -f "$private_key" "$manifest_input"' EXIT
          export FRONTEND_IMAGE_ID="$(docker image inspect hr-axis-onprem-frontend:proof --format '{{.Id}}')"
          export BACKEND_IMAGE_ID="$(docker image inspect hr-axis-onprem-backend:proof --format '{{.Id}}')"
          export PRIVATE_KEY_PATH="$private_key"
          export MANIFEST_INPUT_PATH="$manifest_input"
          node --input-type=module <<'NODE'
          import { generateKeyPairSync } from 'node:crypto'
          import { writeFileSync } from 'node:fs'
          const keys = generateKeyPairSync('ed25519')
          writeFileSync(process.env.PRIVATE_KEY_PATH, keys.privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 })
          writeFileSync('proof/ephemeral-public.pem', keys.publicKey.export({ type: 'spki', format: 'pem' }))
          const input = {
            dataClass: 'synthetic',
            sourceRevision: process.env.SOURCE_REVISION,
            version: process.env.BUILD_VERSION,
            buildTimestamp: process.env.BUILD_TIMESTAMP,
            configSchemaVersion: 1,
            baseImages: {
              build: process.env.BUILD_IMAGE,
              backendRuntime: process.env.BACKEND_RUNTIME_IMAGE,
              frontendRuntime: process.env.FRONTEND_RUNTIME_IMAGE,
              trivy: process.env.TRIVY_IMAGE,
              syft: process.env.SYFT_IMAGE,
            },
            artifacts: {
              backendImage: 'proof/backend-image.tar',
              frontendImage: 'proof/frontend-image.tar',
              backendSbom: 'proof/backend-sbom.spdx.json',
              frontendSbom: 'proof/frontend-sbom.spdx.json',
              backendVulnerabilityReport: 'proof/backend-trivy.json',
              frontendVulnerabilityReport: 'proof/frontend-trivy.json',
              backendLicenseInventory: 'proof/backend-license-inventory.json',
              frontendLicenseInventory: 'proof/frontend-license-inventory.json',
              backendNotices: 'proof/backend-THIRD_PARTY_NOTICES.txt',
              frontendNotices: 'proof/frontend-THIRD_PARTY_NOTICES.txt',
              backendImageLicenseReconciliation: 'proof/backend-image-license-reconciliation.json',
              frontendImageLicenseReconciliation: 'proof/frontend-image-license-reconciliation.json',
              backendImageNotices: 'proof/backend-image-THIRD_PARTY_NOTICES.txt',
              frontendImageNotices: 'proof/frontend-image-THIRD_PARTY_NOTICES.txt',
              baseLicenseEvidenceBundle: 'proof/base-license-evidence.tar',
            },
            imageIds: {
              backend: process.env.BACKEND_IMAGE_ID,
              frontend: process.env.FRONTEND_IMAGE_ID,
            },
          }
          writeFileSync(process.env.MANIFEST_INPUT_PATH, JSON.stringify(input))
          NODE
          node scripts/onprem-release-manifest.mjs generate --input "$manifest_input" --output proof/release-manifest.json --private-key "$private_key"
          node scripts/onprem-release-manifest.mjs verify --input proof/release-manifest.json --base-dir proof --public-key proof/ephemeral-public.pem

      - name: Prepare UID-bound ephemeral synthetic secret files
        env:
          RELEASE_ID: onprem-core-${{ github.sha }}
        run: |
          set -euo pipefail
          secret_root=infra/onprem/core/secret-files
          rm -rf "$secret_root"
          mkdir -p "$secret_root"/{backend,caddy,postgres,redis}
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 -subj '/CN=HR Axis synthetic proof CA' \
            -keyout "$RUNNER_TEMP/onprem-proof-ca.key" -out "$secret_root/postgres/ca.crt"
          cp "$secret_root/postgres/ca.crt" "$secret_root/caddy/ca.crt"
          openssl req -newkey rsa:3072 -nodes -subj '/CN=postgres' \
            -addext 'subjectAltName=DNS:postgres' -keyout "$secret_root/postgres/server.key" -out "$RUNNER_TEMP/postgres.csr"
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/postgres.csr" -CA "$secret_root/postgres/ca.crt" \
            -CAkey "$RUNNER_TEMP/onprem-proof-ca.key" -CAcreateserial -copy_extensions copyall -out "$secret_root/postgres/server.crt"
          openssl req -newkey rsa:3072 -nodes -subj '/CN=onprem-proof.example.invalid' \
            -addext 'subjectAltName=DNS:onprem-proof.example.invalid' -keyout "$secret_root/caddy/server.key" -out "$RUNNER_TEMP/caddy.csr"
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/caddy.csr" -CA "$secret_root/caddy/ca.crt" \
            -CAkey "$RUNNER_TEMP/onprem-proof-ca.key" -CAcreateserial -copy_extensions copyall -out "$secret_root/caddy/server.crt"

          bootstrap_password="$(openssl rand -hex 24)"
          migrator_password="$(openssl rand -hex 24)"
          api_password="$(openssl rand -hex 24)"
          worker_password="$(openssl rand -hex 24)"
          redis_health_password="$(openssl rand -hex 24)"
          redis_api_password="$(openssl rand -hex 24)"
          redis_worker_password="$(openssl rand -hex 24)"
          printf '%s' "$bootstrap_password" > "$secret_root/postgres/bootstrap-password"
          printf '%s' "$migrator_password" > "$secret_root/postgres/migrator-password"
          printf '%s' "$api_password" > "$secret_root/postgres/api-password"
          printf '%s' "$worker_password" > "$secret_root/postgres/worker-password"
          printf 'postgresql://hr_axis_migrator:%s@postgres:5432/hr_axis?sslmode=verify-full' "$migrator_password" > "$secret_root/backend/migrator-database-url"
          printf 'postgresql://hr_axis_api:%s@postgres:5432/hr_axis?sslmode=verify-full' "$api_password" > "$secret_root/backend/api-database-url"
          printf 'postgresql://hr_axis_worker:%s@postgres:5432/hr_axis?sslmode=verify-full' "$worker_password" > "$secret_root/backend/worker-database-url"
          printf 'user default off\nuser health on >%s ~* +ping\nuser api on >%s ~hr-axis:rate-limit:* ~bull:store-ops-import:* ~bull:store-ops-snapshot:* ~bull:store-ops-visual-comparison-shadow:* +@all -@admin -flushall -flushdb -swapdb -migrate\nuser worker on >%s ~bull:store-ops-import:* ~bull:store-ops-snapshot:* ~bull:store-ops-visual-comparison-shadow:* ~bull:hr-axis-onprem-synthetic-recovery-v1:* ~hr-axis:onprem:synthetic-recovery-v1:* +@all -@admin -flushall -flushdb -swapdb -migrate\n' \
            "$redis_health_password" "$redis_api_password" "$redis_worker_password" > "$secret_root/redis/users.acl"
          printf 'redis://health:%s@redis:6379' "$redis_health_password" > "$secret_root/redis/health-url"
          printf 'redis://api:%s@redis:6379' "$redis_api_password" > "$secret_root/backend/redis-api-url"
          printf 'redis://worker:%s@redis:6379' "$redis_worker_password" > "$secret_root/backend/redis-worker-url"
          openssl rand -hex 32 > "$secret_root/backend/jwt-secret"

          chmod 0444 "$secret_root"/{caddy,postgres}/*.crt
          sudo chown 10001:10001 "$secret_root/caddy/server.key" && sudo chmod 0400 "$secret_root/caddy/server.key"
          sudo chown 70:70 "$secret_root/postgres/server.key" "$secret_root/postgres/"*-password && sudo chmod 0400 "$secret_root/postgres/server.key" "$secret_root/postgres/"*-password
          sudo chown 999:1000 "$secret_root/redis/users.acl" "$secret_root/redis/health-url" && sudo chmod 0400 "$secret_root/redis/users.acl" "$secret_root/redis/health-url"
          sudo chown 65532:65532 "$secret_root/backend/"* && sudo chmod 0400 "$secret_root/backend/"*

          backend_id="$(docker image inspect hr-axis-onprem-backend:proof --format '{{.Id}}')"
          frontend_id="$(docker image inspect hr-axis-onprem-frontend:proof --format '{{.Id}}')"
          sed \
            -e "s|^HR_AXIS_RELEASE_ID=.*|HR_AXIS_RELEASE_ID=$RELEASE_ID|" \
            -e 's|^HR_AXIS_PUBLIC_HOST=.*|HR_AXIS_PUBLIC_HOST=onprem-proof.example.invalid|' \
            -e "s|^HR_AXIS_BACKEND_IMAGE=.*|HR_AXIS_BACKEND_IMAGE=$backend_id|" \
            -e "s|^HR_AXIS_FRONTEND_IMAGE=.*|HR_AXIS_FRONTEND_IMAGE=$frontend_id|" \
            infra/onprem/core/env.template > "$RUNNER_TEMP/onprem-core.env"
          printf 'ONPREM_CORE_ENV=%s\n' "$RUNNER_TEMP/onprem-core.env" >> "$GITHUB_ENV"

      - name: Run mandatory fresh-volume core proof behind a reversible firewall
        env:
          RELEASE_ID: onprem-core-${{ github.sha }}
        run: |
          set -euo pipefail
          firewall_snapshot="$RUNNER_TEMP/onprem-core-iptables.before"
          sudo iptables-save > "$firewall_snapshot"
          cleanup() {
            docker compose --project-name hr-axis-onprem-core --env-file "$ONPREM_CORE_ENV" \
              --file infra/onprem/core/compose.yaml --profile infra --profile migrate \
              --profile seed --profile runtime down --remove-orphans >/dev/null 2>&1 || true
            sudo iptables-restore < "$firewall_snapshot"
          }
          trap cleanup EXIT

          sudo iptables -F INPUT
          sudo iptables -P INPUT DROP
          sudo iptables -P FORWARD DROP
          sudo iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A INPUT -i lo -j ACCEPT
          sudo iptables -A INPUT -s 192.0.2.0/24 -p tcp --dport 22 -j ACCEPT
          sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT
          sudo iptables -A INPUT -j DROP
          sudo iptables -F DOCKER-USER
          sudo iptables -A DOCKER-USER -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          project_subnets='172.30.0.0/24 172.30.10.0/24 172.30.20.0/24 172.30.30.0/24'
          for source in $project_subnets; do
            for destination in $project_subnets; do
              sudo iptables -A DOCKER-USER -s "$source" -d "$destination" -m conntrack --ctstate NEW -j ACCEPT
            done
            sudo iptables -A DOCKER-USER -s "$source" -m conntrack --ctstate NEW -j REJECT
            sudo iptables -I OUTPUT 1 -d "$source" -j REJECT
          done
          sudo iptables -A DOCKER-USER -j RETURN

          sudo "$(command -v node)" scripts/onprem-core-runtime-proof.mjs --execute \
            --compose infra/onprem/core/compose.yaml \
            --env-file "$ONPREM_CORE_ENV" \
            --project hr-axis-onprem-core \
            --release-id "$RELEASE_ID" \
            --ssh-admin-cidr 192.0.2.0/24 \
            --require-fresh-volumes \
            --receipt "$RUNNER_TEMP/onprem-core-runtime-receipt.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/onprem-core-runtime-receipt.json"
          chmod 0600 "$RUNNER_TEMP/onprem-core-runtime-receipt.json"

      - name: Upload sanitized runtime receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-core-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/onprem-core-runtime-receipt.json

      - name: Upload sanitized proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onprem-image-proof-${{ github.sha }}
          if-no-files-found: error
          path: |
            proof/*-content-guard.json
            proof/*-sbom.spdx.json
            proof/*-trivy.json
            proof/*-license-inventory.json
            proof/*-image-license-reconciliation.json
            proof/base-license-evidence/**
            proof/base-license-evidence.tar
            proof/*-THIRD_PARTY_NOTICES.txt
            proof/release-manifest.json
            proof/ephemeral-public.pem
