name: hr-axis-onprem-core

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    profiles: [runtime]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        source=/usr/bin/caddy
        destination=/run/caddy-bin/caddy
        temporary=/run/caddy-bin/.caddy.tmp
        rm -f "$${destination}" "$${temporary}"
        cp "$${source}" "$${temporary}"
        cmp -s "$${source}" "$${temporary}"
        source_sha256_output="$$(sha256sum "$${source}")"
        source_sha256="$${source_sha256_output%% *}"
        copy_sha256_output="$$(sha256sum "$${temporary}")"
        copy_sha256="$${copy_sha256_output%% *}"
        test "$${source_sha256}" = "$${copy_sha256}"
        copy_capabilities="$$(/usr/sbin/getcap "$${temporary}")"
        test -z "$${copy_capabilities}"
        chmod 0500 "$${temporary}"
        mv "$${temporary}" "$${destination}"
        exec "$${destination}" run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "443:8443"
    networks: [edge, proxy]
    environment:
      HR_AXIS_PUBLIC_HOST: ${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    secrets:
      - source: caddy_tls_certificate
        target: caddy_tls_certificate
      - source: caddy_tls_private_key
        target: caddy_tls_private_key
      - source: caddy_tls_ca
        target: caddy_tls_ca
    tmpfs:
      - /run/caddy-bin:rw,nosuid,nodev,exec,size=64m,uid=10001,gid=10001,mode=0700
      - /config:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
      - /data:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels: &project-labels
      com.hr-axis.project: hr-axis-onprem-core
      com.hr-axis.data-class: synthetic
      com.hr-axis.release-id: ${HR_AXIS_RELEASE_ID:?set the signed release identity}

  frontend:
    image: ${HR_AXIS_FRONTEND_IMAGE:?set an immutable frontend image reference}
    profiles: [runtime]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "8080"
    networks: [proxy]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 20s
    logging: *bounded-logging
    labels: *project-labels

  api:
    image: ${HR_AXIS_BACKEND_IMAGE:?set an immutable backend image reference}
    profiles: [runtime]
    command: [dist/src/main.js]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "3000"
    networks: [proxy, app, data]
    environment: &strict-local-environment
      NODE_ENV: production
      HR_AXIS_STRICT_LOCAL: "true"
      HR_AXIS_DATA_CLASS: synthetic
      APP_PORT: "3000"
      AUTH_MODE: jwt
      AUTH_PROVIDER_KEY: oidc
      ALLOW_MOCK_AUTH: "false"
      MIGRATIONS_HTTP_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}
      JWT_ISSUER: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}/realms/store-ops
      JWT_JWKS_URL: http://keycloak:8080/realms/store-ops/protocol/openid-connect/certs
      AUTH_AUTHORIZATION_URL: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}/realms/store-ops/protocol/openid-connect/auth
      AUTH_CLIENT_ID: store-ops-admin-web
      AUTH_SCOPE: openid profile email roles
      AUTH_RESPONSE_TYPE: code
      AUTH_TOKEN_URL: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}/realms/store-ops/protocol/openid-connect/token
      AUTH_LOGOUT_URL: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}/realms/store-ops/protocol/openid-connect/logout
      AUTH_CALLBACK_PATH: /auth/callback
      AUTH_POST_LOGOUT_REDIRECT_PATH: /auth/login
      BROWSER_SESSION_COOKIE_ENABLED: "true"
      BROWSER_SESSION_SECRET_FILE: /run/secrets/browser_session_secret
      TRUST_PROXY_HOPS: "1"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "120"
      RATE_LIMIT_BACKEND: redis
      QUEUE_BACKEND: bullmq
      DB_SSL_MODE: verify-full
      DATABASE_URL_FILE: /run/secrets/api_database_url
      DB_SSL_CA_FILE: /run/secrets/postgres_tls_ca
      REDIS_URL_FILE: /run/secrets/redis_api_url
      ERROR_TRACKING_ENABLED: "false"
      PHOTO_MEDIA_STORAGE_ENABLED: "false"
      PHOTO_MEDIA_SYNTHETIC_ONLY: "true"
      PHOTO_MEDIA_REAL_VM_PILOT_ENABLED: "false"
      VISUAL_COMPARISON_ENQUEUE_ENABLED: "false"
      VISUAL_COMPARISON_ADVISORY_ENQUEUE_ENABLED: "false"
      VISUAL_COMPARISON_ADVISORY_REVIEW_ENABLED: "false"
      VISUAL_COMPARISON_WORKER_ENABLED: "false"
    secrets:
      - source: api_database_url
        target: api_database_url
      - source: postgres_tls_ca
        target: postgres_tls_ca
      - source: redis_api_url
        target: redis_api_url
      - source: browser_session_secret
        target: browser_session_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: [CMD, /nodejs/bin/node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s
    cpus: 0.75
    mem_limit: 1536m
    pids_limit: 192
    stop_grace_period: 30s
    logging: *bounded-logging
    labels: *project-labels

  worker:
    image: ${HR_AXIS_BACKEND_IMAGE:?set an immutable backend image reference}
    profiles: [runtime]
    command: [dist/src/workers.js]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [app, data]
    environment:
      <<: *strict-local-environment
      MIGRATIONS_HTTP_ENABLED: "false"
      DATABASE_URL_FILE: /run/secrets/worker_database_url
      REDIS_URL_FILE: /run/secrets/redis_worker_url
    secrets:
      - source: worker_database_url
        target: worker_database_url
      - source: postgres_tls_ca
        target: postgres_tls_ca
      - source: redis_worker_url
        target: redis_worker_url
      - source: browser_session_secret
        target: browser_session_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: [CMD, /nodejs/bin/node, dist/src/onprem/worker-health.js]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    cpus: 0.75
    mem_limit: 1536m
    pids_limit: 192
    stop_grace_period: 45s
    logging: *bounded-logging
    labels: *project-labels

  keycloak:
    image: ${KEYCLOAK_IMAGE:?set an immutable built Keycloak image reference}
    profiles: [infra, runtime]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        read_secret_file() { test -r "$1"; value="$$(tr -d '\r\n' < "$1")"; test -n "$${value}"; printf '%s' "$${value}"; }
        export KC_DB=postgres
        export KC_DB_URL="$$(read_secret_file "$${KEYCLOAK_DATABASE_URL_FILE}")"
        export KC_DB_USERNAME="$$(read_secret_file "$${KEYCLOAK_DATABASE_USERNAME_FILE}")"
        export KC_DB_PASSWORD="$$(read_secret_file "$${KEYCLOAK_DATABASE_PASSWORD_FILE}")"
        exec /opt/keycloak/bin/kc.sh start --optimized --http-enabled=true --http-port=8080 --http-management-port=9000 --health-enabled=true --metrics-enabled=true
    expose:
      - "8080"
      - "9000"
    networks: [proxy, data]
    environment:
      KEYCLOAK_DATABASE_URL_FILE: /run/secrets/keycloak_database_url
      KEYCLOAK_DATABASE_USERNAME_FILE: /run/secrets/keycloak_database_username
      KEYCLOAK_DATABASE_PASSWORD_FILE: /run/secrets/keycloak_database_password
      KC_HOSTNAME: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      KC_LOG_LEVEL: info
    volumes:
      - keycloak_data:/opt/keycloak/data
    secrets:
      - source: keycloak_database_url
        target: keycloak_database_url
      - source: keycloak_database_username
        target: keycloak_database_username
      - source: keycloak_database_password
        target: keycloak_database_password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: postgres_tls_ca
        target: postgres_tls_ca
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    cpus: 0.5
    mem_limit: 2048m
    pids_limit: 256
    stop_grace_period: 60s
    logging: *bounded-logging
    labels: *project-labels

  keycloak-bootstrap:
    image: ${KEYCLOAK_IMAGE:?set an immutable built Keycloak image reference}
    profiles: [keycloak-bootstrap]
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh"]
    command: ["/opt/keycloak/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [proxy, data]
    environment:
      KEYCLOAK_SERVER: http://127.0.0.1:8080
      KEYCLOAK_DATABASE_URL_FILE: /run/secrets/keycloak_database_url
      KEYCLOAK_DATABASE_USERNAME_FILE: /run/secrets/keycloak_database_username
      KEYCLOAK_DATABASE_PASSWORD_FILE: /run/secrets/keycloak_database_password
      KEYCLOAK_DB_CA_FILE: /run/secrets/postgres_tls_ca
      KEYCLOAK_REALM: store-ops
      KEYCLOAK_CLIENT_ID: store-ops-admin-web
      KEYCLOAK_REALM_CONFIG_FILE: /opt/keycloak/realm-config.json
      KEYCLOAK_PUBLIC_ORIGIN: https://${HR_AXIS_PUBLIC_HOST:?set the approved internal DNS name}
      KEYCLOAK_BOOTSTRAP_USERNAME_FILE: /run/secrets/keycloak_bootstrap_username
      KEYCLOAK_BOOTSTRAP_PASSWORD_FILE: /run/secrets/keycloak_bootstrap_password
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:?set the approved company SMTP relay host}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-587}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:?set the approved sender address}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-true}
      KEYCLOAK_SMTP_AUTH_USER_FILE: /run/secrets/keycloak_smtp_auth_user
      KEYCLOAK_SMTP_PASSWORD_FILE: /run/secrets/keycloak_smtp_password
      KEYCLOAK_SYNTHETIC_ACCOUNTS_ENABLED: ${KEYCLOAK_SYNTHETIC_ACCOUNTS_ENABLED:-false}
      KEYCLOAK_SYNTHETIC_ACCOUNTS_FILE: /run/secrets/keycloak_synthetic_accounts
      KEYCLOAK_SUBJECT_MANIFEST_DIR: /var/lib/keycloak-bootstrap
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/bootstrap.sh:/opt/keycloak/bootstrap.sh:ro
      - ./keycloak/realm-config.json:/opt/keycloak/realm-config.json:ro
      - keycloak_bootstrap_state:/var/lib/keycloak-bootstrap
    secrets:
      - source: keycloak_bootstrap_username
        target: keycloak_bootstrap_username
      - source: keycloak_bootstrap_password
        target: keycloak_bootstrap_password
      - source: keycloak_database_url
        target: keycloak_database_url
      - source: keycloak_database_username
        target: keycloak_database_username
      - source: keycloak_database_password
        target: keycloak_database_password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: postgres_tls_ca
        target: postgres_tls_ca
      - source: keycloak_smtp_auth_user
        target: keycloak_smtp_auth_user
      - source: keycloak_smtp_password
        target: keycloak_smtp_password
      - source: keycloak_synthetic_accounts
        target: keycloak_synthetic_accounts
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: 0.25
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *bounded-logging
    labels: *project-labels

  identity-binder:
    image: ${HR_AXIS_BACKEND_IMAGE:?set an immutable backend image reference}
    profiles: [identity-binder]
    command: [dist/src/onprem/bind-keycloak-identities.js]
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    networks: [app, data]
    environment:
      NODE_ENV: production
      HR_AXIS_STRICT_LOCAL: "true"
      HR_AXIS_DATA_CLASS: synthetic
      HR_AXIS_PROCESS_ROLE: identity-binder
      AUTH_PROVIDER_KEY: oidc
      DB_SSL_MODE: verify-full
      DATABASE_URL_FILE: /run/secrets/binder_database_url
      DB_SSL_CA_FILE: /run/secrets/postgres_tls_ca
      KEYCLOAK_SYNTHETIC_SUBJECT_MANIFEST_FILE: /var/lib/keycloak-bootstrap/subjects.v1.json
    secrets:
      - source: binder_database_url
        target: binder_database_url
      - source: postgres_tls_ca
        target: postgres_tls_ca
    volumes:
      - keycloak_bootstrap_state:/var/lib/keycloak-bootstrap:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *bounded-logging
    labels: *project-labels

  migrator:
    image: ${HR_AXIS_BACKEND_IMAGE:?set an immutable backend image reference}
    profiles: [migrate]
    command: [dist/src/onprem/migrate.js]
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data]
    environment:
      NODE_ENV: production
      HR_AXIS_STRICT_LOCAL: "true"
      HR_AXIS_DATA_CLASS: synthetic
      HR_AXIS_PROCESS_ROLE: migrator
      MIGRATIONS_HTTP_ENABLED: "false"
      DB_SSL_MODE: verify-full
      DATABASE_URL_FILE: /run/secrets/migrator_database_url
      DB_SSL_CA_FILE: /run/secrets/postgres_tls_ca
    secrets:
      - source: migrator_database_url
        target: migrator_database_url
      - source: postgres_tls_ca
        target: postgres_tls_ca
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *bounded-logging
    labels: *project-labels

  synthetic-seed:
    image: ${HR_AXIS_BACKEND_IMAGE:?set an immutable backend image reference}
    profiles: [seed]
    command: [dist/src/onprem/seed-synthetic.js]
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data]
    environment:
      NODE_ENV: production
      HR_AXIS_STRICT_LOCAL: "true"
      HR_AXIS_DATA_CLASS: synthetic
      HR_AXIS_PROCESS_ROLE: synthetic-seed
      DB_SSL_MODE: verify-full
      DATABASE_URL_FILE: /run/secrets/api_database_url
      DB_SSL_CA_FILE: /run/secrets/postgres_tls_ca
    secrets:
      - source: api_database_url
        target: api_database_url
      - source: postgres_tls_ca
        target: postgres_tls_ca
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *bounded-logging
    labels: *project-labels

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297}
    profiles: [infra, migrate, seed, runtime]
    entrypoint: [/bin/sh, /opt/hr-axis/entrypoint-tls.sh]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/var/lib/postgresql/tls/server.crt, -c, ssl_key_file=/var/lib/postgresql/tls/server.key, -c, ssl_ca_file=/var/lib/postgresql/tls/ca.crt, -c, password_encryption=scram-sha-256]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    expose:
      - "5432"
    networks: [data]
    environment:
      POSTGRES_DB: hr_axis
      POSTGRES_USER: hr_axis_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/entrypoint-tls.sh:/opt/hr-axis/entrypoint-tls.sh:ro
      - ./postgres/010-bootstrap-roles.sh:/docker-entrypoint-initdb.d/010-bootstrap-roles.sh:ro
    secrets:
      - source: postgres_tls_certificate
        target: postgres_tls_certificate
      - source: postgres_tls_private_key
        target: postgres_tls_private_key
      - source: postgres_tls_ca
        target: postgres_tls_ca
      - source: postgres_bootstrap_password
        target: postgres_bootstrap_password
      - source: postgres_migrator_password
        target: postgres_migrator_password
      - source: postgres_api_password
        target: postgres_api_password
      - source: postgres_worker_password
        target: postgres_worker_password
      - source: postgres_keycloak_database_password
        target: keycloak_database_password
        uid: "70"
        gid: "70"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70
      - /var/lib/postgresql/tls:rw,noexec,nosuid,size=16m,uid=70,gid=70
    healthcheck:
      test: [CMD-SHELL, "pg_isready --quiet --username hr_axis_bootstrap --dbname hr_axis"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: 1.0
    mem_limit: 2048m
    pids_limit: 192
    stop_grace_period: 60s
    logging: *bounded-logging
    labels: *project-labels

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98}
    profiles: [infra, migrate, seed, runtime]
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    expose:
      - "6379"
    networks: [data]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    secrets:
      - source: redis_users_acl
        target: redis_users_acl
      - source: redis_health_url
        target: redis_health_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: [CMD-SHELL, "redis-cli -u \"$$(cat /run/secrets/redis_health_url)\" --no-auth-warning PING | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 96
    stop_grace_period: 30s
    logging: *bounded-logging
    labels: *project-labels

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
    labels:
      com.hr-axis.project: hr-axis-onprem-core
      com.hr-axis.data-class: synthetic
      com.hr-axis.release-id: ${HR_AXIS_RELEASE_ID:?set the signed release identity}
      com.hr-axis.network-class: edge
  proxy:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
    labels:
      com.hr-axis.project: hr-axis-onprem-core
      com.hr-axis.data-class: synthetic
      com.hr-axis.release-id: ${HR_AXIS_RELEASE_ID:?set the signed release identity}
      com.hr-axis.network-class: proxy
  app:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24
    labels:
      com.hr-axis.project: hr-axis-onprem-core
