# Explicit operator-selected overlay; base/proof Compose remains synthetic.
# Apply to a reviewed company database only after backup and identity preparation.
services:
  api:
    labels: &company-labels
      com.hr-axis.data-class: company
    environment: &company-data
      HR_AXIS_STRICT_LOCAL: "true"
      HR_AXIS_DATA_CLASS: company
      HR_AXIS_COMPANY_DATA_ENABLED: "true"
      PHOTO_MEDIA_STORAGE_ENABLED: "false"
      KEYCLOAK_SYNTHETIC_PHOTO_PROOF_ENABLED: "false"
  worker:
    labels: *company-labels
    environment: *company-data
  migrator:
    labels: *company-labels
    environment: *company-data
  # Accidental synthetic initialization must fail rather than repopulate demos.
  synthetic-seed:
    labels: *company-labels
    environment: *company-data
  identity-binder:
    labels: *company-labels
    environment: *company-data
  keycloak-bootstrap:
    labels: *company-labels
    environment: *company-data
  caddy:
    labels: *company-labels
  frontend:
    labels: *company-labels
  keycloak:
    labels: *company-labels
    extra_hosts:
      - "smtp.office365.com=172.30.10.40"
    depends_on:
      smtp-egress:
        condition: service_healthy
  smtp-egress:
    image: ${HR_AXIS_BACKEND_IMAGE:?set an immutable backend image reference}
    profiles: [runtime]
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["dist/src/onprem/smtp-egress-proxy.js"]
    networks:
      edge:
        ipv4_address: 172.30.0.40
      proxy:
        ipv4_address: 172.30.10.40
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    expose:
      - "587"
    environment:
      NODE_ENV: production
    healthcheck:
      test: [CMD, /nodejs/bin/node, -e, "require('node:http').get('http://127.0.0.1:1588/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 0.1
    mem_limit: 128m
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      com.hr-axis.project: ${HR_AXIS_PROJECT_ID:-hr-axis-onprem-core}
      com.hr-axis.data-class: company
      com.hr-axis.release-id: ${HR_AXIS_RELEASE_ID:?set the signed release identity}
  redis:
    labels: *company-labels
  postgres:
    labels: *company-labels

networks:
  edge:
    labels: *company-labels
  proxy:
    labels: *company-labels
  app:
    labels: *company-labels
  data:
    labels: *company-labels

volumes:
  postgres_data:
    labels: *company-labels
  redis_data:
    labels: *company-labels
  keycloak_data:
    labels: *company-labels
  keycloak_bootstrap_state:
    labels: *company-labels
