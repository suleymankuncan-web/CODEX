bind 0.0.0.0
protected-mode yes
port 6379
dir /data
aclfile /run/secrets/redis_users_acl
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
maxmemory 640mb
maxmemory-policy noeviction
loglevel notice
logfile ""
