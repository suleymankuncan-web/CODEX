<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LUFIAN Mağaza Yönetim Paneli</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap");

      :root {
        --color-bg: #f8f5fb;
        --color-bg-glacier: #edf7f6;
        --color-surface: rgba(255, 255, 255, 0.88);
        --color-surface-strong: #ffffff;
        --color-surface-soft: rgba(255, 255, 255, 0.68);
        --color-ink: #171421;
        --color-muted: #6c6478;
        --color-quiet: #9e93aa;
        --color-line: rgba(36, 28, 50, 0.1);
        --color-line-strong: rgba(36, 28, 50, 0.18);
        --color-primary: #7c3aed;
        --color-primary-deep: #4c2aa5;
        --color-primary-soft: rgba(124, 58, 237, 0.12);
        --color-blue: #3765ea;
        --color-accent: #13a7b3;
        --color-accent-soft: rgba(19, 167, 179, 0.12);
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-danger: #e11d48;
        --color-focus: rgba(124, 58, 237, 0.22);
        --shadow-soft: 0 18px 48px rgba(32, 24, 48, 0.08);
        --shadow-panel: 0 24px 80px rgba(32, 24, 48, 0.12);
        font-family: "Manrope", "Segoe UI", sans-serif;
        color: var(--color-ink);
        background: var(--color-bg);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background:
          linear-gradient(90deg, rgba(54, 44, 76, 0.045) 1px, transparent 1px),
          linear-gradient(180deg, rgba(54, 44, 76, 0.035) 1px, transparent 1px),
          radial-gradient(circle at 18% 8%, var(--color-primary-soft), transparent 28rem),
          radial-gradient(circle at 88% 10%, var(--color-accent-soft), transparent 26rem),
          linear-gradient(135deg, var(--color-bg) 0%, #fbfcff 48%, var(--color-bg-glacier) 100%);
        background-size: 56px 56px, 56px 56px, auto;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
      }

      .login-shell {
        width: min(100%, 452px);
      }

      .tenant-bar {
        display: grid;
        place-items: center;
        margin-bottom: 16px;
        text-align: center;
      }

      .tenant-name {
        display: grid;
        gap: 4px;
      }

      .tenant-name strong {
        font-size: 21px;
        line-height: 1.1;
        letter-spacing: 0.08em;
      }

      .tenant-name span {
        color: var(--color-muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
      }

      .panel {
        border: 1px solid var(--color-line);
        border-radius: 12px;
        background: var(--color-surface);
        box-shadow: var(--shadow-panel);
        overflow: hidden;
        backdrop-filter: blur(18px);
      }

      .panel-head {
        padding: 22px 22px 16px;
        border-bottom: 1px solid var(--color-line);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .subline {
        margin: 8px 0 0;
        color: var(--color-muted);
        font-size: 13px;
        line-height: 1.45;
      }

      form {
        display: grid;
        gap: 14px;
        padding: 20px 22px 22px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        color: var(--color-ink);
        font-size: 12px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--color-line-strong);
        border-radius: 8px;
        background: var(--color-surface-strong);
        color: var(--color-ink);
        padding: 0 12px;
        font-size: 14px;
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      input::placeholder {
        color: var(--color-quiet);
      }

      input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 4px var(--color-focus);
        background: var(--color-surface-strong);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--color-muted);
        font-size: 12px;
        user-select: none;
      }

      .check input {
        width: 16px;
        min-height: 16px;
        height: 16px;
        accent-color: var(--color-primary);
        padding: 0;
      }

      .link {
        border: 0;
        background: transparent;
        color: var(--color-primary-deep);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        padding: 8px 0;
      }

      .link:focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 3px;
        border-radius: 6px;
      }

      .submit {
        min-height: 44px;
        border: 1px solid var(--color-primary-deep);
        border-radius: 8px;
        background: linear-gradient(135deg, var(--color-primary), var(--color-blue) 58%, var(--color-accent));
        color: #ffffff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .submit:hover {
        background: linear-gradient(135deg, var(--color-primary-deep), var(--color-blue) 58%, var(--color-accent));
        box-shadow: 0 16px 34px rgba(124, 58, 237, 0.24);
      }

      .submit:active {
        transform: translateY(1px);
      }

      .submit:focus-visible {
        outline: 4px solid var(--color-focus);
        outline-offset: 3px;
      }

      .fine-print {
        margin: 12px 4px 0;
        color: var(--color-muted);
        font-size: 11px;
        line-height: 1.45;
        text-align: center;
      }

      .platform-mark {
        width: 42px;
        height: auto;
        position: fixed;
        right: 22px;
        bottom: 20px;
        opacity: 0.72;
        filter: drop-shadow(0 12px 30px rgba(32, 24, 48, 0.1));
        pointer-events: none;
      }

      @media (max-width: 520px) {
        .page {
          align-items: start;
          padding: 18px 14px 64px;
        }

        .tenant-bar {
          margin-top: 8px;
        }

        .tenant-name strong {
          font-size: 19px;
        }

        .panel-head,
        form {
          padding-left: 16px;
          padding-right: 16px;
        }

        .platform-mark {
          right: 16px;
          bottom: 14px;
          width: 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="login-shell" aria-labelledby="login-title">
        <header class="tenant-bar">
          <div class="tenant-name">
            <strong>LUFIAN</strong>
            <span>Mağaza Yönetim Paneli</span>
          </div>
        </header>

        <section class="panel">
          <header class="panel-head">
            <h1 id="login-title">Giriş yap</h1>
          </header>

          <form>
            <div class="field">
              <label for="email">E-posta</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="ornek@lufian.com" />
            </div>

            <div class="field">
              <label for="password">Şifre</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Şifreniz" />
            </div>

            <div class="row">
              <label class="check" for="remember">
                <input id="remember" name="remember" type="checkbox" />
                Beni hatırla
              </label>
              <button class="link" type="button">Yardım al</button>
            </div>

            <button class="submit" type="button">Giriş yap</button>
          </form>
        </section>

        <p class="fine-print">Erişim yetkin yoksa yöneticinle iletişime geç.</p>
      </section>
      <img class="platform-mark" src="assets/hr-axis-06-mark-transparent.png" alt="" />
    </main>
  </body>
</html>
