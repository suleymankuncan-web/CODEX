<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Axis Logo Preview</title>
    <style>
      :root {
        --color-bg: #f8f5fb;
        --color-bg-glacier: #edf7f6;
        --color-ink: #171421;
        --color-muted: #6c6478;
        --color-line: rgba(36, 28, 50, 0.1);
        --shadow-panel: 0 24px 80px rgba(32, 24, 48, 0.12);
        font-family: Manrope, "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--color-ink);
        background:
          linear-gradient(90deg, rgba(54, 44, 76, 0.045) 1px, transparent 1px),
          linear-gradient(180deg, rgba(54, 44, 76, 0.035) 1px, transparent 1px),
          linear-gradient(135deg, var(--color-bg) 0%, #fbfcff 48%, var(--color-bg-glacier) 100%);
        background-size: 56px 56px, 56px 56px, auto;
      }

      main {
        width: min(100%, 860px);
        display: grid;
        gap: 18px;
      }

      .preview-card {
        border: 1px solid var(--color-line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: var(--shadow-panel);
        padding: 28px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 22px;
        color: var(--color-muted);
        font-size: 13px;
      }

      .asset-grid {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 18px;
        align-items: center;
      }

      .asset-box {
        min-height: 180px;
        display: grid;
        place-items: center;
        border: 1px solid var(--color-line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        padding: 22px;
      }

      .asset-box img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      .chip-box {
        min-height: 112px;
      }

      .platform-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        border: 1px solid var(--color-line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--color-muted);
        padding: 6px 12px 6px 8px;
        box-shadow: 0 18px 48px rgba(32, 24, 48, 0.08);
        white-space: nowrap;
      }

      .platform-chip img {
        width: 20px;
        height: 20px;
        border-radius: 7px;
      }

      .platform-chip span {
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 720px) {
        .asset-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="preview-card">
        <h1>HR Axis logo assets</h1>
        <p>Seçilen 06 konseptinden alınan yatay logo, sembol ve mark’tan merkezlenmiş küçük chip kullanımı.</p>
        <div class="asset-grid">
          <div class="asset-box">
            <img src="assets/hr-axis-06-horizontal.png" alt="HR Axis full logo" />
          </div>
          <div class="asset-box chip-box">
            <span class="platform-chip" aria-label="HR Axis">
              <img src="assets/hr-axis-06-chip.png" alt="" />
              <span>HR Axis</span>
            </span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
